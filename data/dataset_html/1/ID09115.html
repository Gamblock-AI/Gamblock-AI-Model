<html lang="id"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Akun</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Arial&display=swap");
      body {
        font-family: Arial, sans-serif;
        background-color: #0d2a58;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><defs><pattern id="d" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><path d="M0 38.5q8 0 8-8V10.5q0-8-8-8h-2.5q-8 0-8 8v20q0 8 8 8Z" stroke-width="2.5" stroke="%2311326c" fill="none"/></pattern></defs><rect width="100%" height="100%" fill="url(%23d)"/></svg>');
        color: #333;
        margin: 0;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .container {
        max-width: 450px;
        width: 100%;
        margin: auto;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        background-color: #fff;
      }
      .message-header {
        text-align: center;
        margin-bottom: 25px;
        padding: 15px;
        background-color: #f0f8ff; /* Warna biru sangat muda */
        border-radius: 8px;
      }
      .message-header h1 {
        font-size: 22px;
        font-weight: 800;
        color: #0d2a58;
        margin: 0 0 10px 0;
      }
      .message-header p {
        font-size: 13px;
        color: #555;
        line-height: 1.5;
        margin: 0;
      }
      .ref-id-text {
        text-align: center;
        margin-bottom: 25px;
        color: #555;
        font-size: 14px;
      } /* Step Navigation */
      .step-group {
        display: flex;
        background-color: #f0f0f0;
        border-radius: 8px;
        padding: 5px;
        margin-bottom: 30px;
      }
      .step-group-item {
        flex: 1;
        text-align: center;
        padding: 10px;
        border-radius: 5px;
        color: #555;
        font-weight: bold;
        font-size: 14px;
        cursor: default;
        transition: all 0.3s ease;
      }
      .step-group-item._active {
        background-color: #0d2a58;
        color: #fff;
      } /* Form Styling */
      form {
        display: block;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-weight: bold;
        color: #333;
        font-size: 14px;
        margin-bottom: 8px;
      }
      input[type="email"],
      input[type="tel"],
      input[type="text"],
      input[type="password"],
      select {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 14px;
        background-color: #f7f7f7;
        color: #333;
      }
      input::placeholder {
        color: #aaa;
      }
      select {
        appearance: none;
        -webkit-appearance: none;
        background-image: url('data:image/svg+xml;utf8,<svg fill="rgba(0, 0, 0, 0.5)" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5H7z"></path></svg>');
        background-position: right 15px center;
        background-size: 12px;
        background-repeat: no-repeat;
        cursor: pointer;
      } /* Button Styling */
      .btn {
        width: 100%;
        padding: 15px;
        margin-top: 10px;
        border: none;
        border-radius: 8px;
        background-color: #0d2a58;
        color: #fff;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      .btn:hover {
        background-color: #1b4a9b;
      }
      .btn:disabled {
        background-color: #999;
        cursor: not-allowed;
      }
      .login-link {
        text-align: center;
        margin-top: 20px;
      }
      .login-link a {
        color: #0d2a58;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="message-header">
        <h1>PENDAFTARAN</h1>
        <p>Pastikan data anda akurat dikarenakan anda akan mendapatkan whatsapp atau telegram yang berisi akun anda! Terima kasih</p>
      </div>
      <div class="ref-id-text">ID Referensi Pendaftaran: <b id="refIdDisplay">0</b></div>
      <div class="step-group">
        <div class="step-group-item _active" id="stepOneGroupItem">Info akun</div>
        <div class="step-group-item" id="stepTwoGroupItem">Informasi pribadi</div>
      </div>
      <form id="registrationForm" novalidate="">
        <div id="stepOneDiv">
          <div class="form-group"><label for="txtLoginName">Nama login</label> <input id="txtLoginName" type="text" placeholder="Masukkan nama login" required=""></div>
          <div class="form-group">
            <label for="gameType">Jenis Permainan</label>
            <select id="gameType" required="">
              <option value="">-- Pilih Jenis Permainan --</option>
              <option value="Sbobet">SBOBET</option>
              <option value="SV388">SV388</option>
              <option value="Slot Online">SLOT ONLINE</option>
              <option value="Sabung Ayam">SABUNG AYAM</option>
              <option value="Bola Parlay">BOLA PARLAY</option>
            </select>
          </div>
          <div class="form-group"><label for="txtPassword">Kata sandi</label> <input id="txtPassword" type="password" placeholder="Masukkan kata sandi" required=""></div>
          <button type="button" id="btnProceedToStepTwo" class="btn">Lanjut</button>
          <div class="login-link"><a href="#">Sudah punya akun?</a></div>
        </div>
        <div id="stepTwoDiv" style="display: none">
          <div class="form-group"><label for="txtFirstName">Nama depan (Sesuai Rekening)</label> <input id="txtFirstName" type="text" placeholder="Nama depan Anda" required=""></div>
          <div class="form-group"><label for="txtLastName">Nama belakang (Sesuai Rekening)</label> <input id="txtLastName" type="text" placeholder="Nama belakang Anda" required=""></div>
          <div class="form-group"><label for="txtEmail">Email</label> <input id="txtEmail" type="email" placeholder="contoh@email.com" required=""></div>
          <div class="form-group"><label for="txtMobile">Nomor handphone</label> <input id="txtMobile" type="tel" placeholder="08123456789" required=""></div>
          <div class="form-group">
            <label for="selected_bank_select">Pilih Bank</label>
            <select id="selected_bank_select" name="SelectedBank" required="">
              <option value="">-- Pilih Bank --</option>
              <option value="ALADIN">ALADIN</option>
              <option value="ALLO BANK">ALLO BANK</option>
              <option value="BANK NEO">BANK NEO</option>
              <option value="BANK PANIN">BANK PANIN</option>
              <option value="BCA">BCA</option>
              <option value="BLU BCA DIGITAL">BLU BCA DIGITAL</option>
              <option value="BNI">BNI</option>
              <option value="BPD">BPD</option>
              <option value="BRI">BRI</option>
              <option value="BSI">BSI</option>
              <option value="BTN">BTN</option>
              <option value="BTPN">BTPN</option>
              <option value="CIMB">CIMB</option>
              <option value="DANA">DANA</option>
              <option value="DANAMON">DANAMON</option>
              <option value="GOPAY">GOPAY</option>
              <option value="JAGO">JAGO</option>
              <option value="LINKAJA">LINKAJA</option>
              <option value="MANDIRI">MANDIRI</option>
              <option value="MAYBANK">MAYBANK</option>
              <option value="OVO">OVO</option>
              <option value="PERMATA">PERMATA</option>
              <option value="SEABANK">SEABANK</option>
            </select>
          </div>
          <div class="form-group"><label for="txtAccountNumber">Nomor Rekening</label> <input id="txtAccountNumber" type="text" placeholder="Masukkan Nomor Rekening Bank Anda" required=""></div>
          <input type="submit" id="btnSubmit" class="btn" value="Daftar Akun">
          <div class="login-link"><a href="#">Sudah punya akun?</a></div>
        </div>
      </form>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        let currentId = localStorage.getItem("referralCounter");
        if (currentId === null) {
          currentId = 0;
        }
        document.getElementById("refIdDisplay").textContent = currentId;
      });
      document.getElementById("btnProceedToStepTwo").addEventListener("click", function () {
        let stepOneValid = true;
        if (document.getElementById("txtLoginName").value.length < 5) {
          alert("Nama login minimal 5 karakter.");
          stepOneValid = false;
        } else if (document.getElementById("gameType").value === "") {
          alert("Silakan pilih jenis permainan.");
          stepOneValid = false;
        } else if (document.getElementById("txtPassword").value.length < 8) {
          alert("Kata sandi minimal 8 karakter.");
          stepOneValid = false;
        }
        if (stepOneValid) {
          document.getElementById("stepOneDiv").style.display = "none";
          document.getElementById("stepTwoDiv").style.display = "block";
          document.getElementById("stepOneGroupItem").classList.remove("_active");
          document.getElementById("stepTwoGroupItem").classList.add("_active");
        }
      });
      document.getElementById("registrationForm").addEventListener("submit", function (e) {
        e.preventDefault();
        const requiredFields = ["txtFirstName", "txtLastName", "txtEmail", "txtMobile", "selected_bank_select", "txtAccountNumber"];
        for (const fieldId of requiredFields) {
          const field = document.getElementById(fieldId);
          if (!field.value) {
            alert(`Kolom "${field.previousElementSibling.textContent}" harus diisi.`);
            field.focus();
            return;
          }
        }
        const submitButton = document.getElementById("btnSubmit");
        submitButton.disabled = true;
        submitButton.value = "Mengirim...";
        const formData = {
          referralId: document.getElementById("refIdDisplay").textContent,
          loginName: document.getElementById("txtLoginName").value,
          gameType: document.getElementById("gameType").value,
          password: document.getElementById("txtPassword").value,
          firstName: document.getElementById("txtFirstName").value,
          lastName: document.getElementById("txtLastName").value,
          email: document.getElementById("txtEmail").value,
          mobile: document.getElementById("txtMobile").value,
          bank: document.getElementById("selected_bank_select").value,
          accountNumber: document.getElementById("txtAccountNumber").value,
        };
        fetch("kirim-server.php", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(formData) })
          .then((response) => response.json())
          .then((data) => {
            if (data.status === "success") {
              alert("Pendaftaran berhasil! Data telah dikirim.");
              let nextId = parseInt(localStorage.getItem("referralCounter") || 0) + 1;
              localStorage.setItem("referralCounter", nextId);
              document.getElementById("refIdDisplay").textContent = nextId;
              document.getElementById("registrationForm").reset();
              document.getElementById("stepTwoDiv").style.display = "none";
              document.getElementById("stepOneDiv").style.display = "block";
              document.getElementById("stepTwoGroupItem").classList.remove("_active");
              document.getElementById("stepOneGroupItem").classList.add("_active");
            } else {
              alert("Gagal mengirim pendaftaran: " + data.message);
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("Terjadi kesalahan jaringan. Silakan coba lagi.");
          })
          .finally(() => {
            submitButton.disabled = false;
            submitButton.value = "Daftar Akun";
          });
      });
    </script>

</body></html>
