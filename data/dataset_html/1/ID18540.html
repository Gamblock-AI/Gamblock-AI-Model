    <script type="text/javascript">
    var fetchInterval; // Variabel untuk menyimpan interval
    
    // Fungsi untuk mengambil durasi dari database
    function getDurasi() {
        $.ajax({
            url: 'get_durasi.php', // File PHP untuk mendapatkan durasi
            method: 'GET',
            dataType: 'json',
            success: function(data) {
                if (data.durasi) {
                    clearInterval(fetchInterval); // Hentikan interval lama jika ada
                    fetchInterval = setInterval(fetchContacts, data.durasi); // Set interval dengan durasi baru
                    console.log('Interval diatur ke: ' + data.durasi / 1000 + ' detik');
                }
            },
            error: function() {
                console.error('Gagal mengambil durasi.');
            }
        });
    }

    // Fungsi untuk mengambil data kontak secara otomatis menggunakan AJAX
    function fetchContacts() {
        $.ajax({
            url: 'get_new_links.php', // File PHP untuk mengambil data secara acak
            method: 'GET',
            dataType: 'json',
            success: function(data) {
                // Perbarui tautan WhatsApp
                if (data.whatsapp1) {
                    $('#whatsappLink1').attr('href', 'https://wa.me/' + data.whatsapp1);
                }
                if (data.whatsapp2) {
                    $('#whatsappLink2').attr('href', 'https://wa.me/' + data.whatsapp2);
                }

                // Perbarui tautan Telegram
                if (data.telegram1) {
                    $('#telegramLink1').attr('href', 'https://t.me/' + data.telegram1);
                }
                if (data.telegram2) {
                    $('#telegramLink2').attr('href', 'https://t.me/' + data.telegram2);
                }

                // Perbarui tautan LiveChat
                if (data.livechat1) {
                    $('#livechatLink1').attr('href', data.livechat1);
                }
                if (data.livechat2) {
                    $('#livechatLink2').attr('href', data.livechat2);
                }
            }
        });
    }

    // Panggil fungsi untuk mendapatkan durasi saat halaman pertama kali dimuat
    $(document).ready(function() {
        getDurasi(); // Ambil durasi dari database
        fetchContacts(); // Ambil data kontak pertama kali
    });
</script>
