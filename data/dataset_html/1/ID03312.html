    <style amp-custom="">
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Oswald', sans-serif;
            background-color: #0a0a0a;
            background-image:
                linear-gradient(rgba(0,15,45,0.82), rgba(0,0,0,0.92)),
                url('https://i.img.it.com/pFN00LwR/ChatGPT-Image-14-Mar-2026-11.42.14.webp');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Inter Milan diagonal stripe */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: repeating-linear-gradient(
                -60deg,
                transparent 0px,
                transparent 20px,
                rgba(0,61,165,0.055) 20px,
                rgba(0,61,165,0.055) 40px
            );
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 420px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 28px 20px 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: stretch;
            position: relative;
            z-index: 1;
        }

        /* LOGO */
        .logo-wrap {
            text-align: center;
            margin-bottom: 8px;
            animation: fadeDown 0.7s ease both;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* TITLE */
        .welcome {
            text-align: center;
            margin-bottom: 14px;
        }

        .welcome h2 {
            font-family: 'Bebas Neue', cursive;
            font-size: 36px;
            letter-spacing: 5px;
            color: #ffffff;
            text-shadow:
                0 0 8px rgba(0,80,200,0.8),
                0 0 22px rgba(0,61,165,0.5),
                0 2px 4px rgba(0,0,0,0.9);
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid #1a5bbf;
            width: 0;
            animation:
                typing 2.8s steps(16, end) 0.3s forwards,
                blink-caret 0.75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0 }
            to   { width: 100% }
        }
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50%      { border-color: #1a5bbf }
        }

        /* BANNER */
        .banner {
            border-radius: 12px;
            box-shadow: 0 0 0 2px #003DA5, 0 0 20px rgba(0,61,165,0.5);
            animation: bannerPulse 3s ease-in-out infinite;
        }

        @keyframes bannerPulse {
            0%, 100% { box-shadow: 0 0 0 2px #003DA5, 0 0 20px rgba(0,61,165,0.45); }
            50%       { box-shadow: 0 0 0 2px #1a6fdd, 0 0 36px rgba(0,90,220,0.75); }
        }

        /* BUTTON WRAP */
        .btn-wrap {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 18px;
        }

        /* BASE BUTTON */
        .btn-login,
        .btn-daftar,
        .btn-linkalternatif {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 13px 16px;
            font-family: 'Bebas Neue', cursive;
            font-size: 22px;
            letter-spacing: 3px;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            position: relative;
            transition: transform 0.12s;
        }

        .btn-login:active,
        .btn-daftar:active,
        .btn-linkalternatif:active {
            transform: scale(0.97);
        }
