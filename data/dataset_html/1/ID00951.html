    <style amp-custom="">
        * {
            box-sizing: border-box;
        }

        body {
            font-family: monospace;
            position: relative;
            background: #000000;
            background-image: radial-gradient(#3a194d 5%, transparent 50%);
            background-size: 5px 5px;
            background-attachment: fixed;
        }

        .container {
            max-width: 400px;
            height: 100vh;
            margin: 0 auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .welcome {
            max-width: 350px;
            margin: 0 auto;
        }

        .welcome h1 {
            font-size: 12px;
            color: #fff;
            overflow: hidden;
            border-right: .15em solid #fbf4a0;
            /* The typwriter cursor */
            white-space: nowrap;
            letter-spacing: .09em;
            animation: typing 3.5s steps(40, end), blink-caret .75s step-end infinite;
        }

        @keyframes typing {
            from {
                width: 0
            }

            to {
                width: 100%
            }
        }

        @keyframes blink-caret {

            from,
            to {
                border-color: transparent
            }

            50% {
                border-color: #fbf4a0;
            }
        }

        .banner {
            border-radius: 10px;
        }

        /* Efek kilauan pada gambar */
        .banner::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.3) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-25deg);
            animation: shine 2.5s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        .btn-login {
            padding: 10px;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            background: linear-gradient(to bottom, #cd5afa 0%, #4f0fa1 100%);
            margin-top: 10px;
            border-radius: 10px;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 10px #8120db;
        }

        .btn-daftar {
            padding: 10px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            background: linear-gradient(to bottom, #cd5afa 0%, #4f0fa1 100%);
            margin-top: 10px;
            border-radius: 10px;
            position: relative;
            z-index: 2;
        }

        .copyright {
            text-align: center;
            color: #ffffff96;
        }

        .nagaterbang {
            position: fixed;
            z-index: 1;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            margin: auto;
        }

        /* Efek kilauan pada tombol */
        .btn-login::after, .btn-daftar::after, .btn-server::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.4) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-25deg);
            animation: shine 2.0s infinite;
        }

        .btn-login:hover, .btn-daftar:hover, .btn-server:hover {
            transform: translateY(-2px);
        }

        /* Efek border animasi untuk tombol */
        .btn-login, .btn-daftar, .btn-server {
            position: relative;
            overflow: hidden;
        }

        .btn-login span, .btn-daftar span, .btn-server span {
            position: absolute;
            pointer-events: none;
        }

        .btn-login span:nth-child(1), 
        .btn-daftar span:nth-child(1), 
        .btn-server span:nth-child(1) {
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(to right, rgba(255,255,255,0), #fff);
            animation: 2s animateTop linear infinite;
        }

        .btn-login span:nth-child(2), 
        .btn-daftar span:nth-child(2), 
        .btn-server span:nth-child(2) {
            top: 0;
            right: 0;
            height: 100%;
            width: 3px;
            background: linear-gradient(to bottom, rgba(255,255,255,0), #fff);
            animation: 2s animateRight linear infinite;
        }

        .btn-login span:nth-child(3), 
        .btn-daftar span:nth-child(3), 
        .btn-server span:nth-child(3) {
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(to left, rgba(255,255,255,0), #fff);
            animation: 2s animateBottom linear infinite;
        }

        .btn-login span:nth-child(4), 
        .btn-daftar span:nth-child(4), 
        .btn-server span:nth-child(4) {
            top: 0;
            left: 0;
            height: 100%;
            width: 3px;
            background: linear-gradient(to top, rgba(255,255,255,0), #fff);
            animation: 2s animateLeft linear infinite;
        }

        /* Animasi untuk border */
        @keyframes animateTop {
