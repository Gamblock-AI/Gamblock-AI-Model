  <script>
    const canvas = document.getElementById("bg");
    const ctx = canvas.getContext("2d");
    let width, height, dpr;
    let time = 0;
    const mouse = { x: 0, y: 0 };
    const target = { x: 0, y: 0 };

    function resize() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    window.addEventListener("pointermove", (e) => {
      const x = (e.clientX / width) * 2 - 1;
      const y = (e.clientY / height) * 2 - 1;
      target.x = x;
      target.y = y;
    });

    let gyroActive = false;
    function handleOrientation(e) {
      if (!gyroActive) return;
      const gamma = e.gamma || 0;
      const beta = e.beta || 0;
      const maxTilt = 30;
      const gx = Math.max(Math.min(gamma / maxTilt, 1), -1);
      const gy = Math.max(Math.min((beta - 45) / maxTilt, 1), -1);
      target.x = gx;
      target.y = gy;
    }
    if (window.DeviceOrientationEvent) {
      if (typeof DeviceOrientationEvent.requestPermission === "function") {
        document.body.addEventListener("click", () => {
          DeviceOrientationEvent.requestPermission().then((res) => {
            if (res === "granted") {
              gyroActive = true;
              window.addEventListener("deviceorientation", handleOrientation);
            }
          });
        }, { once: true });
      } else {
        gyroActive = true;
        window.addEventListener("deviceorientation", handleOrientation);
      }
    }

    function drawMagneticField() {
      time += 0.008;
      mouse.x += (target.x - mouse.x) * 0.06;
      mouse.y += (target.y - mouse.y) * 0.06;
      ctx.clearRect(0, 0, width, height);

      const bgGrad = ctx.createRadialGradient(width*0.5, height*0.0, 0, width*0.5, height*1.0, height);
      bgGrad.addColorStop(0, "#00182a");
      bgGrad.addColorStop(0.5, "#001020");
      bgGrad.addColorStop(1, "#000510");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      const lines = Math.floor(height / 12);
      const spacing = height / lines;
      const centerX = width / 2;

      for (let i = 0; i < lines; i++) {
        const baseY = i * spacing;
        ctx.beginPath();
        let started = false;
        for (let x = 0; x <= width; x += 14) {
          const nx = (x - centerX) / width;
          const radius = Math.sqrt(nx * nx + (i / lines - 0.5) ** 2);
          const magInfluence = Math.sin(radius * 18 - time * 4);
          const curve = Math.sin(nx * 8 + time * 1.4 + i * 0.25) * 18 +
                        Math.sin(nx * 2 - time * 0.8 + i * 0.4) * 10 +
                        magInfluence * 20 +
                        mouse.x * nx * 60 +
                        mouse.y * (i / lines - 0.5) * 30;
          const y = baseY + curve;
          if (!started) { ctx.moveTo(x, y); started = true; } else { ctx.lineTo(x, y); }
        }

        const grad = ctx.createLinearGradient(0, 0, width, 0);
        grad.addColorStop(0.0, "rgba(0, 240, 255, 0.0)");
        grad.addColorStop(0.3, "rgba(0, 200, 255, 0.3)");
        grad.addColorStop(0.7, "rgba(102, 227, 255, 0.7)");
        grad.addColorStop(1.0, "rgba(0, 240, 255, 0.0)");
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.4;
        ctx.globalAlpha = 0.75;
        ctx.shadowColor = "rgba(0, 255, 255, 0.4)";
        ctx.shadowBlur = 8;
        ctx.stroke();
      }

      const glowGrad = ctx.createRadialGradient(width/2 + mouse.x * 40, height/2 + mouse.y * 30, 0, width/2, height/2, Math.max(width, height) * 0.6);
      glowGrad.addColorStop(0, "rgba(0, 255, 255, 0.25)");
      glowGrad.addColorStop(0.4, "rgba(0, 180, 255, 0.1)");
      glowGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.globalAlpha = 1;
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0, 0, width, height);
      requestAnimationFrame(drawMagneticField);
    }
    drawMagneticField();
  </script>
