.feature-spotlight-dialog {
    width: 60%;
    height: 80%;
    max-width: 800px;
}

.feature-spotlight-header {
    padding: 2px 15px;
    font-size: 16px;
    display: flex;
    background-color: #1976D2;
    color: white;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
    height: 50px;
    align-items: center;
    position: relative;
    justify-content: space-between;
}

.feature-spotlight-close-img-div {
    position: absolute;
    right: 0;
}

.feature-spotlight-close-img {
    width: 25px;
    height: 25px;
    margin-top: 5px;
    cursor: pointer;
}

.feature-spotlight-header-text {
    font-size: 18px;
    padding-left: 5px;
}

.feature-spotlight-body {
    background-color: white;
    align-items: center;
    padding: 20px;
    flex-wrap: wrap;
    height: 80%;
}

.feature-spotlight-body-header {
    display: flex;
    justify-content: center;
    background: #F5F5F5;
    padding: 5px 10px;
    margin: auto;
    width: fit-content;
}

.feature-spotlight-body-items {
    max-height: 93%;
    overflow-y: auto;
    -ms-overflow-style: none; /* Internet Explorer 10+ */
    scrollbar-width: none; /* Firefox */
}

.feature-spotlight-body-items::-webkit-scrollbar {
    display: none; /* Safari and Chrome */
}

.feature-spotlight-line-div {
    position: relative;
    padding: 0 20px;
}

.feature-spotlight-line-div::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 1px;
    background-color: #E1E1E1;
}

.feature-spotlight-footer {
    display: flex;
    background-color: white;
    border-bottom-left-radius: 10px;
    border-bottom-right-radius: 10px;
}

.feature-spotlight-row-first-parent {

    margin-top: 15px;
    margin-bottom: 10px;
    min-height: 140px;
}

    display: flex;
    margin-top: 25px;
    margin-bottom: 10px;
    min-height: 140px;
}

.feature-spotlight-row-link {
    position: relative;
    width: 180px;
    margin-right: 15px;
}

.feature-spotlight-right-column {
    flex: 1;
    width: 100%
}

}

.feature-spotlight-row-description {
    font-size: 16px;

}

    font-size: 16px;
    font-weight: 500;
    margin-top: 10px;
    color: #959595;
}

.feature-spotlight-image {
    cursor: pointer;
    width: 180px;
    height: 130px;
    border-radius: 5px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.feature-spotlight-image-overlay {
    cursor: pointer;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.import-question-forms {
    display: flex;
    overflow-y: scroll;
    flex-wrap: wrap;
    max-height: 500px;
}
