pada pertandingan sebelumnya. Kemenangan itu membuat tim Maung Ngora menempati posisi keempat klasemen sementara dengan nilai 40.\u003c/p\u003e\u003cp\u003eDemi kemenangan, Pelatih PERSIB U20, Sabrun Hanapi berharap, para pemainnya bisa tampil lebih baik ketimbang di laga kontra PSM. Menurutnya, penampilan tim Maung Ngora sudah lebih baik dalam beberapa sesi latihan di Bandung.\u003c/p\u003e\u003cp\u003e\"Ini pertandingan yang penting buat kami yang ingin terus mencatatkan hasil positif setelah kemarin menang dari PSM. Kami dari tim pelatih berharap, setiap pemain bisa kembali berkontribusi terhadap tim agar target itu tercapai,\" kata Sabrun, Jumat, 10 April 2026.\u003c/p\u003e\u003cp\u003eDalam pertandingan ini, PERSIB U20 juga akan diperkuat gelandang tim senior, Nazriel Alfaro Syahdan. Sabrun menyebut, kehadiran Nazriel akan semakin menambah kekuatan tim di lini tengah.\u003c/p\u003e\u003cp\u003e\"Alhamdulillah, tim senior juga ingin membantu dengan mengirimkan Nazriel. Tentunya, kehadiran Nazriel akan menjadi tambahan kekuatan untuk tim sekaligus menjadi opsi tambahan bagi tim pelatih di lini tengah,\" terangnya.\u003c/p\u003e\u003cp\u003eSabrun mengatakan, tim asuhannya siap tampil menyerang sejak menit pertama. Namun menurutnya, beban mencetak gol untuk tim tidak hanya menjadi kewajiban sosok striker.\u003c/p\u003e\u003cp\u003eMenjelang pertandingan, PERSIB U20 hanya berlatih ringan di Magelang dengan fokus mengembalikan kebugaran setelah perjalanan delapan jam dari Bandung. Pemulihan kebugaran dilakukan melalui hydro therapy.***\u003c/p\u003e"}],"cover":{"id":29644,"source":"PERSIB.co.id","credit":"Pandu Persada","image":{"data":[{"id":411322,"attributes":{"name":"persib20_kolam_pandu.jpg","alternativeText":null,"caption":null,"width":2048,"height":1200,"formats":{"large":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/large_persib20_kolam_pandu_add1002a4e.jpg","hash":"large_persib20_kolam_pandu_add1002a4e","mime":"imag ntribusi terhadap tim.\u003c/p\u003e\u003cp\u003e\"Tim sangat siap menyambut pertandingan besok. Anak-anak juga sudah semakin solid dan kami semua juga tim pelatih punya komitmen yang kuat untuk pulang ke Bandung dengan raihan 6 poin,\" harapnya.***\u003c/p\u003e"}],"cover":{"id":29643,"source":"PERSIB.co.id","credit":"Pandu Persada","image":{"data":[{"id":411321,"attributes":{"name":"persib18_latihan_pandu.jpg","alternativeText":null,"caption":null,"width":2069,"height":1200,"formats":{"large":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/large_persib18_latihan_pandu_0369f2ec7e.jpg","hash":"large_persib18_latihan_pandu_0369f2ec7e","mime":"image/jpeg","name":"large_persib18_latihan_pandu.jpg","path":null,"size":170.42,"width":1000,"height":580},"small":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/small_persib18_latihan_pandu_0369f2ec7e.jpg","hash":"small_persib18_latihan_pandu_0369f2ec7e","mime":"image/jpeg","name":"small_persib18_latihan_pandu.jpg","path":null,"size":44.6,"width":500,"height":290},"medium":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/medium_persib18_latihan_pandu_0369f2ec7e.jpg","hash":"medium_persib18_latihan_pandu_0369f2ec7e","mime":"image/jpeg","name":"medium_persib18_latihan_pandu.jpg","path":null,"size":97.27,"width":750,"height":435},"thumbnail":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/thumbnail_persib18_latihan_pandu_0369f2ec7e.jpg","hash":"thumbnail_persib18_latihan_pandu_0369f2ec7e","mime":"image/jpeg","name":"thumbnail_persib18_latihan_pandu.jpg","path":null,"size":11.8,"width":245,"height":142}},"hash":"persib18_latihan_pandu_0369f2ec7e","ext":".jpg","mime":"image/jpeg","size":679.58,"url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/persib18_latihan_pandu_0369f2ec7e.jpg","previewUrl":null,"provider":"aws-s3","provider_metadata":null,"createdAt":"2 memimpin klasemen sementara memberikan keuntungan psikologis yang besar. Dengan sisa delapan pertandingan ini, ia menilai upaya merengkuh gelar juara sepenuhnya ditentukan oleh konsistensi tim.\u003c/p\u003e\u003cp\u003e\"Sekarang kami memiliki delapan pertandingan tersisa dan kami memimpin klasemen. Jadi, semuanya ada di tangan kami,\" tegasnya.\u003c/p\u003e\u003cp\u003eDalam kesempatan itu, Putros mengajak rekan-rekannya untuk tetap membumi dan tidak berpikir terlalu jauh ke depan. Fokus dari pertandingan ke pertandingan menjadi kunci utama untuk menjaga posisi di puncak klasemen hingga akhir musim.\u003c/p\u003e\u003cp\u003e\"Kami hanya perlu menjalani satu demi satu pertandingan dan pada akhirnya. Semoga kami bisa menjadi juara,\" tutup Putros.***\u0026nbsp;\u003c/p\u003e"}],"cover":{"id":29642,"source":"PERSIB.co.id","credit":"Sutanto Nurhadi Permana","image":{"data":[{"id":411320,"attributes":{"name":"putros_lathan_sut.jpg","alternativeText":null,"caption":null,"width":2069,"height":1200,"formats":{"large":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/large_putros_lathan_sut_7b3abf46c7.jpg","hash":"large_putros_lathan_sut_7b3abf46c7","mime":"image/jpeg","name":"large_putros_lathan_sut.jpg","path":null,"size":84.52,"width":1000,"height":580},"small":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/small_putros_lathan_sut_7b3abf46c7.jpg","hash":"small_putros_lathan_sut_7b3abf46c7","mime":"image/jpeg","name":"small_putros_lathan_sut.jpg","path":null,"size":26.14,"width":500,"height":290},"medium":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/medium_putros_lathan_sut_7b3abf46c7.jpg","hash":"medium_putros_lathan_sut_7b3abf46c7","mime":"image/jpeg","name":"medium_putros_lathan_sut.jpg","path":null,"size":51.72,"width":750,"height":435},"thumbnail":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/thumbnail_putr ll,"provider":"aws-s3","provider_metadata":null,"createdAt":"2025-08-02T09:37:45.388Z","updatedAt":"2025-08-02T09:40:25.669Z"}}]}},"description":{"id":15645,"content":"\u003cp style=\"margin-left:0px;\"\u003eBermitra sejak 2015, kerjasama antara Indofood dan PERSIB kian selaras karena kedua pihak sama-sama bertujuan going global. Tahun pertama kerjasama keduanya pun ditandai dengan tampil tunggalnya logo Indofood di jersey PERSIB untuk laga di tingkat Asia dan jersey juara Piala Presiden 2015.\u003c/p\u003e\u003cp style=\"margin-left:0px;\"\u003e\u0026nbsp;\u003c/p\u003e\u003cp style=\"margin-left:0px;\"\u003eKomitmen Indofood dalam turut membangun sepakbola Indonesia juga dibuktikan dengan mendukung PERSIB di tingkat pembinaan, baik Diklat ataupun Akademi PERSIB.\u003c/p\u003e\u003cp style=\"margin-left:0px;\"\u003e\u0026nbsp;\u003c/p\u003e\u003cp style=\"margin-left:0px;\"\u003eKeterangan lebih lanjut kunjungi : \u003ca href=\"https://www.indofood.com/\"\u003ehttps://www.indofood.com/\u003c/a\u003e\u003c/p\u003e"}},{"id":12,"__component":"elements.partner-section","name":"KOPI ABC","link":"kopi-abc","logo":{"id":15238,"source":"2","credit":"1","image":{"data":[{"id":402370,"attributes":{"name":"Kopi ABC (1).png","alternativeText":null,"caption":null,"width":228,"height":80,"formats":null,"hash":"Kopi_ABC_1_8c4f55f1dd","ext":".png","mime":"image/png","size":1.73,"url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/Kopi_ABC_1_8c4f55f1dd.png","previewUrl":null,"provider":"aws-s3","provider_metadata":null,"createdAt":"2025-08-02T09:38:02.297Z","updatedAt":"2025-08-02T09:38:02.297Z"}}]}},"description":{"id":15648,"content":"\u003cp style=\"margin-left:0px;\"\u003eMantapnya Kebersamaan Sejak Tahun 2012\u003c/p\u003e\u003cp style=\"margin-left:0px;\"\u003e\u0026nbsp;\u003c/p\u003e\u003cp style=\"margin-left:0px;\"\u003ePergelaran pesta Sepak Bola level teratas di Indonesia yakni Liga 1 yang kian dekat, membuat PERSIB semakin memantapkan persiapan untuk dapat menghadapi pertandingan secara maksimal. Gaungan dukungan pun mulai terdengar, tidak hanya dari Bobotoh saja, melainkan juga datang dari Kopi ABC yang selalu setia menemani langkah pemain PERSIB di lapangan sejak tahun 2012.\u003c/p\u003e\u003cp style=\"margin-left:0px;\"\u003e\u0026nbsp;\u003c/p\u003e\u003cp style=\"margin-left:0px;\"\u003eKopi ABC terus menguatkan tali kebersamaan dengan Maung Bandung agar semakin mantap berprestasi untuk menjadi juara di Liga 1 2021 ini. Selain itu, Kopi ABC juga berkomitmen untuk menjadi Teman Mantap bagi para pendukung PERSIB dan menghangatkan berbagai momen kebersamaan khususnya di saat laga pertandingan berlangsung.\u003c/p\u003e\u003cp style=\"margin-left:0px;\"\u003e\u0026nbsp;\u003c/p\u003e\u003cp style=\"margin-left:0px;\"\u003eMari kita berikan support terbaik untuk PERSIB dan #MantapinAja bareng Kopi ABC!\u003c/p\u003e\u003cp style=\"margin-left:0px;\"\u003e\u0026nbsp;\u003c/p\u003e\u003cp style=\"margin-left:0px;\"\u003eKeterangan lebih lanjut kunjungi: \u003ca href=\"https://www.kopiabc.co.id/\"\u003ehttps://www.kopiabc.co.id/\u003c/a\u003e\u003c/p\u003e"}},{"id":133,"__component":"elements.partner-section","name":"Kelme","link":"kelme","logo":{"id":20061,"source":"kelme","credit":"1","image":{"data":[{"id":402372,"attributes":{"name":"Kelme (1).png","alternativeText":null,"caption":null,"width":228,"height":80,"formats":null,"hash":"Kelme_1_9225cc2f95","ext":".png","mime":"image/png","size":0.86,"url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/Kelme_1_9225cc2f95.png","previewUrl":null,"provider":"aws-s3","provider_metadata":null,"createdAt":"2025-08-02T09:38:48.878Z","updatedAt":"2025-08-02T09:38:48.878Z"}}]}},"description":{"id":20335,"content":"\u003cp\u003eWebsite resmi: \u003ca href=\"https://kelme.com/\"\u003ehttps://kelme.com/\u003c/a\u003e\u003c/p\u003e"}},{"id":134,"__component":"elements.partner-section","name":"Vivo","link":"vivo","logo":{"id":20062,"source":"vivo","credit":" .jpg","previewUrl":null,"provider":"aws-s3","provider_metadata":null,"createdAt":"2026-04-10T07:28:24.436Z","updatedAt":"2026-04-10T07:28:24.436Z"}}}}]},"blocks":[{"id":29883,"__component":"shared.rich-text","content":"\u003cp\u003ePERSIB U16 bertekad meraih kemenangan atas PSIM Yogyakarta pada gim ke-27 Grup B Elite Pro Academy (EPA) Super League 2025/26 di Stadion Gemilang, Kabupaten Magelang, Jawa Tengah, Sabtu, 11 April 2026.\u003c/p\u003e\u003cp\u003eSaat ini, PERSIB U16 menempati peringkat kelima klasemen sementara dengan nilai 35, sama dengan PSIM Yogyakarta yang berada satu strip di atasnya.\u003c/p\u003e\u003cp\u003ePelatih PERSIB U16, Fachrul Ginanjar Sudarmadi menyebut, tim pelatih dan para pemain memiliki komitmen yang sama untuk berjuang memenangkan pertandingan. Untuk itu, tim telah fokus mempersiapkan diri dengan maksimal melalui dua sesi latihan di Bandung.\u003c/p\u003e\u003cp\u003e\"Menghadapi PSIM, anak-anak sudah sangat siap. Kami sudah sampaikan sejak Kamis kalau di dua pertandingan ini harus bisa tampil maksimal,\" kata Fachrul setelah memimpin latihan ringan di Magelang, Jumat, 10 April 2026.\u003c/p\u003e\u003cp\u003e\"Tentunya, kami ingin meraih hasil terbaik 6 poin di dua pertandingan ini. Semoga kami dapat hasil sesuai dengan yang diinginkan,\" tambahnya.\u003c/p\u003e\u003cp\u003eFachrul mengaku telah memetik pelajaran dari pertemuan di putaran pertama. Ketika itu, Maung Ngora mencatatkan sekali imbang dan sekali kalah.\u003c/p\u003e\u003cp\u003e\"Kami akan lihat bagaimana PSIM bermain dan mungkin melakukan sedikit perubahan dari segi style of play. Tapi jika melihat pertandingan terakhir, kami cukup senang dengan apa yang ditampilkan anak-anak,\" pungkasnya.***\u003c/p\u003e"}],"cover":{"id":29641,"source":"PERSIB.co.id","credit":"Pandu Persada","image":{"data":[{"id":411319,"attributes":{"name":"persib16_latihan_pandu.jpg","alternativeText":null,"caption":null,"width":2048,"height":1194,"formats":{"large":{"ext":".jpg","url":"https://ad st-1.amazonaws.com/small_sei_x_psb_web_jpg_79e6abf7e6.jpeg","hash":"small_sei_x_psb_web_jpg_79e6abf7e6","mime":"image/jpeg","name":"small_sei x psb web.jpg.jpeg","path":null,"size":26.72,"width":500,"height":293},"medium":{"ext":".jpeg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/medium_sei_x_psb_web_jpg_79e6abf7e6.jpeg","hash":"medium_sei_x_psb_web_jpg_79e6abf7e6","mime":"image/jpeg","name":"medium_sei x psb web.jpg.jpeg","path":null,"size":52.67,"width":750,"height":439},"thumbnail":{"ext":".jpeg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/thumbnail_sei_x_psb_web_jpg_79e6abf7e6.jpeg","hash":"thumbnail_sei_x_psb_web_jpg_79e6abf7e6","mime":"image/jpeg","name":"thumbnail_sei x psb web.jpg.jpeg","path":null,"size":7.87,"width":245,"height":144}},"hash":"sei_x_psb_web_jpg_79e6abf7e6","ext":".jpeg","mime":"image/jpeg","size":291.44,"url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/sei_x_psb_web_jpg_79e6abf7e6.jpeg","previewUrl":null,"provider":"aws-s3","provider_metadata":null,"createdAt":"2026-04-10T06:15:01.267Z","updatedAt":"2026-04-10T06:15:01.267Z"}}}}]},"blocks":[{"id":29882,"__component":"shared.rich-text","content":"\u003cp\u003ePERSIB resmi menjalin kemitraan strategis dengan Se'Indonesia sebagai mitra sponsor hingga akhir kompetisi I-League musim 2025/2026, sebagai bagian dari upaya menghadirkan pengalaman sepak bola yang lebih terintegrasi dan dapat dirasakan secara konsisten baik di lapangan, di tribun, maupun dalam keseharian Bobotoh.\u003cbr\u003e\u003cbr\u003eKerja sama ini berangkat dari kesamaan visi kedua pihak yang melihat sepak bola tidak hanya sebagai pertandingan, tetapi juga sebagai ruang yang menyatukan berbagai lapisan masyarakat melalui nilai disiplin, kerja keras, konsistensi, dan kolaborasi. Nilai-nilai tersebut juga menjadi fondasi yang dipegang oleh Se'Indonesia sebagai brand kuliner lokal yang terus berkembang.\u003cbr\u003e\u003cbr\u003eMelalui proses diskusi yang berlangsung secara eksploratif, kedua pihak merancang sinergi yang tidak hanya berfokus pada visibilitas, tetapi juga menghadirkan peran nyata dalam ekosistem sepak bola. Salah satu fokus utama dari kolaborasi ini adalah peran Se'Indonesia dalam mendukung kebutuhan nutrisi sebagai bagian penting dari performa di lapangan, sekaligus melengkapi pengalaman Bobotoh dalam setiap momen pertandingan.\u003cbr\u003e\u003cbr\u003eSebagai salah satu klub dengan basis pendukung terbesar di Indonesia, PERSIB dikenal memiliki kekuatan komunitas yang solid dan hidup. Hal ini sejalan dengan semangat Se'Indonesia sebagai brand lokal yang tumbuh dari akar yang sama dan memiliki ambisi untuk terus berkembang hingga ke level global.\u003cbr\u003e\u003cbr\u003eKerja sama ini akan diimplementasikan melalui berbagai aktivasi, baik di dalam stadion maupun secara digital. Kehadiran Se'Indonesia akan terlihat melalui berbagai titik interaksi, mulai dari area stadion, program komunitas, hingga kampanye digital yang melibatkan Bobotoh secara langsung.\u003cbr\u003e\u003cbr\u003eKolaborasi ini memperkuat peran SeIndonesia bukan hanya sebagai quick service restaurant, tetapi sebagai brand yang tumbuh bersama masyarakat, sekaligus mempererat kedekatan dengan komunitas Bobotoh dan hadir dalam setiap momen kebersamaan. Sementara bagi PERSIB, langkah ini menjadi bagian dari upaya berkelanjutan dalam menghadirkan pengalaman pertandingan yang lebih holistik bagi para pendukungnya.\u003cbr\u003e\u003cbr\u003eDengan kesamaan nilai dan visi yang semakin kuat, tidak menutup kemungkinan kerja sama ini akan berlanjut dalam jangka panjang, seiring dengan komitmen kedua pihak untuk terus tumbuh bersama dan memberikan dampak positif yang lebih luas bagi komunitas serta ekosistem sepak bola Indonesia.\u003cbr\u003e\u003cbr\u003eDalam kesempatan tersebut, Deputy CEO PT PERSIB Bandung Bermartabat, Adhitia Putra Herawan, menyampaikan bahwa kerja sama ini merupakan refleksi dari bagaimana kekuatan brand lokal dapat saling menguatkan.\u003cbr\u003e\u003cbr\u003e\"PERSIB selalu percaya bahwa sepak bola memiliki kekuatan untuk menyatukan banyak hal, bukan hanya di dalam lapangan, tetapi juga dalam kehidupan sehari-hari. Kehadiran Se'Indonesia sebagai mitra menjadi bagian dari upaya kami untuk terus menghadirkan pengalaman yang lebih relevan dan dekat dengan Bobotoh,\" katanya.\u003cbr\u003e\u003cbr\u003e\"Kami melihat kesamaan nilai yang kuat, mulai dari konsistensi, semangat untuk terus berkembang, hingga komitmen terhadap komunitas. Harapannya, kerja sama ini tidak hanya memberikan dampak positif bagi kedua brand, tetapi juga bisa menjadi bagian dari perjalanan Bobotoh dalam menikmati setiap momen bersama PERSIB,\" tambahnya.\u003cbr\u003e\u003cbr\u003e\"Lebih dari itu, ini juga menjadi bukti bahwa brand lokal memiliki potensi besar untuk tumbuh bersama dan melangkah lebih jauh, bahkan hingga ke tingkat global,\" ujar Adhit.\u003cbr\u003e\u003cbr\u003eSementara itu, Founder \u0026amp; CEO Se'Indonesia, Rinaldi Dharma Utama, menyampaikan bahwa kemitraan ini dilandasi oleh semangat kebersamaan dan kecintaan terhadap Indonesia.\u003cbr\u003e\u003cbr\u003e\"Kami melihat sepak bola sebagai ruang yang menyatukan banyak cerita, tentang kerja keras, konsistensi, dan kebanggaan terhadap identitas. PERSIB merepresentasikan hal tersebut dengan sangat kuat,\" katanya.\u003cbr\u003e\u003cbr\u003e\"Bagi Se'Indonesia, ini bukan sekadar kerja sama, tetapi kesempatan untuk tumbuh bersama komunitas. Kami ingin hadir lebih dekat, menjadi bagian dari momen-momen yang dirasakan Bobotoh, tidak hanya di stadion, tetapi juga dalam keseharian. Sekaligus membawa pesan bahwa brand lokal juga bisa berjalan berdampingan untuk terus berkembang dan melangkah lebih jauh,\" tambahnya.\u003cbr\u003e\u003cbr\u003e\"Ke depan, kami terbuka untuk melanjutkan perjalanan ini lebih panjang. Selama nilai yang kami bangun bersama tetap sejalan, kami percaya kolaborasi ini dapat terus berkembang dan memberikan manfaat yang lebih besar,\" tegasnya.\u003cbr\u003e\u003cbr\u003eKerja sama antara PERSIB dan Se'Indonesia menjadi contoh bagaimana brand lokal dapat tumbuh bersama melalui kekuatan komunitas, sekaligus memperkuat ekosistem sepak bola Indonesia yang terus berkembang.***\u003c/p\u003e"}],"cover":{"id":29640,"source":"PERSIB.co.id","credit":null,"image":{"data":[{"id":411318,"attributes":{"name":"sei x psb web.jpg.jpeg","alternativeText":null,"caption":null,"width":2048,"height":1200,"formats":{"large":{"ext":".jpeg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/large_sei_x_psb_web_jpg_79e6abf7e6.jpeg","hash":"large_sei_x_psb_web_jpg_79e6abf7e6","mime":"image/jpeg","name":"large_sei x psb web.jpg.jpeg","path":null,"size":87.05,"width":1000,"height":586},"small":{"ext":".jpeg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/small_sei_x_psb_web_jpg_79e6abf7e6.jpeg","hash":"small_sei_x_psb_web_jpg_79e6abf7e6","mime":"image/jpeg","name":"small_sei x psb web.jpg.jpeg","path":null,"size":26.72,"width":500,"height":293},"medium":{"ext":".jpeg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/medium_sei_x_psb_web_jpg_79e6abf7e6.jpeg","hash":"medium_sei_x_psb_web_jpg_79e6abf7e6","mime":"image/jpeg","name":"medium_sei x psb web.jpg.jpeg","path":null,"size":52.67,"width":750,"height":439},"thumbnail":{"ext":".jpeg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/thumbnail_sei_x_psb_web_jpg_79e6abf7e6.jpeg","hash":"thumbnail_sei_x_psb_web_jpg_79e6abf7e6","mime":"image/jpeg","name":"thumbnail_sei x psb web.jpg.jpeg","path":null,"size":7.87,"width":245,"height":144}},"hash":"sei_x_psb_web_jpg_79e6abf7e6","ext":".jpeg","mime":"image/jpeg","size":291.44,"url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/sei_x_psb_web_jpg_79e6abf7e6.jpeg","previewUrl":null,"provider":"aws-s3","provider_metadata":null,"createdAt":"2026-04-10T06:15:01.267Z","updatedAt":"2026-04-10T06: s":{"large":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/large_nobar_web_bali_824eb2a5f6.jpg","hash":"large_nobar_web_bali_824eb2a5f6","mime":"image/jpeg","name":"large_nobar-web_bali.jpg","path":null,"size":80.88,"width":1000,"height":586},"small":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/small_nobar_web_bali_824eb2a5f6.jpg","hash":"small_nobar_web_bali_824eb2a5f6","mime":"image/jpeg","name":"small_nobar-web_bali.jpg","path":null,"size":28.45,"width":500,"height":293},"medium":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/medium_nobar_web_bali_824eb2a5f6.jpg","hash":"medium_nobar_web_bali_824eb2a5f6","mime":"image/jpeg","name":"medium_nobar-web_bali.jpg","path":null,"size":52.09,"width":750,"height":439},"thumbnail":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/thumbnail_nobar_web_bali_824eb2a5f6.jpg","hash":"thumbnail_nobar_web_bali_824eb2a5f6","mime":"image/jpeg","name":"thumbnail_nobar-web_bali.jpg","path":null,"size":9.48,"width":245,"height":144}},"hash":"nobar_web_bali_824eb2a5f6","ext":".jpg","mime":"image/jpeg","size":241.13,"url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/nobar_web_bali_824eb2a5f6.jpg","previewUrl":null,"provider":"aws-s3","provider_metadata":null,"createdAt":"2026-04-10T04:34:05.536Z","updatedAt":"2026-04-10T04:34:05.536Z"}}}}]},"blocks":[{"id":29881,"__component":"shared.rich-text","content":"\u003cp\u003eAntusiasme Bobotoh menyambut laga krusial kembali memuncak. Pada Minggu, 12 April 2026, PERSIB akan menghadapi Bali United pada pekan ke-27 Super League 2025/26, sebuah pertandingan penting dalam perjalanan Maung Bandung menjaga peluang meraih gelar juara untuk ketiga kalinya secara beruntun.\u003c/p\u003e\u003cp\u003eBagi Bobotoh yang belum mendapatkan tiket ke Stadion Gelora Bandung Lautan Api (GBLA), pengalaman mendukung PERSIB tetap bisa dirasakan secara maksimal melalui Nobar Biru yang digelar di dua lokasi strategis: CGV Paris Van Java (PVJ) Mall dan Graha PERSIB, Jalan Sulanjana No.17, Kota Bandung.\u003c/p\u003e\u003cp\u003eSaat ini, PERSIB masih kokoh di puncak klasemen dengan 61 poin, unggul empat angka dari pesaing terdekat, Borneo FC. Setiap pertandingan menjadi semakin krusial, dan dukungan Bobotoh, di mana pun berada, menjadi energi tambahan bagi tim di lapangan.\u003c/p\u003e\u003cp\u003eTak hanya soal posisi di klasemen, laga ini juga menyimpan cerita personal. Penjaga gawang andalan PERSIB, Teja Paku Alam, tengah memburu rekor nirbobol terbanyak dalam satu musim, mendekati pencapaian legendaris Yoo Jae-hoon (2013). Hingga saat ini, Teja telah mencatatkan 16 clean sheets, dan peluang untuk menorehkan sejarah semakin terbuka.\u003c/p\u003e\u003cp\u003eNobar Biru hadir bukan sekadar alternatif, tetapi menjadi ruang temu bagi Bobotoh untuk tetap merasakan atmosfer pertandingan secara kolektif, penuh semangat, dan emosional.\u003c/p\u003e\u003cp\u003eDi CGV PVJ, pengalaman menonton di layar lebar dengan kualitas audio-visual premium akan menghadirkan sensasi pertandingan yang imersif dan nyaman. Tiket tersedia dengan harga Rp85.000 dan dapat dibeli melalui aplikasi CGV, website resmi, maupun langsung di lokasi.\u003c/p\u003e\u003cp\u003eSementara itu, Nobar Biru di Graha PERSIB menghadirkan nilai tambah bagi loyalitas Bobotoh. Penonton berkesempatan mendapatkan tiket pertandingan kandang berikutnya. Khusus pemegang Passport PERSIB akan memperoleh 1 stamp, dan MemberSIB akan mendapatkan 6 poin MemberSIB sebagai bagian dari ekosistem engagement PERSIB.\u003c/p\u003e\u003cp\u003eKini, pertanyaannya sederhana: masih ingin melewatkan momen penting ini sendirian?\u003c/p\u003e\u003cp\u003eAjak keluarga, sahabat, dan komunitasmu. Datang, berkumpul, dan jadilah bagian dari energi besar yang terus mengiringi langkah PERSIB menuju sejarah baru.\u003c/p\u003e\u003cp\u003eKarena di mana pun kita berada, duku e\u003cp\u003e\"Kami bermain di kandang. Kami selalu memiliki keuntungan dari para Bobotoh. Jadi saya berharap kami akan mendapatkan hasil positif,\" tutup pelatih asal Kroasia itu. ***\u003c/p\u003e"}],"cover":{"id":29638,"source":"PERSIB.co.id","credit":"Barly Isham","image":{"data":[{"id":411316,"attributes":{"name":"bojan_barly2.jpg","alternativeText":null,"caption":null,"width":2048,"height":1200,"formats":{"large":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/large_bojan_barly2_9d498d0cd5.jpg","hash":"large_bojan_barly2_9d498d0cd5","mime":"image/jpeg","name":"large_bojan_barly2.jpg","path":null,"size":44.3,"width":1000,"height":586},"small":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/small_bojan_barly2_9d498d0cd5.jpg","hash":"small_bojan_barly2_9d498d0cd5","mime":"image/jpeg","name":"small_bojan_barly2.jpg","path":null,"size":15.43,"width":500,"height":293},"medium":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/medium_bojan_barly2_9d498d0cd5.jpg","hash":"medium_bojan_barly2_9d498d0cd5","mime":"image/jpeg","name":"medium_bojan_barly2.jpg","path":null,"size":28.01,"width":750,"height":439},"thumbnail":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/thumbnail_bojan_barly2_9d498d0cd5.jpg","hash":"thumbnail_bojan_barly2_9d498d0cd5","mime":"image/jpeg","name":"thumbnail_bojan_barly2.jpg","path":null,"size":5.57,"width":245,"height":144}},"hash":"bojan_barly2_9d498d0cd5","ext":".jpg","mime":"image/jpeg","size":148.51,"url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/bojan_barly2_9d498d0cd5.jpg","previewUrl":null,"provider":"aws-s3","provider_metadata":null,"createdAt":"2026-04-10T03:01:13.777Z","updatedAt":"2026-04-10T03:01:13.777Z"}}]}},"total_reactions":0,"reaction_counts":{}}},{"id":30099,"attributes":{"name":"Suporter Bali United Dilarang ke GBLA","newsSummary":"Sesuai regulasi, I.\u003c/p\u003e\u003cp\u003eHead of Communication PT PERSIB Bandung Bermartabat, Adhi Pratama, menjelaskan, kepatuhan terhadap Regulasi Liga 1 2025/26 Pasal 5 Ayat 7 masih berlaku. Pelanggaran terhadap aturan ini tidak hanya berimbas pada denda finansial, tetapi juga kerugian reputasi bagi kedua klub.\u003c/p\u003e\u003cp\u003e\"Kami tidak ingin ada pihak yang dirugikan, baik itu PERSIB maupun tim tamu. Oleh karena itu, aturan pelarangan suporter tamu ini harus benar-benar dijalankan dengan disiplin,\" tegas Adhi.\u003c/p\u003e\u003cp\u003eSebagai langkah preventif, Panitia Pelaksana (Panpel) telah menyiapkan skema pemeriksaan ketat di setiap ring pengamanan menuju area stadion. Petugas akan memastikan tidak ada atribut maupun pendukung tim lawan yang masuk ke tribun.\u003c/p\u003e\u003cp\u003eAdhi menambahkan, suporter tamu yang kedapatan hadir di lokasi akan langsung dipulangkan demi menjaga kondusivitas. Selain itu, tiket yang sudah dibeli oleh suporter tamu dipastikan hangus tanpa ada mekanisme refund atau pengembalian uang.\u003c/p\u003e\u003cp\u003e\"Kami meminta kerja sama dari teman-teman suporter Bali United untuk mendukung tim kesayangan dari rumah saja. Ini demi kebaikan bersama dan masa depan sepak bola kita,\" tambahnya.\u003c/p\u003e\u003cp\u003eDi sisi lain, Adhi juga mengingatkan Bobotoh agar tetap tertib dan hanya membeli tiket melalui kanal resmi PERSIB Apps. Penggunaan tiket resmi menjadi bagian penting dari sistem keamanan terpadu yang diterapkan klub untuk laga besar ini.***\u003c/p\u003e"}],"cover":{"id":29637,"source":"PERSIB.co.id","credit":null,"image":{"data":[{"id":402409,"attributes":{"name":"tanpa_supporter_tamu_web_new.jpg","alternativeText":null,"caption":null,"width":1024,"height":600,"formats":{"large":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/large_tanpa_supporter_tamu_web_new_5d9a2347eb.jpg","hash":"large_tanpa_supporter_tamu_web_new_5d9a2347eb","mime":"image/jpeg","name":"large_tanpa_s g","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/large_Crowd_PERSIB_x_Weekend_Offender_2_d557647775.jpg","hash":"large_Crowd_PERSIB_x_Weekend_Offender_2_d557647775","mime":"image/jpeg","name":"large_Crowd-PERSIB-x-Weekend-Offender---2.jpg","path":null,"size":81.75,"width":1000,"height":568},"small":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/small_Crowd_PERSIB_x_Weekend_Offender_2_d557647775.jpg","hash":"small_Crowd_PERSIB_x_Weekend_Offender_2_d557647775","mime":"image/jpeg","name":"small_Crowd-PERSIB-x-Weekend-Offender---2.jpg","path":null,"size":26.94,"width":500,"height":284},"medium":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/medium_Crowd_PERSIB_x_Weekend_Offender_2_d557647775.jpg","hash":"medium_Crowd_PERSIB_x_Weekend_Offender_2_d557647775","mime":"image/jpeg","name":"medium_Crowd-PERSIB-x-Weekend-Offender---2.jpg","path":null,"size":51.63,"width":750,"height":426},"thumbnail":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/thumbnail_Crowd_PERSIB_x_Weekend_Offender_2_d557647775.jpg","hash":"thumbnail_Crowd_PERSIB_x_Weekend_Offender_2_d557647775","mime":"image/jpeg","name":"thumbnail_Crowd-PERSIB-x-Weekend-Offender---2.jpg","path":null,"size":8.65,"width":245,"height":139}},"hash":"Crowd_PERSIB_x_Weekend_Offender_2_d557647775","ext":".jpg","mime":"image/jpeg","size":272.32,"url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/Crowd_PERSIB_x_Weekend_Offender_2_d557647775.jpg","previewUrl":null,"provider":"aws-s3","provider_metadata":null,"createdAt":"2026-04-09T04:44:52.111Z","updatedAt":"2026-04-09T04:44:52.111Z"}}}}]},"blocks":[{"id":29878,"__component":"shared.rich-text","content":"\u003cp\u003eGraha PERSIB, Kamis pagi, 9 April 2026. Jam baru menunjukkan pukul 08.00 WIB, tetapi halaman sudah dipenuhi ratusan Bobotoh. Mereka datang dengan harapan yang sama, yaitu bisa pulang membawa jersey kolaborasi PERSIB dan Weekend Offender yang baru dirilis.\u003c/p\u003e\u003cp\u003eWeekend Offender adalah merek pakaian streetwear populer asal Britania Raya (Wales) yang didirikan pada tahun 2004 oleh Sam Jones dan Rhydian Powell. Merek ini berakar pada subkultur casual sepak bola Inggris dan sering dikaitkan dengan estetika jalanan, desain sederhana, serta citra \"kenakalan\" akhir pekan.\u003c/p\u003e\u003cp\u003eMereka datang bergelombang. Dari sudut-sudut Kota Bandung, bahkan dari luar daerah. Ada yang datang berdua, ada pula yang berkelompok, berbagi cerita di sela antrean. Tak sedikit yang rela berangkat sejak pagi buta, demi memastikan diri tak kehabisan jersey idaman.\u003c/p\u003e\u003cp\u003eDi lantai 1, antrean panjang terbentuk untuk pengambilan nomor. Barisan itu menjalar pelan hingga ke trotoar, menjadi pemandangan yang tak asing bagi kota yang hidup bersama sepak bola. Namun di balik panjangnya antrean, tak ada riuh yang berlebihan. Semua berjalan tertib.\u003c/p\u003e\u003cp\u003ePetugas mengarahkan dengan sigap. Satu per satu, Bobotoh menerima nomor antrean, tiket kecil menuju harapan besar. Tepat pukul 09.35 WIB, gelombang pertama mulai bergerak naik ke lantai 2, menuju PERSIB Store.\u003c/p\u003e\u003cp\u003eDi dalam, suasana terasa lebih teratur. Alur antrean dibentuk rapi, ritmenya dijaga. Setiap pembeli diberi batas maksimal dua potong jersey. Sebuah aturan sederhana untuk memastikan euforia ini bisa dirasakan lebih banyak orang.\u003c/p\u003e\u003cp\u003eBagi Bobotoh, ini bukan sekadar membeli jersey. Ini tentang identitas, tentang kebanggaan yang dikenakan di dada. Kolaborasi ini menjadi simbol baru, pertemuan antara semangat klub dan gaya yang lebih luas.\u003c/p\u003e\u003cp\u003eDi tengah antrean yang panjang dan waktu yang terus berjalan, ada satu hal yang tetap terjaga, yaitu kesabaran. Karena bagi mereka, menunggu bukan sekadar proses, melainkan bagian dari perjalanan menjadi Bobotoh.\u003c/p\u003e\u003cp\u003eSalah satunya Fanny, Bobotoh asal Cikutra, Kota Bandung, yang sudah mengantre sejak pukul 08.30 WIB. Ia mengaku sengaja datang lebih pagi demi memastikan bisa mendapatkan jersey incaran. Meski harus menunggu, Fanny menilai proses yang diterapkan cukup baik.\u003c/p\u003e\u003cp\u003e\"Saya sengaja datang untuk membeli jersey PERSIB x Weekend Offender. Senang banget karena akhirnya bisa mendapatkannya meskipun harus mengantre sejak pagi. Secara umum, semuanya berjalan tertib dan teratur,\" ujarnya.\u003c/p\u003e\u003cp\u003eIa juga mengapresiasi pengaturan antrean dan pembatasan jumlah pembelian yang diterapkan oleh PERSIB Store. Menurutnya, langkah tersebut membuat suasana tetap nyaman dan adil bagi semua Bobotoh yang datang.\u003c/p\u003e\u003cp\u003eKedekatan PERSIB dan Bobotoh\u003c/p\u003e\u003cp\u003eDi balik antusiasme yang terlihat sejak pagi, VP Commercial PT PERSIB Bandung Bermartabat, Budi Ulia, menilai momen ini sebagai refleksi kuatnya kedekatan antara PERSIB dan Bobotoh, sekaligus sinyal positif bagi pengembangan brand ke depan.\u003c/p\u003e\u003cp\u003e\"Yang kami lihat hari ini bukan hanya antrean, tetapi bentuk keterikatan yang kuat antara PERSIB dan Bobotoh. Kolaborasi ini menjadi cara kami untuk menghadirkan PERSIB tidak hanya di dalam pertandingan, tetapi juga dalam gaya hidup sehari-hari,\" ujarnya.\u003c/p\u003e\u003cp\u003eIa menambahkan, kolaborasi dengan Weekend Offender menjadi bagian dari langkah strategis PERSIB dalam memperluas jangkauan brand, tanpa meninggalkan identitas yang telah mengakar kuat. \"Kami ingin PERSIB tetap relevan di berbagai ruang, termasuk di industri lifestyle. Antusiasme Bobotoh hari ini menunjukkan bahwa ada kebutuhan dan kebanggaan untuk mengekspresikan identitas itu dengan cara yang berbeda,\" tambahnya.\u003c/p\u003e\u003cp\u003eLebih lanjut, ia melihat keberhasilan peluncuran ini sebagai awal dari peluang yang lebih besar di masa mendatang. \"Ini menjadi energi bagi kami untuk terus menghadirkan inovasi yang tidak hanya kuat secara komersial, tetapi juga memiliki makna bagi Bobotoh. Karena pada akhirnya, setiap produk yang kami hadirkan harus bisa menjadi bagian dari perjalanan mereka sebagai Bobotoh,\" ujar Budi.***\u003c/p\u003e"}],"cover":{"id":29636,"source":"PERSIB.co.id","credit":null,"image":{"data":[{"id":411315,"attributes":{"name":"Crowd-PERSIB-x-Weekend-Offender---2.jpg","alternativeText":null,"caption":null,"width":2048,"height":1163,"formats":{"large":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/large_Crowd_PERSIB_x_Weekend_Offender_2_d557647775.jpg","hash":"large_Crowd_PERSIB_x_Weekend_Offender_2_d557647775","mime":"image/jpeg","name":"large_Crowd-PERSIB-x-Weekend-Offender---2.jpg","path":null,"size":81.75,"width":1000,"height":568},"small":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/small_Crowd_PERSIB_x_Weekend_Offender_2_d557647775.jpg","hash":"small_Crowd_PERSIB_x_Weekend_Offender_2_d557647775","mime":"image/jpeg","name":"small_Crowd-PERSIB-x-Weekend-Offender---2.jpg","path":null,"size":26.94,"width":500,"height":284},"medium":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/medium_Crowd_PERSIB_x_Weekend_Offender_2_d557647775.jpg","hash":"medium_Crowd_PERSIB_x_Weekend_Offender_2_d557647775","mime":"image/jpeg","name":"medium_Crowd-PERSIB-x-Weekend-Offender---2.jpg","path":null,"size":51.63,"width":750,"height":426},"thumbnail":{"ext":".jpg","url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/thumbnail_Crowd_PERSIB_x_Weekend_Offender_2_d557647775.jpg","hash":"thumbnail_Crowd_PERSIB_x_Weekend_Offender_2_d557647775","mime":"image/jpeg","name":"thumbnail_Crowd-PERSIB-x-Weekend-Offender---2.jpg","path":null,"size":8.65,"width":245,"height":139}},"hash":"Crowd_PERSIB_x_Weekend_Offender_2_d557647775","ext":".jpg","mime":"image/jpeg","size":272.32,"url":"https://adt-persib-app-production.s3.ap-southeast-1.amazonaws.com/Crowd_PERSIB_x_Weekend_Offe
