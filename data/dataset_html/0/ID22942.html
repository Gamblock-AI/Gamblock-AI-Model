<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
      color: #ffffff;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 50px 30px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }

    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 15px;
      font-weight: 700;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
      color: #e2e8f0;
      margin-bottom: 15px;
    }

    .highlight {
      color: #38bdf8;
      font-weight: bold;
    }

    .footer {
      margin-top: 25px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
      transition: 0.3s ease;
    }

    .button:hover {
      background: #0ea5e9;
      color: #ffffff;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 28px;
      }

      p {
        font-size: 16px;
      }

      .container {
        padding: 35px 20px;
      }

      .icon {
        font-size: 50px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🛠️</div>
    <h1>This Page Is Under Maintenance</h1>
    <p>
      Our website is currently undergoing <span class="highlight">scheduled maintenance</span>.
    </p>
    <p>
      We’ll be back online as soon as possible. Thank you for your patience.
    </p>
    <a href="/" class="button">Return to Homepage</a>
    <div class="footer">
      © 2026 All rights reserved.
    </div>
  </div>
