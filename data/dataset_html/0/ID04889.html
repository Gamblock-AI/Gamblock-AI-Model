<html lang="en"><head>
	<title>VPN Portal</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta http-equiv="cache-control" content="max-age=0, no-cache, no-store, must-revalidate">
	<meta http-equiv="expires" content="0">
	<meta http-equiv="pragma" content="no-cache">
	<link href="/themes/lite1/css/typography.css?version=202509262044" rel="stylesheet" type="text/css">
	<link rel="stylesheet" href="/themes/lite1/css/loginstylesheet.css?version=202509262044" type="text/css">
	<link rel="ICON" href="/images/favicon.ico?version=202509262044">
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<script type="text/javascript" src="/javascript/validation/OEM.js?version=202509262044"></script>
</head>

<body onload="document.forms[0].username.focus(); document.forms[0].username.select();initLogin();">
	<noscript>
		<div>
			<h2>Your browser does not support JavaScript or it is disabled!<br>Without JavaScript support user portal
				will not work.</h2>
		</div>
	</noscript>
	<form onsubmit="return false;" method="post">
		<div id="htmlData">
			<div id="wrapper">
				<div id="header">
					<div class="language_select">
						<select name="languageid" id="languageid" onchange="loadLanguageFile(this.value)">
						<option value="1" selected="selected">English</option><option value="3">繁体中文</option><option value="4">简体中文</option><option value="5">French</option><option value="6">日本語</option><option value="7">German</option><option value="8">Italian</option><option value="9">Korean</option><option value="10">Brazilian-Portuguese</option><option value="11">Russian</option><option value="12">Spanish</option></select>
					</div>
				</div>
				<div id="content-area">
					<div id="sectionL" class="left">

						<div class="login_form" id="credentialdiv" style="margin-bottom: 5px;">

							<img src="/images/logo/group-small-on-dark.png?version=202509262044" alt="" style="border:0px;">
							<div class="login_detail" id="normalTBody" style="margin-bottom:8px">
								<label id="Language.Username">Username</label>
								<input name="username" type="text" id="username" size="30" maxlength="60">

								<label id="Language.Password">Password</label>
								<input name="password" type="password" id="password" value="" size="30" autocomplete="off" maxlength="60" onfocus="if(this.value=='Password')this.value='';">



								<input onclick="return callLogin()" class="blue_btn" name="loginbutton" value="Login" type="submit">
									<div id="ssolink" style="margin-top: 200px;display:none;text-align:center">
										<a href="#" onclick="redirectToVPNSSO();" id="ssolinktext"></a>
									</div>
							</div>

						</div>
						<div class="login_form" id="ssopagediv" style="margin-top:150px;display:none">
							<img src="/images/logo/group-small-on-dark.png?version=202509262044" alt="" style="border:0px;margin:0px 30px">
							<input onclick="redirectToVPNSSO()" class="blue_btn" style="white-space: normal;" name="ssologinbutton" value="Single sign-on" type="button">
							<input onclick="displayCredDiv()" class="secondary_btn" name="credloginbutton" value="Credential Login" type="button">
						</div>
						<span class="small_txt" id="copyrightyear">© 2026 Sophos Ltd.</span>
						<div id="message"></div>
						<div id="userportal_link" style="margin-top: 280px; text-align: center;">
							<a href="#" onclick="loginuserportal()" style="color:#1987CB;" id="userportalURL">Take me to User portal</a>
						</div>
					</div>

					<div id="sectionR" class="right">
						<img src="/images/bannerVP.png?version=202509262044" alt="" style="border:0px;">
					</div>
				</div>
			</div>
		</div>
		<script language="JavaScript" src="/javascript/lang/English/common.js?version=202509262044"></script>
		<script type="text/javascript" src="/javascript/jQueryYUI.js?version=202509262044"></script>
		<script type="text/javascript" src="/javascript/react-combo.min.js?version=202509262044"></script>
		<script language="JavaScript" src="/javascript/common_min.js?version=202509262044"></script>
		<script type="text/javascript" src="/javascript/validation/login.js?version=202509262044"></script>
	</form>



</body></html>
