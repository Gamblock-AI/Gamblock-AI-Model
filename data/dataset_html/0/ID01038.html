        function collapseClose(target) {

            $('.btn-landing').each(function(){
                var id = $(this).attr('target');

                if(target != id){
                    $(this).children('.unit-lp').removeClass('active');
                    $(this).attr('aria-expanded', false);
                }
            });

            $('.sublanding').each(function(){
                var id = $(this).attr('id');

                if(target != id){
                    $(this).css('display', 'none');
                }
            });

            console.log('Close');

        }

        function collapseCheck(thisObj, target, expand){

            console.log('Check');

            if(expand == 'true'){
                thisObj.attr('aria-expanded', false);
                thisObj.children('.unit-lp').removeClass('active');
                $(target).fadeOut(1000);
            }
            else{
                thisObj.attr('aria-expanded', true);
                thisObj.children('.unit-lp').addClass('active');
                $(target).fadeIn(1000);
            }
        }
