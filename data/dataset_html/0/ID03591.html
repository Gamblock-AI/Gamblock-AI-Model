<html lang="en"><head>
  <meta charset="UTF-8">
  <title>Half-Screen Button</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
    }

    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50vw;
      height: 50vh;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      font-weight: bold;
      border: none;
    }
    
    video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 75vw;
      height: 75vh;
            transform: translate(-50%, -50%);

    }
  </style>
</head>
<body>
<button id="startBtn">Klik Disini Untuk Masuk</button>
<video id="myVideo" loop="" style="display:none">
  <source src="wkwkwk.mp4" type="video/mp4">
</video>

<script>
  const btn = document.getElementById('startBtn');
  const video = document.getElementById('myVideo');

  btn.addEventListener('click', () => {
      video.style.display = '';
    video.play();
    btn.style.display = 'none';
    
  });
</script>
