min-w-0 _justify-center _pb-8 _pr-[calc(env(safe-area-inset-right)-1.5rem)]"><main class="_w-full _min-w-0 _max-w-6xl _px-6 _pt-4 md:_px-12"><div class="nextra-breadcrumb _mt-1.5 _flex _items-center _gap-1 _overflow-hidden _text-sm _text-gray-500 dark:_text-gray-400 contrast-more:_text-current"><span class="_whitespace-nowrap _transition-colors _min-w-6 _overflow-hidden _text-ellipsis" title="Docs">Docs</span><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" height="14" class="_shrink-0 rtl:_rotate-180"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path></svg><a class="_whitespace-nowrap _transition-colors _min-w-6 _overflow-hidden _text-ellipsis nextra-focus _ring-inset hover:_text-gray-900 dark:hover:_text-gray-100" title="Privacy" href="/docs/privacy">Privacy</a><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" height="14" class="_shrink-0 rtl:_rotate-180"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path></svg><span class="_whitespace-nowrap _transition-colors _font-medium _text-gray-700 contrast-more:_font-bold contrast-more:_text-current dark:_text-gray-100 contrast-more:dark:_text-current" title="Protecting User Data">Protecting User Data</span></div><h1 class="_mt-2 _text-4xl _font-bold _tracking-tight _text-slate-900 dark:_text-slate-100">Protecting User Data: Opting users out of tracking and anonymizing data</h1>
<!-- -->
<h2 id="overview" class="_font-semibold _tracking-tight _text-slate-900 dark:_text-slate-100 _mt-10 _border-b _pb-1 _text-3xl _border-neutral-200/70 contrast-more:_border-neutral-400 dark:_border-primary-100/10 contrast-more:dark:_border-neutral-400">Overview<a href="#overview" class="nextra-focus subheading-anchor" aria-label="Permalink for this section"></a></h2>
<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7">Mixpanel gives you full control over the data you send to Mixpanel and provides you with the tools necessary to respect a customer’s request to opt out of tracking. When a user is opted out, no data is sent to Mixpanel for that user, meaning their events won’t be tracked or available in Mixpanel. Here, we share best practices for tracking in a privacy-friendly way.</p>
<h2 id="opting-users-out-of-tracking" class="_font-semibold _tracking-tight _text-slate-900 dark:_text-slate-100 _mt-10 _border-b _pb-1 _text-3xl _border-neutral-200/70 contrast-more:_border-neutral-400 dark:_border-primary-100/10 contrast-more:dark:_border-neutral-400">Opting Users Out of Tracking<a href="#opting-users-out-of-tracking" class="nextra-focus subheading-anchor" aria-label="Permalink for this section"></a></h2>
<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7">Mixpanel’s client-side libraries include an ‘opt_out’ method that allows you to manage a user’s request to opt out of tracking. This allows you to quickly flag a user when they choose to opt out of tracking during the cookie consent management process.</p>
<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7">The client-side ‘opt_out’ method sets a flag in the user’s browser cookie or local storage, preventing data from being sent to Mixpanel. The opt-out state persists across sessions, meaning that if a user has opted out, they will remain opted out even if they close and reopen the app or website, unless the cookie/local storage is cleared or they explicitly opt back in.</p>
<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7">For mobile SDKs, when the ‘opt_out’ method is called, any events and people updates that have not been sent to Mixpanel (i.e., those still in the local queue) are deleted from the device. This ensures that even data collected just before opting out, like App Open events, does not get sent to Mixpanel.</p>
<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7">Once opted out, the Mixpanel SDKs will continue to function normally, but will not send any data to the Mixpanel project. This means that calls to tracking methods, like track or identify, will essentially be ignored for the opted-out user.</p>
<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7">The client-side ‘opt out’ call will not affect server-side events. For server-side implementations, you need to manage the opt-out process manually. The server is responsible for generating IDs, maintaining ID persistence, and managing the opt-out state of users.</p>

<h2 id="opting-users-in-for-tracking" class="_font-semibold _tracking-tight _text-slate-900 dark:_text-slate-100 _mt-10 _border-b _pb-1 _text-3xl _border-neutral-200/70 contrast-more:_border-neutral-400 dark:_border-primary-100/10 contrast-more:dark:_border-neutral-400">Opting Users In For Tracking<a href="#opting-users-in-for-tracking" class="nextra-focus subheading-anchor" aria-label="Permalink for this section"></a></h2>
<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7">The ‘Opt In’ methods in used to allow users to opt into tracking after they have been previously opted out or when the SDK is initialized with users opted out by default.</p>
<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7">When the Opt In method is called, it triggers an event called “$opt_in”, which appears as “Opt In” in your project. This event is sent to Mixpanel to indicate that the user has opted into tracking. Locally, a flag is set in the user’s cookie/local storage to indicate to the SDK that the user consents to data tracking.</p>
<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7">After calling the ‘Opt In’ method, Mixpanel will start collecting and sending data for that user. This includes events, user properties, and other tracking information.</p>

<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7">You can also disable geolocation for individual payloads by setting the <code class="nextra-code" dir="ltr">ip</code> property value to 0. Learn more about ignoring IP addresses <a class="nextra-focus _text-primary-600 _underline hover:_no-underline _decoration-from-font [text-underline-position:from-font]" href="/docs/tracking-best-practices/geolocation#ignore-ip-address">here</a>.</p>
<h2 id="anonymizing-users" class="_font-semibold _tracking-tight _text-slate-900 dark:_text-slate-100 _mt-10 _border-b _pb-1 _text-3xl _border-neutral-200/70 contrast-more:_border-neutral-400 dark:_border-primary-100/10 contrast-more:dark:_border-neutral-400">Anonymizing Users<a href="#anonymizing-users" class="nextra-focus subheading-anchor" aria-label="Permalink for this section"></a></h2>
<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7">Mixpanel does not know, or need to know, any identifying information about users (like email or phone number). Mixpanel only needs to know that a set of events was performed by a particular user ID. You choose the ID and how you want to send that to Mixpanel.</p>
<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7">If you want to analyze aggregate user behavior without being able to drill down into any particular user, we recommend generating a hash of some unique ID of the user and using that hash as the user’s ID when you call the <code class="nextra-code" dir="ltr">.identify()</code> method in our SDKs.</p>
<h2 id="blacklisting-default-properties" class="_font-semibold _tracking-tight _text-slate-900 dark:_text-slate-100 _mt-10 _border-b _pb-1 _text-3xl _border-neutral-200/70 contrast-more:_border-neutral-400 dark:_border-primary-100/10 contrast-more:dark:_border-neutral-400">Blacklisting Default Properties<a href="#blacklisting-default-properties" class="nextra-focus subheading-anchor" aria-label="Permalink for this section"></a></h2>
<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7">Our JavaScript library <a class="nextra-focus _text-primary-600 _underline hover:_no-underline _decoration-from-font [text-underline-position:from-font]" href="/docs/data-structure/property-reference/default-properties">automatically captures default properties</a> to help enrich your data, but you can choose to prevent the setting of default properties using the property_blacklist config option.&nbsp;To prevent default event properties from being sent, specify a list of properties to blacklist on library load, for example:</p>
<div class="nextra-code _relative [&amp;:not(:first-child)]:_mt-6"><pre class="nextra-focus _overflow-x-auto _subpixel-antialiased _text-[.9em] _bg-white dark:_bg-black _py-4 _ring-1 _ring-inset _ring-gray-300 dark:_ring-neutral-700 contrast-more:_ring-gray-900 contrast-more:dark:_ring-gray-50 contrast-more:_contrast-150 _rounded-md" tabindex="0"><code class="nextra-code" dir="ltr"><span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8">mixpanel.</span><span style="--shiki-light:#6F42C1;--shiki-dark:#B392F0">init</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8">(</span><span style="--shiki-light:#032F62;--shiki-dark:#9ECBFF">"YOUR_TOKEN"</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8">, {</span></span>
<span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8">  property_blacklist: [</span><span style="--shiki-light:#032F62;--shiki-dark:#9ECBFF">'$referrer'</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8">, </span><span style="--shiki-light:#032F62;--shiki-dark:#9ECBFF">'custom_property'</span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8">]</span></span>
<span><span style="--shiki-light:#24292E;--shiki-dark:#E1E4E8">});</span></span></code></pre><div class="_opacity-0 _transition [div:hover&gt;&amp;]:_opacity-100 focus-within:_opacity-100 _flex _gap-1 _absolute _right-4 _top-2"><button class="_transition _border _border-gray-300 dark:_border-neutral-700 contrast-more:_border-gray-900 contrast-more:dark:_border-gray-50 _rounded-md _p-1.5 md:_hidden" title="Toggle word wrap" type="button" data-headlessui-state=""><svg viewBox="0 0 24 24" fill="currentColor" height="16"><path d="M4 19h6v-2H4v2zM20 5H4v2h16V5zm-3 6H4v2h13.25c1.1 0 2 .9 2 2s-.9 2-2 2H15v-2l-3 3l3 3v-2h2c2.21 0 4-1.79 4-4s-1.79-4-4-4z"></path></svg></button><button class="_transition _border _border-gray-300 dark:_border-neutral-700 contrast-more:_border-gray-900 contrast-more:dark:_border-gray-50 _rounded-md _p-1.5" title="Copy code" type="button" data-headlessui-state=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" height="16" class="nextra-copy-icon"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4C2.89543 15 2 14.1046 2 13V4C2 2.89543 2.89543 2 4 2H13C14.1046 2 15 2.89543 15 4V5"></path></svg></button></div></div>
<h2 id="faq" class="_font-semibold _tracking-tight _text-slate-900 dark:_text-slate-100 _mt-10 _border-b _pb-1 _text-3xl _border-neutral-200/70 contrast-more:_border-neutral-400 dark:_border-primary-100/10 contrast-more:dark:_border-neutral-400">FAQ<a href="#faq" class="nextra-focus subheading-anchor" aria-label="Permalink for this section"></a></h2>
<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7"><strong>Is opting users out of tracking compliant with privacy regulations like GDPR?</strong></p>
<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7">While Mixpanel provides tools to help our customers remain compliant with privacy regulations (such as methods for opting users in and out of tracking), it is the responsibility of the implementing company to ensure compliance with privacy regulations. Typically, organizations must obtain explicit consent from individuals before collecting, using, or sharing their personal data.</p>
<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7">For GDPR purposes, Mixpanel is considered the data processor, whereas you (the customer) are considered the data controller. Your end user’s data is your responsibility.</p>
<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7"><strong>Can users request a copy of their data?</strong></p>
<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7">Yes, Mixpanel provides tools for handling user data requests. However, it is important to note that Mixpanel doesn’t handle end-users’ requests directly. The company implementing Mixpanel is responsible for using Mixpanel’s tools to fetch the data and provide it to its end-users. Learn more about our <a class="nextra-focus _text-primary-600 _underline hover:_no-underline _decoration-from-font [text-underline-position:from-font]" href="https://developer.mixpanel.com/reference/create-retrieval-1" target="_blank" rel="noreferrer">GDPR Data Retrieval API Endpoint</a>.</p>
<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7"><strong>What happens to previously collected data when a user opts out?</strong></p>
<p class="[&amp;:not(:first-child)]:_mt-6 _leading-7">When a user is opted out of tracking, no subsequent data moving forward is sent to Mixpanel for that user. This means that future events won’t be tracked or available in Mixpanel. However, data previously collected will remain in your project until the data retention period has passed, a data deletion is performed for that user’s data, or a GDPR deletion is requested and performed. Learn more about <a class="nextra-focus _text-primary-600 _underline hover:_no-underline _decoration-from-font [text-underline-position:from-font]" href="/docs/data-governance/data-clean-up#2-deleting-problematic-data">Data Deletion</a> and <a class="nextra-focus _text-primary-600 _underline hover:_no-underline _decoration-from-font [text-underline-position:from-font]" href="/docs/privacy/end-user-data-management">GDPR Deletion requests</a>.</p><div class="_mt-16"></div><div class="_mb-8 _flex _items-center _border-t _pt-8 dark:_border-neutral-800 contrast-more:_border-neutral-400 dark:contrast-more:_border-neutral-400 print:_hidden"><a title="Privacy" class="nextra-focus _text-gray-600 dark:_text-gray-400 hover:_text-gray-800 dark:hover:_text-gray-200 contrast-more:_text-gray-700 contrast-more:dark:_text-gray-100 _flex _max-w-[50%] _items-center _gap-1 _py-4 _text-base _font-medium _transition-colors [word-break:break-word] md:_text-lg ltr:_pr-4 rtl:_pl-4" href="/docs/privacy"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" class="_inline _h-5 _shrink-0 ltr:_rotate-180"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path></svg>Privacy</a><a title="GDPR Compliance" class="nextra-focus _text-gray-600 dark:_text-gray-400 hover:_text-gray-800 dark:hover:_text-gray-200 contrast-more:_text-gray-700 contrast-more:dark:_text-gray-100 _flex _max-w-[50%] _items-center _gap-1 _py-4 _text-base _font-medium _transition-colors [word-break:break-word] md:_text-lg ltr:_ml-auto ltr:_pl-4 ltr:_text-r
