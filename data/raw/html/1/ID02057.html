    <style amp-custom="">
      :root {
        --bg: #0e1016;
        --card: #171a22;
        --text: #e8ebf0;
        --muted: #9aa3b2;
        --brand: #3b82f6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        background: radial-gradient(1200px 800px at 50% -200px, #a41919 0%, #780d0d 60%);
        color: var(--text);
      }
      header {
        padding: 20px 16px 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 12px;
        background: rgba(255,255,255,0.05);
        box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 6px 24px rgba(0,0,0,0.35);
      }
      .logo span { font-weight: 700; letter-spacing: .4px; }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      }
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      /* Gambar responsif */
      .logo-img { width: 100%; max-width: 250px; }
      .hero-img { width: 100%; max-width: 500px; }
      .hero amp-img {
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 12px 28px rgba(0,0,0,0.45);
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        width: 100%;
        margin-top: 8px;
      }
      .btn {
        text-decoration: none;
        display: inline-block;
        text-align: center;
        padding: 12px 14px;
        border-radius: 12px;
        font-weight: 700;
        letter-spacing: .3px;
        border: 1px solid transparent;
      }
