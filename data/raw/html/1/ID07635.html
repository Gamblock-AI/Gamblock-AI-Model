  <style amp-custom="">
    * {
      box-sizing: border-box;

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Open Sans', sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
      position: relative;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(0, 0, 0, 0.08) 0, transparent 25%),
        radial-gradient(circle at 80% 30%, rgba(0, 0, 0, 0.08) 0, transparent 20%),
        radial-gradient(circle at 50% 80%, rgba(0, 0, 0, 0.05) 0, transparent 25%);
    }

    .snow,
    .snow::before,
    .snow::after {
      content: "";
      position: fixed;
      top: -120%;
      left: 0;
      width: 100%;
      height: 220%;
      pointer-events: none;
      z-index: 1;
      background-repeat: repeat;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .snow {
      background-image:
        radial-gradient(circle, #00b2ff 1.2px, transparent 1.6px),
        radial-gradient(circle, #00b2ff 2px, transparent 2.4px),
        radial-gradient(circle, #ffe550cc 1.5px, transparent 2px);
      background-size: 120px 120px, 180px 180px, 240px 240px;
      background-position: 0 0, 40px 70px, 90px 20px;
      filter: drop-shadow(0 0 5px #00b2ff);
      animation: snowFall1 18s linear infinite;
    }

    .snow::before {
      background-image:
        radial-gradient(circle, #00b2ff 1.5px, transparent 2px),
        radial-gradient(circle, #00b2ff 2.2px, transparent 2.8px);
      background-size: 160px 160px, 220px 220px;
      background-position: 20px 20px, 100px 120px;
      opacity: 0.85;
      filter: drop-shadow(0 0 6px #ff0000bf);
      animation: snowFall2 24s linear infinite;
    }

    .snow::after {
      background-image:
        radial-gradient(circle, #00b2ff 2px, transparent 2.6px),
        radial-gradient(circle, #00b2ff 1.3px, transparent 1.8px);
      background-size: 200px 200px, 140px 140px;
      background-position: 60px 50px, 10px 100px;
      opacity: 0.65;
      filter: drop-shadow(0 0 8px #00b2ff);
      animation: snowFall3 30s linear infinite;
    }

    @keyframes snowFall1 {
      from { transform: translateY(0); }
      to { transform: translateY(55%); }
    }

    @keyframes snowFall2 {
      from { transform: translateY(0) translateX(0); }
      to { transform: translateY(60%) translateX(20px); }
    }

    @keyframes snowFall3 {
      from { transform: translateY(0) translateX(0); }
      to { transform: translateY(65%) translateX(-20px); }
    }

    .page {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 6px 16px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .top-gif-link {
      display: inline-block;
      margin-top: 2px;
      line-height: 0;
      text-decoration: none;
    }

    .top-gif {
      display: block;
      margin: 0 auto 2px;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.55));
    }

    .top-heading {
      margin: 0 0 14px;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      color: #d9d9d9;
      text-shadow: 0 0 8px rgba(255,255,255,0.18);
      line-height: 1.35;
    }

    .link-bar {
      width: 100%;
      max-width: 320px;
      margin: 0 auto 18px;
      padding: 0;
      border: 2px solid #000000;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.78);
      text-decoration: none;
      display: block;
      overflow: hidden;
      box-shadow:
        0 0 10px #00b2ff,
        0 0 22px #ffa60073,
        inset 0 0 8px #ffe60026;
    }

    .marquee-track {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      padding: 10px 0;
    }

    .marquee-text {
      display: inline-block;
      min-width: 100%;
      padding-left: 100%;
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      text-shadow: 0 0 8px rgb(255, 255, 255);
      animation: runningText 10s linear infinite;
    }

    @keyframes runningText {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .card {
      width: 100%;
      max-width: 340px;
      margin: 0 auto;

      width: 100%;
