      :root {
        --primary-color: #000;
        --secondary-color: #DAA520; 
        --accent-color: #ffb500;
        --text-color: #ffffff;
        --background-color: #000000;
      }
      body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, var(--background-color), #1a1a1a);
        color: var(--text-color);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .dompleng {
        background-color: rgba(0, 0, 0, 0.8);
        border: 2px solid var(--primary-color);
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        animation: simple-pulse 2s infinite alternate;
      }
      @keyframes simple-pulse {
        0% { transform: scale(1); }
        100% { transform: scale(1.05); }
      }
      header {
        text-align: center;
      }
      header amp-anim {
        border: 4px solid var(--primary-color);
        border-radius: 20px;
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        margin: 0 auto;
        animation: pulse-border 2s infinite;
      }
      header amp-anim:hover {
        animation: grow-pulse 1s infinite;
      }
      @keyframes pulse-border {
        0% { 
          border-color: var(--primary-color);
          box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        50% {
          border-color: var(--accent-color);
          box-shadow: 0 0 30px rgba(184, 134, 11, 0.6); 
        }
        100% {
          border-color: var(--primary-color);
          box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
      }
      @keyframes grow-pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
      @keyframes elegant-gradient {
        0% { background: linear-gradient(45deg, #14213d, #000000); }
        50% { background: linear-gradient(45deg, #2c3e50, #2980b9); }
        100% { background: linear-gradient(45deg, #14213d, #000000); }
      }
      @keyframes subtle-pulse {
        0% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.95; transform: scale(1.02); }
        100% { opacity: 1; transform: scale(1); }
      }
      .btn {
        display: block;
        width: 90%;
        max-width: 280px;
        margin: 12px auto;
        padding: 12px 20px;
        color: #ffffff;
        text-decoration: none;
        border-radius: 25px;
        font-weight: 700;
        font-size: 16px;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 2px;
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
        animation: float 3s ease-in-out infinite;
        background-color: rgba(0,0,0,0.8);
      }
      .btn:hover {
        transform: translateY(-5px) scale(1.02);
        letter-spacing: 4px;
        border-radius: 50px;
        border-color: rgba(255,255,255,0.8);
        background: rgba(0,0,0,0.9);
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.6),
                   0 0 12px rgba(255, 255, 255, 0.4),
                   0 0 16px rgba(0, 255, 255, 0.4),
                   0 0 20px rgba(0, 255, 255, 0.2);
      }
      .btn.login {
        background: linear-gradient(45deg, #000000, #4a3000);
        background-size: 200% 200%;
        border-radius: 50px;
        box-shadow: 0 0 6px rgba(255, 255, 255, 0.6),
                   0 0 10px rgba(255, 255, 255, 0.4),
                   0 0 14px rgba(255, 215, 0, 0.4),
                   0 0 18px rgba(255, 215, 0, 0.2);
        animation: gradient-pulse 3s ease infinite;
        border-image: linear-gradient(45deg, #ffd700, #ffeb99) 1;
      }
      .btn.daftar {
        background: linear-gradient(45deg, #000000, #4a3000);
        background-size: 200% 200%;
        border-radius: 50px;
        box-shadow: 0 0 6px rgba(255, 255, 255, 0.6),
                   0 0 10px rgba(255, 255, 255, 0.4),
                   0 0 14px rgba(218, 165, 32, 0.4),
                   0 0 18px rgba(218, 165, 32, 0.2);
        animation: gradient-pulse 3s ease infinite;
        border-image: linear-gradient(45deg, #daa520, #ffd700) 1;
      }
      .btn.bonus {
        background: linear-gradient(45deg, #000000, #4a3000);
        background-size: 200% 200%;

        box-shadow: 0 0 6px rgba(255, 255, 255, 0.6),

        animation: gradient-pulse 3s ease infinite;
        border-image: linear-gradient(45deg, #b8860b, #daa520) 1;

      @keyframes gradient-shift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }

        content: '';

        top: 0;

        width: 100%;
        height: 100%;

          transparent,
          rgba(255, 255, 255, 0.6),
          transparent
        );
        animation: shine-slide 3s infinite;

      @keyframes shine-effect {
        0% { transform: scale(1); }
        50% { transform: scale(1.02); }
        100% { transform: scale(1); }
      }
      @keyframes shine-slide {
        0% { left: -100%; }
        50% { left: 100%; }
        100% { left: -100%; }
      }
      hr {
