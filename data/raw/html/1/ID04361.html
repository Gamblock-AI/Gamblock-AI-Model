    <style amp-custom="">
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        max-width: 500px;
        margin: 0 auto;
        background: url("") center/cover fixed no-repeat;
        background-color: black;
      }

      body {
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
      }

      a, a:hover, a:visited {
        text-decoration: none;
        color: #dfdfdf;
      }

      .atas {
        display: grid;
        min-height: 85vh;
        place-items: center;
      }

      .atasbox {
        margin: auto;
        width: 100%;
        padding: 10px;
      }

      /* Gambar utama */
      .imghero {
        display: block;
        width: 100%;
        max-width: 480px;
        height: auto;
        border-radius: 10px;
        border: 2px solid #ffffff;
        margin: 1rem auto;
        object-fit: cover;
        opacity: 0;
        animation: fadeInUp 1.5s ease-out forwards;
      }

      /* Animasi fade-in */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Tombol */
      .ataslink {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
        width: 100%;
        max-width: 480px;
        margin: 1rem auto;
        padding: 0 10px;
        opacity: 0;
        animation: slideUp 2s ease-out 0.5s forwards;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(50px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .ataslink a {
        color: #ffffff;
        font-size: 0.95em;
        font-weight: bold;
        text-transform: uppercase;
        padding: 14px 25px;
        border-radius: 25px;
        border: 3px double transparent;
        background-image: linear-gradient(#b317c8, #44003e),
        radial-gradient(circle at left top, #ffffff, #ffffff);
        background-origin: border-box;
        background-clip: padding-box, border-box;
        transition: 0.4s all;
        display: block;
        width: 100%;
      }

      .ataslink a:hover {
        color: #faff00;
        background-image: linear-gradient(#44003e, #b317c8),
        radial-gradient(circle at left top, #ff0000, #ff0000);
        transform: scale(1.05);
      }

      /* Efek detak teks */
      #debar {
        animation: beat 2s ease-in-out infinite;
      }

      @keyframes beat {
        0%, 50%, 100% { transform: scale(1); }
        25%, 75% { transform: scale(0.95); }
      }

      /* Footer */
      .footer {
        font-size: 0.8em;
        color: #eee;
        margin-top: 20px;
        opacity: 0;
        animation: fadeIn 3s ease-out 1.5s forwards;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      /* Responsif */
      @media (max-width: 480px) {
        html { max-width: 100%; }
        .ataslink a { font-size: 0.85em; padding: 12px 20px; }
        .imghero { max-width: 360px; }
      }
    </style>
