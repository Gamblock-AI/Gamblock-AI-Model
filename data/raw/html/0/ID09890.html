<script type="text/javascript">(function(){Vue.component('select2', {
  template: '#template-select2',
  props: [

    'text_kode_nama', 'is_numeric',
    'template_result'
  ],
  mounted,
  computed: {
    multiple
  },
  watch: {
    value(v) {
      $(this.$el).val(v)
        .trigger('change');
    },
    options(options) {
      let value = this.value;
      $(this.$el)
        .empty()
        .select2({
          placeholder: this.placeholder || '',
          data: textify.call(this, options),
          templateResult: this.template_result
        })
        .val(value)
        .trigger('change');
    }
  },
  destroyed
});

function mounted() {
  $(this.$el)
    .select2({
      placeholder: this.placeholder || '',
      data: textify.call(this, this.options),
      templateResult: this.template_result
    })
    .val(this.value)
    .trigger('change')
    .on('change', changed.bind(this));
}

function textify(options) {
  let tkn = this.text_kode_nama;
  return options.map(e => {
    return tkn ? _.assign({
      text: `${e.kode} - ${e.nama}`
    }, e) : e;
  });
}

function multiple() {
  return typeof this.$el.getAttribute('multiple') === 'string';
}

function changed() {
  let v = $(this.$el).val();
  let v1 = parseValue.call(this, v);
  let v2 = parseValue.call(this, this.value);
  let same = JSON.stringify(v1) === JSON.stringify(v2);
  if (!same) {
    this.$emit('input', v1);
  }
}

function parseValue(value) {
  let v = value;
  let is_numeric = this.is_numeric;
  let toNumeric = v => {
    let res = parseInt(v);
    return _.isFinite(res) ? res : null;
  }
  if (this.multiple) {
    if (v === null || _.isUndefined(v)) {
      v = [];
    }
    return v.map(e => is_numeric ? toNumeric(e) : e);
  } else {
    return is_numeric ? toNumeric(v) : v;
  }
}

function destroyed() {
  $(this.$el).off().select2('destroy');
}

const { state, initial } = window.app;

window.axiosPost = axiosPost;

const common = {
  headers: {
    'X-Requested-With': 'XMLHttpRequest'
  }
};

function axiosGet(params) {
  const config = _.merge({}, common, { params });
  return axios.get('', config)
    .catch(err => {
      showError(err);
      return Promise.reject(err);
    })
    .then(res => res.data);
}

async function axiosLockedGet(params) {
  state.lock();
  try {
    const result = await axiosGet(params);
    return result;
  }
  finally {
    state.unlock();
  }
}

async function axiosPost(data, config) {
  const isMultipartForm = config?.headers?.['Content-Type'] === 'multipart/form-data';
  const useEncode = initial.axios_post_use_base64 && !isMultipartForm;
  // utf8 script must be included in the page for btoa to work
  const postData = useEncode ? {
    cmd: data.cmd,
    base64_data: btoa(utf8.encode(JSON.stringify(data)))
  } : data;

  state.lock();
  try {
    const res = await axios.post(
      '',
      postData,
      _.merge({}, common, config)
    );
    return res.data;
  }
  catch (err) {
    showError(err);
    return Promise.reject(err);
  }
  finally {
    state.unlock();
  }
}
