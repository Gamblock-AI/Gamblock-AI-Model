<html lang="id"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="0bkR-2GV4o3oWB4De1I3UztHO9_ri8ty3kiXFf5XesE">
    <title>Model Land Concept Template</title>
    <style>
        /* RESET SEDERHANA */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            color: #333;
            line-height: 1.6;
            background: #f9f9f9;
        }
        header {
            background: #000;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 10px;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        nav a:hover {
            opacity: 0.8;
        }

        /* HERO SECTION */
        .hero {
            background: url('https://via.placeholder.com/1600x700') no-repeat center / cover;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
        }
        .hero h1 {
            font-size: 48px;
        }

        /* MODEL GRID */
        .models {
            padding: 40px 20px;
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        }
        .model-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .model-card:hover {
            transform: translateY(-6px);
        }
        .model-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        .model-card .info {
            padding: 15px;
        }
        .model-card .info h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .model-card .info p {
            font-size: 14px;
            color: #555;
        }

        /* FOOTER */
        footer {
            background: #222;
            color: #ddd;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- HEADER / NAV -->
    <header>
        <h1>Model Land</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#models">Models</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- HERO BANNER -->
    <section class="hero" id="home">
        <h1>Welcome to Model Land</h1>
    </section>

    <!-- GRID LIST OF MODELS -->
    <section class="models" id="models">
        <div class="model-card">
            <img src="https://via.placeholder.com/400x300" alt="Model 1">
            <div class="info">
                <h3>Model 1</h3>
                <p>Short description here.</p>
            </div>
        </div>
        <div class="model-card">
            <img src="https://via.placeholder.com/400x300" alt="Model 2">
            <div class="info">
                <h3>Model 2</h3>
                <p>Short description here.</p>
            </div>
        </div>
        <div class="model-card">
            <img src="https://via.placeholder.com/400x300" alt="Model 3">
            <div class="info">
                <h3>Model 3</h3>
                <p>Short description here.</p>
            </div>
        </div>
        <!-- Tambahkan lebih banyak card sesuai kebutuhan -->
    </section>

    <!-- SIMPLE FOOTER -->
    <footer id="contact">
        © 2026 Model Land. All Rights Reserved.
    </footer>

</body></html>
