<html lang="en" class="pc"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1, minimum-scale=1,maximum-scale=1, user-scalable=no, minimal-ui">
    <meta name="full-screen" content="yes">
    <meta name="x5-fullscreen" content="true">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" href="">
    <script type="text/javascript" src="./resources/frame.js?v=0"></script>
    <script type="text/javascript" src="./resources/common.js?v=0"></script>
    <link rel="stylesheet" type="text/css" href="./resources/common.css?v=0">
    <link rel="stylesheet" type="text/css" href="./resources/style.css?v=0">
    <link rel="stylesheet" href="./resources/icon/iconfont.css">
    <script type="text/javascript" src="./resources/release.js"></script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
<noscript><strong>We're sorry but we doesn't work properly without JavaScript enabled. Please enable it to
    continue.</strong></noscript>
<div id="toast-mask" style="display: none;"></div>
<header></header>
<div id="confirm-mask" style="display: none;"></div>
<div id="mask" style="display: none;"></div>
<div id="app" class="preview">
            <div class="empty-app" style="display: none;">
                <img style="width: 130%;" src="./resources/images/app_home_page.jpg" alt="">
                <h2>The apps you love.</h2>
                <h2>From a place you can trust.</h2>
                <div class="jump-box">
                    <h4>Jump to you app:</h4>
                    <div class="jump-input-box">
                        <input id="app-id-box" placeholder="app id">
                    </div>
                    <div class="jump-btn">Jump</div>
                </div>
            </div>
        <div id="index" style=""></div></div>
<div id="nav" class="nav">
    
</div>
<footer data-filed="username"></footer>

<script src="./lang.js"></script>
<script>

    // 测试
    // const base = 'http://192.168.3.127:8125'
    // const url = '/site/siteInfo'
    // const appId = '65727232'

    // 生产
    const base = 'https://appstore365.com'
    const url = '/site-info/siteInfo'
    const {appId} = $.queryString(location.href)

    // 获取应用配置
    function getConfig (){
        return new Promise((relove, reject) => {
            $.ajax({
                url: `${base}${url}/getConfigParams/${appId}`,
                success: function(res){
                    if(res.success){
                        relove(res)
                    } else {
                        // $('#app').html(`
                        //     <div class="empty-app">
                        //         <img style="width: 100%;" src="./resources/images/app_home_page.jpg.jpg" alt="" />
                        //     </div>
                        // `)
                    }
                }
            })
        })
    }

    // 下载应用
    function downloadReq(){
        $.get(`${base}${url}/checkAppAvail/${appId}`, function(data){
            if(data.result){
                const downloadElement = document.createElement('a');
                downloadElement.style.display = 'none';
                downloadElement.href = $appData.downloadUrl;
                downloadElement.rel = 'noopener noreferrer';
                document.body.appendChild(downloadElement);
                downloadElement.click();
                document.body.removeChild(downloadElement);
                window.setTimeout(function(){
                    window.location.href = "shortcuts://x-callback-url/run-shortcut?x-error=App-prefs:root=General&path=ManagedConfigurationList/PurgatoryInstallRequested"
                    $.get(`${base}${url}/countDownload/${appId}`, function(data){
                });
                },1000);
            }else{
                alert(langText('dowError'))
            }
        });
    }

    // 页面访问
    function visit(){
        $.get(`${base}${url}/countAccess/${appId}`, function(data){});
    }
    // visit()

    // 分享
    function copyToClipBoard(content) {
        if ('share' in navigator) {
            // Web Share API is supported
            navigator.share({
                title: $appData.appName,
                text: $appData.name,
                url: location.href
            })
            .then(() => console.log('分享成功！'))
            .catch(error => console.error('分享失败：', error));
        } else {
            // Web Share API is not supported, fallback to a mailto link or other method
            alert('Web Share API 不受支持');
        }
    }

    async function init(){
        $('#app').html(`
            <div class="empty-app">
                <img style="width: 130%;" src="./resources/images/app_home_page.jpg" alt="" />
                <h2>The apps you love.</h2>
                <h2>From a place you can trust.</h2>
                <div class="jump-box">
                    <h4>Jump to you app:</h4>
                    <div class="jump-input-box">
                        <input id="app-id-box" placeholder= "app id" />
                    </div>
                    <div class="jump-btn">Jump</div>
                </div>
            </div>
        `)
        $('.jump-btn').on('click', function() {
            const val = $('#app-id-box').val();
            if (val.length == 0) {
                alert('Please input you app id')
                return;
            }
            var isIos = true;
            if (!!navigator.userAgent.match(/iPhone|iPad|iPod/i)) {
                // 是 iOS 设备
                isIos = 0;
            } else {
                // 不是 iOS
                isIos = 1;
            }
            $.get(`${base}${url}/checkAppAvail/${val}/${isIos}`, function(data){
                if(data.result){
                    if (!!navigator.userAgent.match(/iPhone|iPad|iPod/i)) {
                        // 是 iOS 设备
                        window.location.href =  'https://appstore365.com/' + val + '/'
                    } else {
                    // 不是 iOS
                        window.location.href =  'https://appstore365.com/pwa/' + val + '/'
                    }
                }else{
                    alert('App not found')
                }
            });
        })
        $('#app-id-box')
        .on('focus', function () {
            $('.jump-input-box').css('border-color', '#0079FC');
        })
        .on('blur', function () {
            $('.jump-input-box').css('border-color', 'rgba(0, 0, 0, .1)');
        })
        return;
        // const res = await getConfig()

        let {
            // 应用icon
            appIcon,
            // 应用语言
            lang,
            // 应用语言集合
            languages,
            // 应用名称
            appName,
            name,
            // 评论数
            scoreCount,
            scorePoint,

            age,
            rank,
            developerName,
            size,
            ver,
            changeLogDate,
            changeLog,
            preview,
            appIntroduction,
            score_1,
            score_2,
            score_3,
            score_4,
            score_5,
            category,
            comment,
            copyright
        } = res.result

        window.$appData = res.result

        // 绑定icon
        $('head').append(`<link rel="icon" href="${appIcon}">`)
        // 绑定title
        $('head').append(`<title>${appName}</title>`)
        
        $('head').append(`<meta property="og:title" content="${appName}">`)
        $('head').append(`<meta property="og:type" content="website">`)
        $('head').append(`<meta property="og:url" content="${location.href}">`)
        $('head').append(`<meta property="og:image" content="${appIcon}">`)
        $('head').append(`<meta property="og:description" content="${name}">`)

        // 大写
        function bigValue (value) {
            if(lang === 'en'){
                return value.toUpperCase()
            }
            return value
        }

        // 翻译
        function langText (key) {
            let langs = ["zh-cn", "zh", "en"]

            // 语言不存在 使用默认zh-cn
            if(langs.indexOf(lang) === -1){
                lang = "zh-cn"
            }

            if(key.indexOf('facilityMore') > -1){
                let [methodName, argStr] = key.split('(');
                argStr = argStr.slice(0, -1);

                let method = langData[lang][methodName];

                let arg = parseInt(argStr, 10);
                let result = method.call(langData[lang], arg);

                return result
            }

            return langData[lang][key]
        }
        
        window.langText = langText

        // 评论数值添加单位
        function numberToMK(num) {
            let empty = lang === 'en' ? '&nbsp;' : ''
            if (num >= 1000 && num < 1000000) {
                if(lang === 'en'){
                    return (num / 1000).toFixed(1) + langText('qian') + empty;
                } else {
                    return (num / 10000).toFixed(1) + langText('qian') + empty;
                }
            } else if (num >= 1000000) {
                if(lang === 'en'){
                    return (num / 1000000).toFixed(1) + langText('wan') + empty;
                } else {
                    return (num / 10000).toFixed(1) + langText('wan') + empty;
                }
            } else {
                return num.toString();
            }
        }

        // 渲染评论列表
        function commentListHtml() {
            let _html = ''
            comment.forEach(item => {
                _html += `<dd class="commentItem">
                    <h3>
                        <b>${item.name}</b>
                        <u>${item.date}</u>
                        <i>${'★'.repeat(parseInt(item.point)) + '☆'.repeat(5 - parseInt(item.point))}</i>
                    </h3>
                    <p>${item.comment}</p>
                </dd>`
            });
            return _html
        }

        // 内容过多-下拉显示
        function pullDownFilter(value, status){
            let text = ''

            let data = !langData[lang] ? langData["zh-cn"] : langData[lang]
            let langs = data.languageOption

            // 头部语言-展示需要
            if(!status){
                if(value.length > 2){
                    return langs[value[0]].label + ' ' + langText(`facilityMore(${value.length - 1})`)
                }
            }
            
            let dot = ''

            function gap(){
                let text = ''
                if(status){
                    text = lang === 'en' ? '、' : '、'
                } else {
                    text = lang === 'en' ? ' and ' : '和'
                }

                return text
            }

            value.forEach((item, index) => {
                let status = value.length - 1 === index
                dot = status ? '' : gap()
                let label = langs[item] ? langs[item].label : ''
                text += `${label}${dot}`
            })
            return text
        }

        // 语言
        function languageUnit(){
            let data = languages
            if(data.length > 1){
                return `+ ${data.length - 1} ${langText('languageMore')}`
            }
            return ''
        }

        // 排行榜内容
        function rankHtml(value){
            if(lang === 'zh-cn'){
                return `<span class="rank-num">#</span>${value}`
            } else {       
                return `<div class="rank-content">
                    <span class="rank-tag">No.</span>${value}
                </div>`
            }
        }

        // 大小单位转换
        function sizeValue(mb) {
            let num = Number(mb)
            let unit = 'MB'

            if(mb >= 1000){
                num = mb / 1024;
                unit = 'GB'
                if(!Number.isInteger(num)){
                    num = num.toFixed(2)
                }
            } else {
                if(!Number.isInteger(num)){
                    num = num.toFixed(1)
                    if(num >= 1000){
                        num = mb / 1024;
                        unit = 'GB'
                        num = num.toFixed(0)
                    }
                }
            }

            return {
                sizeNum: num,
                sizeUnit: unit,
            };
        }

        // 消息-语言-html
        function infolanguageHtml(){
            let data = languages
            if(data.length > 2){
                return `<div class="pull-down">
                    <i class="pull-down-text" data-editable="text" data-field="category">${pullDownFilter(data)}</i>
                    <i class="iconfont icon-xiala"></i>
                </div>`
            } else {
                return `<i data-editable="text" data-field="category">${pullDownFilter(data)}</i>`
            }
        }

        // 一行超出下拉现实
        function pullDownText(value){
            if(value.length > 20){
                return `<div class="pull-down">
                    <i class="pull-down-text" data-editable="text" data-field="category">${value}</i>
                    <i class="iconfont icon-xiala"></i>
                </div>`
            } else {
                return `<i data-editable="text" data-field="category">${value}</i>`
            }
        }

        function pullDownTextFilter(value){
            return value
        }

        // 预览html
        function previewHtml(){
            let _html = ''
            preview.forEach((item) => {
                _html += `<img src="${item}">`
            })
            return _html
        }

        // 总评论星级
        function scoreDistributedHtml(){

            let score_1Val = 0
            let score_2Val = 0
            let score_3Val = 0
            let score_4Val = 0
            let score_5Val = 0

            let tatol = score_1 + score_2 + score_3 + score_4 + score_5

            let _html = `
                <p><b>★★★★★</b><u><i data-point="5" style="width: ${(score_5 / tatol) * 100}%;"></i></u></p>
                <p><b>★★★★</b><u><i data-point="4" style="width: ${(score_4 / tatol) * 100}%;"></i></u></p>
                <p><b>★★★</b><u><i data-point="3" style="width: ${(score_3 / tatol) * 100}%;"></i></u></p>
                <p><b>★★</b><u><i data-point="2" style="width: ${(score_2 / tatol) * 100}%;"></i></u></p>
                <p><b>★</b><u><i data-point="1" style="width: ${(score_1 / tatol) * 100}%;"></i></u></p>
            `
            return _html
        }

        const { sizeNum, sizeUnit } = sizeValue(size)

        $("#app").html(`<dt class="container">
            <div class="item name_icon">
                <div class="icon" data-editable="icon" data-field="icon"><img
                        src="${appIcon}"></div>
                <div class="app-info">
                    <div class="app-title">
                        <div class="localName" data-editable="text" data-field="${appName}">${appName}</div>
                        <div class="name" data-editable="text" data-field="${name}">${name}</div>    
                    </div>
                    <div class="operate">
                        <a onClick="downloadReq()" class="download" href="JavaScript:;"><b>${langText('download')}</b></a>
                        <i onClick="copyToClipBoard()" class="iconfont icon-fenxiang"></i>
                    </div>
                </div>
            </div>
            <div class="line"></div>

            <div class="resume-list">
                <div class="item">
                    <div class="title">
                        <b data-editable="text" data-field="scoreCount">${numberToMK(scoreCount)}</b>${bigValue(langText('comment'))}
                    </div>
                    <div class="point" data-editable="text" data-field="scorePoint">${scorePoint}</div>
                    <div class="unit">${'★'.repeat(parseInt(scorePoint)) + '☆'.repeat(5 - parseInt(scorePoint))}</div>
                </div>

                <div class="item-line"></div>

                <div class="item">
                    <div class="title">${bigValue(langText('awards'))}</div>
                    <div class="point">
                        <img style="height: 80%" src="./resources/images/choiceness_${lang}.jpg" alt="" />
                    </div>
                    <div class="unit">${langText('awardsUnit')}</div>
                </div>

                <div class="item-line"></div>

                <div class="item">
                    <div class="title">${bigValue(langText('age'))}</div>
                    <div class="point">${age}</div>
                    <div class="unit">${langText('unitAge')}</div>
                </div>

                <div class="item-line"></div>

                <div class="item">
                    <div class="title">${bigValue(langText('rank'))}</div>
                    <div class="point">${rankHtml(rank)}</div>
                    <div class="unit">${category}</div>
                </div>

                <div class="item-line"></div>

                <div class="item">
                    <div class="title">${bigValue(langText('developer'))}</div>
                    <div class="point"><i class="iconfont icon-yonghu"></i></div>
                    <div class="unit dev-unit" style="align-self: ${developerName.length > 10 ? 'baseline' : ''}">${developerName}</div>
                </div>

                <div class="item-line"></div>

                <div class="item">
                    <div class="title">${bigValue(langText('language'))}</div>
                    <div class="point">${languages[0].toUpperCase()}</div>
                    <div class="unit">${languageUnit()}</div>
                </div>

                <div class="item-line"></div>

                <div class="item">
                    <div class="title">${bigValue(langText('size'))}</div>
                    <div class="point">${sizeNum}</div>
                    <div class="unit">${sizeUnit}</div>
                </div>
            </div>

            <div class="line"></div>
            <dl class="item changeLog">
                <dt><b>${langText('newFunction')}</b></dt>
                <dt>
                    <i>${langText('ver')} <b>${ver}</b></i> <i>${changeLogDate}</i>
                </dt>
                <dd>${changeLog}</dd>
            </dl>
            <div class="line"></div>
            <dl class="item preview">
                <dt><b>${langText('preview')}</b></dt>
                <dd>${previewHtml()}</dd>
            </dl>
            <div class="line"></div>
            <dl class="item description">
                <dd>${appIntroduction}</dd>
            </dl>
            <div class="line"></div>
            <dl class="item score_comment">
                <dt>${langText('scoreAndComment')}</dt>
                <dd>
                    <ul>
                        <li data-field=scorePoint>${scorePoint}</li>
                        <li class="scoreDistributed">${scoreDistributedHtml()}</li>
                        <li class="fullScore">${langText('fullScore')}</li>
                        <li class="scoreCount"><b>${numberToMK(scoreCount)}</b>${langText('comment')}</li>
                    </ul>
                </dd>
                <div class="line"></div>
                <dd class="clickToScore"><b>${langText('clickToScore')}</b> <i></i> <i></i> <i></i> <i></i> <i></i></dd>
            </dl>
            <dl class="item commentList" data-editable="comment" data-field="comment">${commentListHtml()}</dl>
            <div class="line"></div>
            <dl class="item appInfo">
                <dt>${langText('information')}</dt>
                <dd><b>${langText('size')}</b><i data-editable="text" data-field="developerName">${sizeNum}&nbsp;${sizeUnit}</i></dd>
                <dd><b>${langText('category')}</b><i data-editable="text" data-field="category">${category}</i></dd>
                <dd id="facility-dom">
                    <b>${langText('compatibility')}</b>
                    <div class="pull-down">
                        <i class="pull-down-text" data-editable="text" data-field="category">${langText('facility')}</i>
                        <i class="iconfont icon-xiala"></i>
                    </div>
                </dd>
                <dd id="language-dom">
                    <b>${langText('languages')}</b>
                    ${infolanguageHtml()}
                </dd>
                <dd><b>${langText('ageGrading')}</b><i data-editable="text" data-field="age">17+</i></dd>
                <dd class="down-text-dom down-text">
                    <b>${langText('offer')}</b>
                    ${pullDownText(developerName)}
                </dd>
                <dd class="down-text-dom down-text">
                    <b>${langText('copyright')}</b>
                    ${pullDownText(copyright)}
                </dd>
            </dl>
        </dt>`)

        $('#nav').html(`
            <div class="nav-item">
                <i class="iconfont icon-md-today"></i>
                <span>${langText('today')}</span>
            </div>
            <div class="nav-item">
                <i class="iconfont icon-games"></i>
                <span>${langText('games')}</span>
            </div>
            <div class="nav-item select">
                <i class="iconfont icon-Apps"></i>
                <span>${langText('apps')}</span>
            </div>
            <div class="nav-item">
                <i class="iconfont icon-search"></i>
                <span>${langText('search')}</span>
            </div>
        `)

        s.data[s.action].handlers.init()

        // 兼容性-点击张开
        $(".appInfo dd#facility-dom").on('click', function(){
            if($(this).children('.pull-down').length > 0){
                let value = ['iPhone', 'iPod touch']
                
                let _html = ''

                value.forEach((item) => {
                    _html += `<div class="facility-item">
                        <div class="facility-title">${item}</div>
                        <div class="facility-value">${langText(item)}</div>
                    </div>`
                })

                if(!$(this).hasClass('pull-down-content')){
                    $(this).children('.pull-down').children('.pull-down-text').html(_html)
                    $(this).addClass('pull-down-content')
                    $(this).children('.pull-down').children('.icon-xiala').css({
                        display: 'none'
                    })
                }
            }
        })

        // 语言-点击张开
        $(".appInfo dd#language-dom").on('click', function(){
            
            if($(this).children('.pull-down').length > 0){
                let value = languages
                if(!$(this).hasClass('pull-down-content')){
                    let text = pullDownFilter(value, true)

                    $(this).children('.pull-down').children('.pull-down-text').text(text)
                    $(this).addClass('pull-down-content')
                    $(this).children('.pull-down').children('.icon-xiala').css({
                        display: 'none'
                    })
                }
            }
            
        })

        // 文本-点击张开
        $(".appInfo dd.down-text-dom").on('click', function(){
            
            if($(this).children('.pull-down').length > 0){
                let value = $(this).children('.pull-down').children('.pull-down-text').text()
                if(!$(this).hasClass('pull-down-content')){
                    let text = pullDownTextFilter(value)

                    $(this).children('.pull-down').children('.pull-down-text').text(text)
                    $(this).addClass('pull-down-content')
                    $(this).children('.pull-down').children('.icon-xiala').css({
                        display: 'none'
                    })
                }
            }
            
        })
    }
    init()
    

</script>

</body></html>
