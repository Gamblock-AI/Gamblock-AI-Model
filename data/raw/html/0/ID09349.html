    function setCookie(name, value, days) {
        var expires = "";
        if (days) {
            var date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + (value || "") + expires + "; path=/;secure;samesite=lax;";
    }

    function getCookie(name) {
        var nameEQ = name + "=";
        var ca = document.cookie.split(';');
        for (var i = 0; i < ca.length; i++) {
            var c = ca[i];
            while (c.charAt(0) == ' ') c = c.substring(1, c.length);
            if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
        }
        return null;
    }

    function eraseCookie(name) {
        document.cookie = name + '=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT;';
    }

    function checkValidation() {
        clearlabelAlert();

        var mail = $('#email').val();
        var password = $('#password').val()
        var mailformat = /^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$/;
        var password_format = /^(?=.{8,})(?=.*[a-z])(?=.*[A-Z])(?=.*[^\w\d]).*$/;
        var password_uppercase_format = /^(?=.*[A-Z]).*$/;
        var password_lowercase_format = /^(?=.*[a-z]).*$/;
        var password_number_format = /^(?=.*[0-9]).*$/;
        var password_symbol_format = /^[a-zA-Z 0-9]*$/

            validate = false
        } else if (mail.length > 0 && !mail.match(mailformat)) {
            errorlabelAlert('#email', '#labelEmail', 'danger', 'Email tidak valid');
            validate = false
        }

        if (password.length == 0) {

        } else if (password.length > 0 && password.length <= 8) {

                errorlabelAlert('#password', '#labelPassword', 'danger', 'Password harus lebih dari 8 karakter memiliki huruf besar, huruf kecil dan angka');
                validate = false
            } else if (!password.match(password_uppercase_format) && !password.match(password_lowercase_format)) {
                errorlabelAlert('#password', '#labelPassword', 'danger', 'Password harus lebih dari 8 karakter, memiliki huruf besar dan huruf kecil');
                validate = false
            } else if (!password.match(password_uppercase_format) && !password.match(password_number_format)) {
                errorlabelAlert('#password', '#labelPassword', 'danger', 'Password harus lebih dari 8 karakter, memiliki huruf besar dan angka');
                validate = false
            } else if (!password.match(password_lowercase_format) && !password.match(password_number_format)) {
                errorlabelAlert('#password', '#labelPassword', 'danger', 'Password harus lebih dari 8 karakter, memiliki huruf kecil dan angka');
                validate = false
            } else if (!password.match(password_uppercase_format)) {
                errorlabelAlert('#password', '#labelPassword', 'danger', 'Password harus lebih dari 8 karakter dan memiliki huruf besar');
                validate = false
            } else if (!password.match(password_lowercase_format)) {
                errorlabelAlert('#password', '#labelPassword', 'danger', 'Password harus lebih dari 8 karakter dan memiliki huruf kecil');
                validate = false
            } else if (!password.match(password_number_format)) {
                errorlabelAlert('#password', '#labelPassword', 'danger', 'Password harus lebih dari 8 karakter dan memiliki angka');
                validate = false
            } else {
                errorlabelAlert('#password', '#labelPassword', 'danger', 'Password harus lebih dari 8 karakter');
                validate = false
            }
        } else if (password.length > 8) {
            if (!password.match(password_uppercase_format) && !password.match(password_lowercase_format) && !password.match(password_number_format)) {
                errorlabelAlert('#password', '#labelPassword', 'danger', 'Password harus memiliki huruf besar, huruf kecil dan angka');
                validate = false
            } else if (!password.match(password_uppercase_format) && !password.match(password_lowercase_format)) {
                errorlabelAlert('#password', '#labelPassword', 'danger', 'Password harus memiliki huruf besar dan huruf kecil');
                validate = false
            } else if (!password.match(password_uppercase_format) && !password.match(password_number_format)) {
                errorlabelAlert('#password', '#labelPassword', 'danger', 'Password harus memiliki huruf besar dan angka');
                validate = false
            } else if (!password.match(password_lowercase_format) && !password.match(password_number_format)) {
                errorlabelAlert('#password', '#labelPassword', 'danger', 'Password harus memiliki huruf kecil dan angka');
                validate = false
            } else if (!password.match(password_uppercase_format)) {
                errorlabelAlert('#password', '#labelPassword', 'danger', 'Password harus memiliki huruf besar');
                validate = false
            } else if (!password.match(password_lowercase_format)) {
                errorlabelAlert('#password', '#labelPassword', 'danger', 'Password harus memiliki huruf kecil');
                validate = false
            } else if (!password.match(password_number_format)) {
                errorlabelAlert('#password', '#labelPassword', 'danger', 'Password harus memiliki angka');
                validate = false
            // } else if (!password.match(password_symbol_format)) {
            //     errorlabelAlert('#password', '#labelPassword', 'danger', 'Password tidak boleh menggunakan symbol');
            //     validate = false
            } else if (password.match(space_regex)) {
                errorlabelAlert('#password', '#labelPassword', 'danger', 'Password tidak boleh menggunakan spasi');
                validate = false
            }

        var mail_scipt = mail.toLowerCase();
        var password_script = password.toLowerCase();

            return
        }

        if(password_script.indexOf("<script>") >= 0){
            errorPopupAlert("Error");
            return
        }

        if (validate) {
            cekCaptcha()
        }
