        <script>
          (function() {
            const app = 'bereal://profile/psg';
            const iOSStoreUrl = 'itms-apps://apps.apple.com/us/app/bereal-your-friends-for-real/id1459645446';
            const androidStoreUrl = 'market://details?id=com.bereal.ft';
            const iOSStoreWebUrl = 'https://apps.apple.com/us/app/bereal-your-friends-for-real/id1459645446';
            const androidStoreWebUrl = 'https://play.google.com/store/apps/details?id=com.bereal.ft';

            // Detect platform client-side
            const isAppleDevice = /iPad|iPhone|iPod/i.test(navigator.userAgent);
            const isAndroidDevice = /Android/i.test(navigator.userAgent);
            const isMobile = isAppleDevice || isAndroidDevice;

            // Choose the right store URL
            const store = isAppleDevice ? iOSStoreUrl : androidStoreUrl;

            const acceptButton = document.getElementById('acceptButton');

            // Only attach event listener if button exists
            if (acceptButton) {
              acceptButton.addEventListener('click', function(e) {
                e.preventDefault();
                if (isMobile) {
                  // On mobile: try deep link silently using iframe, fallback to app store
                  var iframe = document.createElement('iframe');
                  iframe.style.display = 'none';
                  iframe.src = app;
                  document.body.appendChild(iframe);

                  setTimeout(function() {
                    document.body.removeChild(iframe);
                    // If we're still here, the app didn't open - go to store
                    window.location = store;
                  }, 1000);
                } else {
                  // On desktop: always go to App Store
                  window.location = iOSStoreWebUrl;
                }
              });
            }

            // Handle Instagram and Line special cases
            const isInstagram = /Instagram/i.test(navigator.userAgent);
            const isLine = /Line/i.test(navigator.userAgent);
            if (isInstagram || isLine) {
              window.location = app;
              setTimeout(function() {
                window.location = store;
              }, 500);
            }

            // Custom QR Code Generator matching Swift implementation
            const QR_CONSTANTS = {
              FINDER_PATTERN_SIZE: 7,
              FINDER_CLEARANCE_SIZE: 8,
              FINDER_OFFSET_FROM_EDGE: 1,
              CENTER_LOGO_SIZE_RATIO: 0.28,
              CENTER_LOGO_RENDER_RATIO: 0.20,
              DOT_BASE_RATIO: 0.55,
              DOT_VARIATION_RATIO: 0.12
            };

            // Load QR code library and generate
            function loadQRLibrary(callback) {
              const script = document.createElement('script');
              script.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';
              script.onload = callback;
              document.head.appendChild(script);
            }

            function generateQRMatrix(data) {
              // Use qrcode-generator library
              const qr = qrcode(0, 'H'); // Auto version, High error correction
              qr.addData(data);
              qr.make();

              const moduleCount = qr.getModuleCount();
              const matrix = [];

              for (let y = 0; y < moduleCount; y++) {
                matrix[y] = [];
                for (let x = 0; x < moduleCount; x++) {
                  matrix[y][x] = qr.isDark(y, x);
                }
              }

              return matrix;
            }

            function renderCustomQR(canvas, data) {
              const ctx = canvas.getContext('2d');
              const size = canvas.width;
              const matrix = generateQRMatrix(data);
              const modules = matrix.length;
              const moduleSize = size / modules;

              // Fill white background
              ctx.fillStyle = '#FFFFFF';
              ctx.fillRect(0, 0, size, size);

              // Calculate finder patterns positions
              const finderPatterns = [
                { x: 0, y: 0 },
                { x: modules - QR_CONSTANTS.FINDER_PATTERN_SIZE, y: 0 },
                { x: 0, y: modules - QR_CONSTANTS.FINDER_PATTERN_SIZE }
              ];

              // Draw circular dots
              ctx.fillStyle = '#000000';
              for (let y = 0; y < modules; y++) {
                for (let x = 0; x < modules; x++) {
                  if (!matrix[y][x]) continue;
                  if (isInFinderArea(x, y, finderPatterns, modules)) continue;
                  if (isInCenterArea(x, y, modules)) continue;

                  const dotSize = calculateDotSize(x, y, moduleSize);
                  const centerX = x * moduleSize + moduleSize / 2;
                  const centerY = y * moduleSize + moduleSize / 2;

                  ctx.beginPath();
                  ctx.arc(centerX, centerY, dotSize / 2, 0, Math.PI * 2);
                  ctx.fill();
                }
              }

              // Draw custom finder patterns (rounded squares) at exact QR positions
              finderPatterns.forEach(finder => {
                const finderSize = moduleSize * QR_CONSTANTS.FINDER_PATTERN_SIZE;
                const px = finder.x * moduleSize;
                const py = finder.y * moduleSize;

                drawFinderPattern(ctx, px, py, finderSize);
              });

              // Draw center logo
              drawCenterLogo(ctx, size);
            }

            function isInFinderArea(x, y, patterns, modules) {
              return patterns.some(finder => {
                const startX = Math.max(0, finder.x - 1);
                const startY = Math.max(0, finder.y - 1);
                const endX = Math.min(modules, finder.x + QR_CONSTANTS.FINDER_CLEARANCE_SIZE);
                const endY = Math.min(modules, finder.y + QR_CONSTANTS.FINDER_CLEARANCE_SIZE);
                return x >= startX && x < endX && y >= startY && y < endY;
              });
            }

            function isInCenterArea(x, y, modules) {
              const centerSize = Math.round(modules * QR_CONSTANTS.CENTER_LOGO_SIZE_RATIO);
              const startX = Math.floor((modules - centerSize) / 2);
              const startY = Math.floor((modules - centerSize) / 2);
              return x >= startX && x < startX + centerSize && y >= startY && y < startY + centerSize;
            }

            function calculateDotSize(x, y, moduleSize) {
              // Deterministic pseudo-random variation matching Swift
              let seed = (x * 73856093) ^ (y * 19349663);
              seed = (seed + 0x9E3779B9) >>> 0;
              seed = Math.imul(seed, 1664525) + 1013904223;
              const variation = (Math.abs(seed) % 1000) / 1000;

              const baseSize = moduleSize * QR_CONSTANTS.DOT_BASE_RATIO;
              const sizeRange = moduleSize * QR_CONSTANTS.DOT_VARIATION_RATIO;
              return baseSize + (variation * sizeRange);
            }

            function drawFinderPattern(ctx, x, y, size) {
              // QR-spec compliant proportions with very rounded corners and thinner border
              const moduleSize = size / 7; // Finder is 7x7 modules
              const outerRadius = moduleSize * 3.0; // Very rounded outer
              const innerRadius = moduleSize * 2.4; // Rounded inner
              const centerRadius = moduleSize * 0.8; // Less rounded center

              // Outer black square (7x7 modules)
              ctx.fillStyle = '#000000';
              roundedRect(ctx, x, y, size, size, outerRadius);
              ctx.fill();

              // White square - larger margin for thinner border
              const whiteMargin = moduleSize * 0.7;
              const whiteSize = size - (whiteMargin * 2);
              ctx.fillStyle = '#FFFFFF';
              roundedRect(ctx, x + whiteMargin, y + whiteMargin, whiteSize, whiteSize, innerRadius);
              ctx.fill();

              // Center black square - smaller center
              const centerMargin = moduleSize * 2.1;
              const centerSize = size - (centerMargin * 2);
              ctx.fillStyle = '#000000';
              roundedRect(ctx, x + centerMargin, y + centerMargin, centerSize, centerSize, centerRadius);
              ctx.fill();
            }

            function roundedRect(ctx, x, y, width, height, radius) {
              ctx.beginPath();
              ctx.moveTo(x + radius, y);
              ctx.lineTo(x + width - radius, y);
              ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
              ctx.lineTo(x + width, y + height - radius);
              ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
              ctx.lineTo(x + radius, y + height);
              ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
              ctx.lineTo(x, y + radius);
              ctx.quadraticCurveTo(x, y, x + radius, y);
              ctx.closePath();
            }

            function drawCenterLogo(ctx, size) {
              const logoSize = size * QR_CONSTANTS.CENTER_LOGO_RENDER_RATIO;
              const x = (size - logoSize) / 2;
              const y = (size - logoSize) / 2;
              const radius = logoSize * 0.2;

              // Black rounded rectangle background
              ctx.fillStyle = '#000000';
              roundedRect(ctx, x, y, logoSize, logoSize, radius);
              ctx.fill();

              // BeReal. text
              ctx.fillStyle = '#FFFFFF';
              ctx.font = 'bold ' + (logoSize * 0.22) + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText('BeReal.', size / 2, size / 2);
            }

            // Initialize QR code on load
            const qrCanvas = document.getElementById('qrCanvas');
            if (qrCanvas) {
              loadQRLibrary(function() {
                // Use web URL instead of deep link so QR code works when app is not installed
                // iOS Universal Links will redirect to the app if installed,
                // otherwise the web page will show with store redirect buttons
                renderCustomQR(qrCanvas, 'https://bere.al/psg');
              });
            }
