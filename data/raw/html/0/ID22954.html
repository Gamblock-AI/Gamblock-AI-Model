<html lang="tr"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>212steakhouse.com</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&amp;family=Montserrat:wght@300;500&amp;display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #c9a45c;
      --dark: #0d0d0d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* Arka plan ışık efekti */
    body::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(201,164,92,0.25) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(60px);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 30px;
      border: 1px solid rgba(201,164,92,0.25);
      border-radius: 14px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    h1 {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: clamp(36px, 7vw, 80px);
      color: var(--gold);
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(201,164,92,0.3);
    }

    .subtitle {
      margin-top: 14px;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
    }

    .divider {
      width: 80px;
      height: 2px;
      background: var(--gold);
      margin: 18px auto 0;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>212steakhouse.com</h1>
    <div class="divider"></div>
    <div class="subtitle">Premium Steak Experience</div>
  </main>


</body></html>
