<style>
  :root {
    --bg: #09060f;
    --mint: #09e5a3;
    --violet: #7F5AF0;
    --blue: #3b82c4;
    --white: #ffffff;

  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--white);
    overflow: hidden;
  }
  canvas#bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }
  .page {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 40px 48px;
  }
  .logo {
    position: absolute;
    top: 40px;
    left: 48px;
    opacity: 0;
    animation: fadeIn 1s ease 0.2s forwards;
  }
  .logo svg { height: 48px; width: auto; opacity: 0.85; }
  .login-btn {
    position: absolute;
    top: 40px;
    right: 48px;
    padding: 8px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--mint);
    background: rgba(9, 229, 163, 0.1);
    border: 1px solid rgba(9, 229, 163, 0.25);
    border-radius: 6px;
    text-decoration: none;
    transition: all 0.3s ease;
    opacity: 0;
    animation: fadeIn 1s ease 0.2s forwards;
    z-index: 2;
  }
  .login-btn:hover {
    background: rgba(9, 229, 163, 0.2);
    border-color: rgba(9, 229, 163, 0.4);
  }
  .center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .headline {
    font-size: clamp(36px, 6vw, 72px);
    font-weight: 500;
    letter-spacing: -0.035em;
    line-height: 1.12;
    opacity: 0;
    animation: fadeUp 0.9s ease 0.5s forwards;
  }
  .headline .line-white {
    color: var(--white);
    display: block;
    margin-bottom: 4px;
  }
  .headline .line-gradient {
    display: block;
    background: linear-gradient(90deg, var(--violet), var(--blue), var(--mint), var(--blue), var(--violet));
    background-size: 200% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 10s ease-in-out infinite;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .sub {
    font-size: clamp(14px, 1.5vw, 16px);
    color: var(--grey);
    font-weight: 300;
    letter-spacing: 0.01em;
    margin-top: 18px;
    opacity: 0;
    animation: fadeUp 0.9s ease 0.75s forwards;
  }
  .cta {
    display: inline-block;
    margin-top: 32px;
    padding: 12px 32px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--bg);
    background: var(--mint);
    border-radius: 6px;
    text-decoration: none;
    transition: all 0.3s ease;
    opacity: 0;
    animation: fadeUp 0.9s ease 0.95s forwards;
  }
  .cta:hover {
    background: #00d492;
    transform: translateY(-1px);
    box-shadow: 0 0 20px rgba(9, 229, 163, 0.4), 0 0 40px rgba(9, 229, 163, 0.15);
  }
  .bottom {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    opacity: 0;
    animation: fadeIn 1s ease 1s forwards;
    width: 100%;
    padding: 0 48px;
  }
  .bottom a {
    font-size: 12.5px;
    color: var(--grey);
    text-decoration: none;
    font-weight: 400;
    letter-spacing: 0.02em;
    transition: color 0.3s ease;
    white-space: nowrap;
  }
  .bottom a:hover { color: var(--white); }
  .bottom .dot {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    flex-shrink: 0;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }

    to { opacity: 1; transform: translateY(0); }

      padding: 0 16px;
    }
    .bottom a { font-size: 11.5px; }
    .bottom .dot { width: 2px; height: 2px; }

<script>
var canvas = document.getElementById('bg');
var ctx = canvas.getContext('2d');
var w, h, t = 0;
var hexGrid = [];
var MINT = [9, 229, 163];
var VIOLET = [127, 90, 240];
var HEX_SIZE = 40;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  buildGrid();
}

function hexCorner(cx, cy, size, i) {
  var angle = Math.PI / 180 * (60 * i - 30);
  return { x: cx + size * Math.cos(angle), y: cy + size * Math.sin(angle) };
}

function buildGrid() {
  hexGrid = [];
  var hSpacing = HEX_SIZE * Math.sqrt(3);
  var vSpacing = HEX_SIZE * 1.5;
  var cols = Math.ceil(w / hSpacing) + 2;
  var rows = Math.ceil(h / vSpacing) + 2;
  var S = Math.max(w, h);

  for (var row = -1; row < rows; row++) {
    for (var col = -1; col < cols; col++) {
      var cx = col * hSpacing + (row % 2 ? hSpacing / 2 : 0);
      var cy = row * vSpacing;

      var dBL = Math.sqrt(cx * cx + (cy - h) * (cy - h));
      var dTR = Math.sqrt((cx - w) * (cx - w) + cy * cy);
      var dCenter = Math.sqrt((cx - w * 0.5) * (cx - w * 0.5) + (cy - h * 0.5) * (cy - h * 0.5));

      var mintZone = Math.max(0, 1 - dBL / (S * 0.6));
      var violetZone = Math.max(0, 1 - dTR / (S * 0.55));
      var centerZone = Math.max(0, 1 - dCenter / (S * 0.5));

      var inZone = mintZone > 0.1 || violetZone > 0.1 || centerZone > 0.15;
      var randomInclude = Math.random() < 0.06;

      if (inZone || randomInclude) {
        var color, baseAlpha;
        if (mintZone > violetZone && mintZone > 0.05) {
          color = MINT;
          baseAlpha = 0.01 + mintZone * 0.14;
        } else if (violetZone > 0.05) {
          color = VIOLET;
          baseAlpha = 0.01 + violetZone * 0.12;
        } else {
          color = Math.random() < 0.5 ? MINT : VIOLET;
          baseAlpha = 0.01 + centerZone * 0.04;
        }

        // Position-based wave offset for smooth diagonal sweep
        var waveOffset = cx * 0.005 + cy * 0.004;

        hexGrid.push({
          cx: cx, cy: cy, color: color, baseAlpha: baseAlpha,
          waveOffset: waveOffset
        });
      }
    }
  }
}

function drawHex(cx, cy, size, color, strokeAlpha, fillAlpha) {
  ctx.beginPath();
  for (var i = 0; i < 6; i++) {
    var p = hexCorner(cx, cy, size, i);
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();

  // Fill first
  if (fillAlpha > 0.002) {
    ctx.fillStyle = 'rgba(' + color[0] + ',' + color[1] + ',' + color[2] + ',' + fillAlpha + ')';
    ctx.fill();
  }

  // Stroke on top — always constant
  if (strokeAlpha > 0.003) {
    ctx.strokeStyle = 'rgba(' + color[0] + ',' + color[1] + ',' + color[2] + ',' + strokeAlpha + ')';
    ctx.lineWidth = 0.7;
    ctx.stroke();
  }
}

function drawGlows() {
  var S = Math.max(w, h);
  var b1 = Math.sin(t * 0.8) * 0.012 + 0.065;
  var g1 = ctx.createRadialGradient(w * 0.05, h * 0.92, 0, w * 0.05, h * 0.92, S * 0.55);
  g1.addColorStop(0, 'rgba(9,229,163,' + b1 + ')');
  g1.addColorStop(0.4, 'rgba(9,229,163,' + (b1 * 0.35) + ')');
  g1.addColorStop(1, 'transparent');
  ctx.fillStyle = g1;
  ctx.fillRect(0, 0, w, h);

  var b2 = Math.sin(t * 0.6 + 2) * 0.01 + 0.055;
  var g2 = ctx.createRadialGradient(w * 0.95, h * 0.08, 0, w * 0.95, h * 0.08, S * 0.5);
  g2.addColorStop(0, 'rgba(127,90,240,' + b2 + ')');
  g2.addColorStop(0.4, 'rgba(127,90,240,' + (b2 * 0.3) + ')');
  g2.addColorStop(1, 'transparent');
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, w, h);

  var b3 = Math.sin(t * 0.4 + 4) * 0.005 + 0.015;
  var g3 = ctx.createRadialGradient(w * 0.5, h * 0.5, 0, w * 0.5, h * 0.5, S * 0.3);
  g3.addColorStop(0, 'rgba(9,180,163,' + b3 + ')');
  g3.addColorStop(1, 'transparent');
  ctx.fillStyle = g3;
  ctx.fillRect(0, 0, w, h);
}

function frame() {
  ctx.clearRect(0, 0, w, h);
  t += 0.006;

  drawGlows();

  for (var i = 0; i < hexGrid.length; i++) {
    var hex = hexGrid[i];

    // Stroke stays perfectly constant
    var strokeA = hex.baseAlpha;

    // Smooth diagonal wave — position-based so you see a clear wave pattern
    var wave = Math.sin(t - hex.waveOffset) * 0.5 + 0.5;

    // Dim hexagons near center so text reads clearly
    var dx = hex.cx - w * 0.5;
    var dy = hex.cy - h * 0.5;
    var dCenter = Math.sqrt(dx * dx + dy * dy);
    var S = Math.max(w, h);
    var centerFade = Math.max(0, Math.min(1, (dCenter - S * 0.1) / (S * 0.15)));

    // Fill scales with wave, zone proximity, and center fade
    var fillA = hex.baseAlpha * wave * 0.5 * centerFade;
    strokeA = hex.baseAlpha * 0.6 * (0.3 + 0.7 * centerFade);

    drawHex(hex.cx, hex.cy, HEX_SIZE, hex.color, strokeA, fillA);
  }

  // Dark vignette over center — soft oval behind text
  var vgS = Math.max(w, h);
  var vg = ctx.createRadialGradient(w * 0.5, h * 0.5, 0, w * 0.5, h * 0.5, vgS * 0.28);
  vg.addColorStop(0, 'rgba(9,6,15,0.7)');
  vg.addColorStop(0.5, 'rgba(9,6,15,0.4)');
  vg.addColorStop(1, 'rgba(9,6,15,0)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, w, h);

  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
resize();
frame();
</script>
