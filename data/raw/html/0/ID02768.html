<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrading - Linkr Service</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F0F0F5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .card {
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        /* === Web (Desktop) === */
        @media (min-width: 769px) {
            .card {
                width: 80%;
                max-width: 1000px;
                padding: 48px 64px 48px 24px;
            }
            .rocket-wrap {
                flex: 0 0 50%;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .rocket-wrap img {
                width: 100%;
                max-width: 400px;
            }
            .text-wrap {
                flex: 0 0 50%;
                padding-left: 40px;
            }
            .text-wrap h1 {
                font-size: 52px;
                font-weight: 700;
                font-style: italic;
                line-height: 1.15;
                letter-spacing: -0.5px;
            }
        }

        /* === H5 (Mobile) === */
        @media (max-width: 768px) {
            .card {
                width: 88%;
                flex-direction: column;
                padding: 32px 28px;
                border-radius: 20px;
            }
            .rocket-wrap {
                display: flex;
                justify-content: center;
                align-items: center;
                margin-bottom: 16px;
            }
            .rocket-wrap img {
                width: 70%;
                max-width: 260px;
            }
            .text-wrap {
                width: 100%;
                text-align: left;
            }
            .text-wrap h1 {
                font-size: 32px;
                font-weight: 700;
                font-style: italic;
                line-height: 1.2;
            }
        }

        .text-upgrading {
            color: #6C5CE7;
        }
        .text-service {
            color: #1A1A2E;
        }
        .text-stay {
            color: #1A1A2E;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="rocket-wrap">
            <img src="img_v3.png" alt="Rocket">
        </div>
        <div class="text-wrap">
            <h1 class="text-upgrading">Upgrading</h1>
            <h1 class="text-service">Linkr service.</h1>
            <h1 class="text-stay">Stay tuned!</h1>
        </div>
    </div>


</body></html>
