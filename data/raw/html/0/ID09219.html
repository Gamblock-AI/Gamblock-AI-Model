<script>
if ($(window).width() < 426) {
    $('.button-entrance a').css('bottom', '7.5rem');

<script>
var mobileImage = 'https://infoahmexpo.com/server/files/7e9260aabd6912dabcd19be1b3c63ac3/image/content090923054423354543115.jpg';
var laptopImage = 'https://infoahmexpo.com/server/files/7e9260aabd6912dabcd19be1b3c63ac3/image/content090923054622156332111.jpg';
var tabletImage = 'https://infoahmexpo.com/server/files/7e9260aabd6912dabcd19be1b3c63ac3/image/content0909230546541089229470.jpg';
$('.bg-res').css('background-size', '100% 100%');
$('.bg-res').css('background-repeat', 'no-repeat');
$('.bg-res').css('background-position', 'center');
if (window.matchMedia('(max-width: 425px)').matches) {
    $('.bg-res').css('background-image', 'url("' + mobileImage + '")');
} else if (window.matchMedia('(max-width: 768px)').matches) {
    $('.bg-res').css('background-image', 'url("' + tabletImage + '")');
} else {
    $('.bg-res').css('background-image', 'url("' + laptopImage + '")');
}
$(window).resize(function() {
    if (window.matchMedia('(max-width: 425px)').matches) {
        $('.bg-res').css('background-image', 'url("' + mobileImage + '")');
    } else if (window.matchMedia('(max-width: 768px)').matches) {
        $('.bg-res').css('background-image', 'url("' + tabletImage + '")');
    } else {
        $('.bg-res').css('background-image', 'url("' + laptopImage + '")');
    }
});
</script>
