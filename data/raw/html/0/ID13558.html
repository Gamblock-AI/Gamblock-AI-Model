atforms_config":36,"color_config":38,"swarmcloud_config":39},[6,13,19,24],{"id":7,"label":8,"link":9,"html":10,"type":11,"friendly_url":10,"identifier":12},69,"Contacto","mailto:sportvaluesacademy@corp.realmadrid.com","","EXT",null,{"id":14,"label":15,"link":10,"html":16,"type":17,"friendly_url":18,"identifier":12},70,"Aviso legal","\u003Ch1 style=\"text-align: center;\">\u003Cstrong>Aviso legal\u003C/strong>\u003C/h1>\u003Cp>\u003Cbr>\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>1.- Información legal y aceptación\u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">Las presentes disposiciones regulan el uso del servicio del Sitio Web \u003Ca href=\"https://formacion.realmadridfundacion.org/\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"color: rgb(63, 78, 206);\">https://formacion.realmadridfundacion.org/\u003C/a> y sus subdominios (en adelante, el “Plataforma OTT”) que la Fundación Real Madrid pone a disposición de los usuarios/as.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">Esta plataforma OTT está gestionada por la FUNDACIÓN REAL MADRID, inscrita en el registro de fundación (nº 366), con domicilio social en Avenida Concha Espina 1, 28036 Madrid (España), C.I.F. G81828493, teléfono +34 91 453 29 00, y página web \u003Ca href=\"http://www.realmadrid.com/sobre-el-real-madrid/fundacion\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"color: rgb(63, 78, 206);\">www.realmadrid.com/sobre-el-real-madrid/fundacion\u003C/a>\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">A continuación, se exponen los términos del acuerdo legal establecido entre el Usuario (persona que accede y utiliza esta plataforma OTT) y la Fundación Real Madrid. Al acceder, navegar y/o utilizar esta plataforma OTT, el Usuario declara haber leído, entendido y estar de acuerdo con estos términos y sus modificaciones, así como con el cumplimiento de todas las leyes y reglamentos aplicables. En consecuencia, el Usuario debe leer atentamente el presente Aviso Legal en cada una de las ocasiones en que se proponga utilizar esta plataforma OTT, ya que ésta y sus condiciones de uso recogidas en el presente Aviso Legal pueden sufrir modificaciones. Si el Usuario no acepta estos términos, no debe utilizar esta plataforma OTT.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">Esta plataforma OTT de la Fundación Real Madrid ofrece su servicio a Usuarios de múltiples países. La entidad que presta el acceso al servicio y que reúne las condiciones para ser responsable del tratamiento de los datos es la Fundación Real Madrid con domicilio en Avda. Concha Espina 1, 28036 Madrid (España). La Fundación Real Madrid no asegura que esta plataforma OTT cumpla total o parcialmente con las leyes de otros países. Si el Usuario reside o está domiciliado en cualquier otro lugar y decide acceder y/o utilizar esta plataforma OTT, lo hace bajo su propio riesgo y responsabilidad y debe asegurarse de que dicho acceso y/o uso cumple con la legislación local aplicable, no asumiendo la Fundación Real Madrid responsabilidad alguna que pudiera derivarse de dicho acceso.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">La Fundación Real Madrid, a través de esta plataforma OTT, permite a los Usuarios acceder a contenidos formativos y sobre la actividad propia de la Fundación, así como de entidades relacionadas con esta, transmitidos a través de Internet a determinados dispositivos conectados a Internet. Esta plataforma OTT es una plataforma con contenido gratuitos y de pago.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>2.-Propiedad intelectual e industrial\u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">Todos los contenidos y/o cualesquiera otros elementos de la plataforma OTT, entendiendo por estos a título meramente enunciativo, los textos, fotografías, gráficos, imágenes, iconos, tecnología, software, links y demás contenidos audiovisuales o sonoros, así como su diseño gráfico y códigos fuente (en adelante, los “Contenidos”), son propiedad de la Fundación Real Madrid o tiene la correspondiente licencia, autorización o cesión de los derechos de propiedad intelectual, industrial y de imagen sobre los contenidos y servicios disponibles a través de la misma, sin que puedan entenderse cedidos al Usuario ninguno de los derechos de explotación reconocidos por la normativa vigente en materia de propiedad intelectual sobre los mismos, salvo aquellos que resulten estrictamente necesarios para el uso de esta plataforma OTT. El Usuario se compromete a hacer un uso adecuado de dichos contenidos, siendo el único fin de los mismos su información y formación, y no pudiendo copiarlos, modificarlos, divulgarlos, comunicarlos y/o hacer cualquier otro uso distinto del destinado a su fin, sin la autorización expresa de la Fundación Real Madrid. El incumplimiento del deber de secreto y/o la utilización indebida de los contenidos así como o materiales proporcionados, puede dar lugar a responsabilidades civiles e incluso penales.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">Las marcas, nombres comerciales o signos distintivos son titularidad de la Fundación Real Madrid o terceros, sin que pueda entenderse que el acceso y/o el pago de los servicios ofertados a través de la plataforma OTT atribuya ningún derecho sobre las citadas marcas, nombres comerciales y/o signos distintivos.\u003C/p>\u003Cp style=\"text-align: justify;\">En virtud de lo dispuesto en el Real Decreto Legislativo 1/1996, de 12 de abril, por el que se aprueba el Texto Refundido de la Ley de Propiedad Intelectual, regularizando, aclarando y armonizando las disposiciones legales vigentes sobre la materia, quedan expresamente prohibidas la reproducción, la distribución y la comunicación pública, incluida su modalidad de puesta a disposición, de la totalidad o parte de los contenidos, con fines comerciales, en cualquier soporte y por cualquier medio técnico, sin la autorización expresa y por escrito de la Fundación Real Madrid o del tercero titular de los derechos afectados.\u003C/p>\u003Cp style=\"text-align: justify;\">El Usuario se compromete a respetar los derechos de Propiedad Intelectual e Industrial titularidad de la Fundación Real Madrid y/o de terceros.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>3.- Condiciones de esta plataforma OTT.\u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cem>3.1.- Generalidades\u003C/em>\u003C/p>\u003Cp style=\"text-align: justify;\">El Usuario reconoce y acepta que el acceso y uso de esta plataforma OTT tiene lugar libre y conscientemente, bajo su exclusiva responsabilidad.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">El Usuario se obliga a hacer un uso correcto y lícito de esta plataforma OTT de conformidad con la Ley, el presente Aviso Legal, la buena fe y el orden público. El Usuario responderá frente a la Fundación Real Madrid o frente a terceros, de cualesquiera daños y perjuicios que pudieran causarse como consecuencia del incumplimiento de dicha obligación.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">Queda expresamente prohibido el uso de esta plataforma OTT con fines lesivos de bienes o intereses de la Fundación Real Madrid o de terceros o que de cualquier otra forma sobrecarguen, dañen o inutilicen las redes, servidores y demás equipos informáticos (hardware) o productos y aplicaciones informáticas (software) de la Fundación Real Madrid o de terceros.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">También están prohibidas las siguientes acciones:\u003C/p>\u003Cul>\u003Cli style=\"text-align: justify;\">El uso de virus informáticos o cualquier otro código, archivo o programa que esté diseñado o tenga por objeto interrumpir, dañar o limitar el funcionamiento de cualquier software, hardware o equipo de telecomunicaciones, o dañar u obtener acceso no autorizado a datos u otra información de la Fundación Real Madrid o de terceros.\u003C/li>\u003Cli style=\"text-align: justify;\">Suplantar, interferir o interrumpir el servicio, los servidores o las redes conectadas a los servicios o incumplir los requisitos, procedimientos, políticas o normativas de las redes conectadas a los servicios.\u003C/li>\u003Cli style=\"text-align: justify;\">Utilizar scripts automatizados o screen scraping para recoger información o interactuar con la Fundación Real Madrid.\u003C/li>\u003Cli style=\"text-align: justify;\">Recuperar sistemáticamente datos u otros contenidos de la Fundación Real Madrid para crear, directa o indirectamente, en descargas únicas o múltiples, una colección de datos, ya sea manualmente o mediante bots, crawlers o similares.\u003C/li>\u003Cli style=\"text-align: justify;\">Acceder, manipular o utilizar áreas no públicas de esta plataforma OTT, los sistemas informáticos de la Fundación Real Madrid o los sistemas de sus proveedores.\u003C/li>\u003Cli style=\"text-align: justify;\">Cualquier intento de probar la vulnerabilidad de cualquier sistema o red de la Fundación Real Madrid o de violar cualquier medida de seguridad o autenticación.\u003C/li>\u003Cli style=\"text-align: justify;\">Falsificar o alterar cualquier información de la Fundación Real Madrid.\u003C/li>\u003Cli style=\"text-align: justify;\">Intentar descifrar, descompilar, desensamblar software de la Fundación Real Madrid o de terceros.\u003C/li>\u003Cli style=\"text-align: justify;\">Suprimir, ocultar o manipular las notas sobre derechos de autor y demás datos identificativos de la Fundación Real Madrid o de terceros incorporados a los Contenidos, así como los dispositivos técnicos de protección o cualesquiera mecanismos de información que puedan insertarse en los Contenidos.\u003C/li>\u003Cli style=\"text-align: justify;\">Colaborar con un tercero para realizar alguna de las conductas descritas.\u003C/li>\u003C/ul>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cem>3.2.- Particulares (Condiciones de uso)\u003C/em>\u003C/p>\u003Cp style=\"text-align: justify;\">La Fundación Real Madrid, a través de esta plataforma OTT, permite a los Usuarios acceder a contenidos formativos y de actividades propias de la Fundación, así como a contenidos de entidades relacionadas con esta, transmitidos a través de Internet a determinados dispositivos conectados a Internet. Esta plataforma OTT es una plataforma con contenidos de acceso gratuito y de pago.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">Respecto a los contenidos de pago, se informa al Usuario que esta plataforma OTT no recoge ningún dato del Usuario relativo a tarjetas de pago, cuentas bancarias, etc. siendo delegados en las propias pasarelas del banco Santander, Paypal, Stripe, Google y Apple, donde el Usuario puede acceder a completar los datos de pago. Durante el proceso de pago, puede llevarle de la plataforma OTT a otra plataforma de la Fundación Real Madrid (Yunbit) para formalizar y finalizar el proceso de pago, pero el pago final con la información bancaria siempre se realizará a través de alguna pasarela de pago comentada anteriormente. La Fundación Real Madrid es ajena a las políticas y aviso legal de las distintas pasarelas de pago, debiendo el Usuario acceder a las mismas para su lectura y aceptación.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">Debido al tipo de servicio ofrecido, la Fundación Real Madrid no devolverá los pagos por los servicios contratados por el Usuario.\u003C/p>\u003Cp style=\"text-align: justify;\">Para la utilización de esta plataforma OTT, en caso de ser solicitada, el Usuario será responsable de aportar información veraz y lícita. Si como consecuencia del registro, se dotara al Usuario de un código y/o contraseña, éste se compromete a hacer un uso diligente y a mantener en secreto los mismos para acceder a estos servicios. En consecuencia, los Usuarios son responsables de la adecuada custodia y confidencialidad de cualesquiera identificadores y/o contraseñas que le sean suministradas por la Fundación Real Madrid, y se comprometen a no ceder su uso a terceros, ya sea temporal o permanente, ni a permitir su acceso a personas ajenas. Será responsabilidad del Usuario la utilización de los servicios por cualquier tercero ilegítimo que emplee a tal efecto una contraseña o identificador a causa de una utilización no diligente o de la pérdida de los mismos por el Usuario.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">En caso de olvido de la contraseña o cualquier otra circunstancia que suponga un riesgo de acceso y/o utilización por parte de terceros no autorizados, el usuario deberá comunicarlo inmediatamente a la Fundación Real Madrid a fin de que procedamos inmediatamente al bloqueo y sustitución de la misma. En todo caso, cualesquiera operaciones realizadas antes de dicha comunicación se reputarán efectuadas por el titular de la contraseña, quien será responsable y pagará los gastos y/o daños que se deriven de cualquier acceso y/o uso no autorizado que se realice con anterioridad a dicha comunicación.\u003C/p>\u003Cp style=\"text-align: justify;\">La Fundación Real Madrid se reserva el derecho a denegar la prestación del servicio a cualquier persona por cualquier motivo y/o a interrumpir el servicio total o parcialmente en cualquier momento, con o sin previo aviso.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cem>3.3.- Contenidos\u003C/em>\u003C/p>\u003Cp style=\"text-align: justify;\">El Usuario se compromete a utilizar todos los contenidos (materiales didácticos, documentos, vídeos, sonidos, imágenes, software, etc.) disponibles en esta plataforma OTT y/o generados por la prestación del servicio, de conformidad con la Ley, el presente Aviso Legal, la buena fe y el orden público, así como con las demás condiciones, reglamentos e instrucciones que en su caso pudieran ser de aplicación de conformidad con lo dispuesto en la Cláusula Primera.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">A título de ejemplo, el Usuario, de conformidad con la legislación vigente, se abstendrá de:\u003C/p>\u003Cp style=\"text-align: justify;\">a)&nbsp;&nbsp;&nbsp;Reproducir, copiar, distribuir, poner a disposición, comunicar públicamente, transformar o modificar los contenidos salvo en los casos autorizados en la ley o expresamente consentidos por escrito por la Fundación Real Madrid o por quien ostente la titularidad de los derechos de explotación en su caso.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">b)&nbsp;&nbsp;&nbsp;Reproducir o copiar para uso privado los Contenidos que puedan ser considerados como software o base de datos de conformidad con la legislación vigente en materia de propiedad intelectual, así como su comunicación pública o puesta a disposición de terceros cuando estos actos impliquen necesariamente la reproducción por parte del Usuario o de un tercero.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">c)&nbsp;&nbsp;&nbsp;&nbsp;Extraer y/o reutilizar la totalidad o una parte sustancial de los contenidos que la Fundación Real Madrid ponga a disposición de los Usuarios.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">d)&nbsp;&nbsp;&nbsp;Obtener o intentar obtener los contenidos empleando para ello medios o procedimientos distintos de los que, según los casos, se hayan puesto a su disposición a este efecto o se hayan indicado expresamente en esta plataforma OTT o, en general, de los que se empleen habitualmente en Internet por no entrañar un riesgo de daño o inutilización del Sitio Web y/o de los Servicios.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cem>3.4.- Introducción de enlaces a esta plataforma OTT\u003C/em>\u003C/p>\u003Cp style=\"text-align: justify;\">Los usuarios que deseen insertar enlaces desde sus propias páginas web a esta plataforma OTT deberán cumplir las condiciones que se detallan a continuación, sin que el desconocimiento de las mismas evite las responsabilidades derivadas de la Ley:\u003C/p>\u003Cp style=\"text-align: justify;\">a)&nbsp;El enlace únicamente vinculará con la home page o página principal de esta plataforma OTT pero no podrá reproducirla de ninguna forma (inline links, copia de textos, gráficos, etc.).\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">b)&nbsp;&nbsp;Quedará en todo caso prohibido, de conformidad con la legislación aplicable y vigente en cada momento, establecer frames de cualquier tipo que rodeen a esta plataforma OTT o permitan la visualización de los contenidos a través de direcciones de Internet distintas de los de esta plataforma OTT y, en todo caso, cuando se visualicen conjuntamente con contenidos ajenos a esta plataforma OTT de forma que: (i) produzca, o pueda producir, error, confusión o engaño en los Usuarios sobre la verdadera procedencia del servicio o contenido; (ii) suponga un acto de comparación o imitación desleal; (iii) sirva para aprovechar la reputación de la marca y prestigio de la Fundación Real Madrid; o (iv) de cualquier otra forma resulte prohibido por la legislación vigente.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">c)&nbsp;No se realizarán desde la página que introduce el enlace ningún tipo de manifestación falsa, inexacta o incorrecta sobre la Fundación Real Madrid, su entidad fundadora (Real Madrid C.F.), patronos, empleados, clientes o sobre la calidad de los servicios que presta.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">d)&nbsp;&nbsp;En ningún caso, se expresará en la página donde se ubique el enlace que la Fundación Real Madrid ha prestado su consentimiento para la inserción del enlace o que de otra forma patrocina, colabora, verifica o supervisa los servicios del remitente.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">e)&nbsp;Queda prohibida la utilización de cualquier marca denominativa, gráfica o mixta o cualquier otro signo distintivo de la Fundación Real Madrid dentro de la página del remitente salvo en los casos permitidos por la ley o expresamente autorizados por escrito por la Fundación Real Madrid y siempre que, en estos casos, se permita un enlace directo con esta plataforma OTT en la forma establecida en esta Cláusula.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">f)&nbsp;La página que establezca el enlace deberá cumplir fielmente con la ley y no podrá en ningún caso disponer o enlazar con contenidos propios o de terceros que (i) sean ilícitos, nocivos o contrarios a la moral y a las buenas costumbres (pornográficos, violentos, racistas, etc.) ); (ii) induzcan o puedan inducir en el Usuario la falsa concepción de que la Fundación Real Madrid suscribe, respalda, se adhiere o de cualquier manera apoya, las ideas, manifestaciones o expresiones, lícitas o ilícitas, del remitente; (iii) sean inapropiados o irrelevantes para la actividad de la Fundación Real Madrid en atención al lugar, contenido y temática del sitio web del remitente.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>4.- Sistema Interno de Información (Canal ético) \u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">Denuncia de actividades de carácter ilícito e inadecuado:\u003C/p>\u003Cp style=\"text-align: justify;\">Si usted es conocedor/a de alguna conducta irregular descrita en el presente documento así como, contraria a la ley, podrá comunicarlo accediendo a través del siguiente enlace \u003Ca href=\"https://www.sofidya.com/fundacionrealmadrid/canal-etico\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"color: rgb(63, 78, 206);\">https://www.sofidya.com/fundacionrealmadrid/canal-etico\u003C/a>.&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">Asimismo, le informamos que la Fundación Real Madrid cuenta con un programa de cumplimiento y su Código Ético y de Buen Gobierno \u003Ca href=\"https://www.realmadrid.com/sobre-el-real-madrid/fundacion/transparencia\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"color: rgb(63, 78, 206);\">https://www.realmadrid.com/sobre-el-real-madrid/fundacion/transparencia\u003C/a> - Código de Buen Gobierno) es uno de los pilares fundamentales del Sistema de Gestión de Riesgos Penales. Este código contiene los valores y directrices que deben regir nuestra actividad y se basa en los principios de responsabilidad, integridad, transparencia y ética corporativa, que son de aplicación a todos los empleados, colaboradores y cualquier tercero que mantenga algún tipo de relación con la Fundación Real Madrid.\u003C/p>\u003Cp style=\"text-align: justify;\">Cualquier incumplimiento normativo y/o contrario al código ético podrá ser comunicado a través del Sistema Interno de Información (canal ético)&nbsp;\u003Ca href=\"https://www.sofidya.com/fundacionrealmadrid/canal-etico\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"color: rgb(63, 78, 206);\">https://www.sofidya.com/fundacionrealmadrid/canal-etico\u003C/a>.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>5.- Duración y modificación\u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">Los términos y condiciones aquí establecidos podrán ser modificados, total o parcialmente, mediante la publicación de cualquier cambio a través de cualquier tipo de comunicación a los Usuarios.\u003C/p>\u003Cp style=\"text-align: justify;\">La Fundación Real Madrid podrá suprimir, añadir o cambiar tanto los contenidos y servicios que presta como la forma en la que éstos aparezcan localizados o presentados. Se entenderán como vigentes, las condiciones que estén publicadas en el momento en el que el Usuario acceda a esta plataforma OTT.\u003C/p>\u003Cp style=\"text-align: justify;\">La Fundación Real Madrid le invita a consultar periódicamente este Aviso Legal.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>6. Legislación y jurisdicción competente\u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">El presente Aviso Legal se rige en todos y cada uno de sus extremos por la ley española para la resolución de cualquier controversia en relación con el presente Aviso Legal o la relación entre las mismas.\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cbr>\u003C/p>","INT","legal-notice",{"id":20,"label":21,"link":10,"html":22,"type":17,"friendly_url":23,"identifier":12},71,"Política de privacidad","\u003Ch1 style=\"text-align: center;\">\u003Cstrong>Política de privacidad\u003C/strong>\u003C/h1>\u003Cp>\u003Cbr>\u003C/p>\u003Cp style=\"text-align: justify;\">Se informa al Usuario que para acceder a los contenidos ofrecidos a través de esta plataforma OTT “Sport Values Academy Fundación Real Madrid” (en adelante, plataforma OTT), se podrán solicitar datos de carácter personal. A través de la presente política de protección de datos, se informa al Usuario/a del tratamiento de datos a realizar por la Fundación Real Madrid.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">El acceso voluntario por parte del Usuario/a a los contenidos ofrecidos a través de esta plataforma OTT, implica la aceptación por parte del Usuario de lo dispuesto en la presente política de protección de datos. Si el Usuario no la acepta, deberá abstenerse de utilizar esta plataforma OTT.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">El/La Usuario/a que acceda y/o adquiera contenidos ofrecidos a través de esta plataforma OTT deberá ser mayor de 14 años. Menores de dicha edad sólo podrán utilizar esta plataforma con el compromiso, supervisión y autorización de su padre, madre o tutor/a legal.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">De conformidad con lo dispuesto en el Reglamento (UE) 2016/679 del Parlamento Europeo y del Consejo, de 27 de abril de 2016, relativo a las personas físicas en lo que respecta al tratamiento de datos personales y a la libre circulación de estos datos (RGPD); a la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales; y demás normativa española vigente en materia de protección de datos, le informamos que los datos personales facilitados serán incorporados al Sistema de Protección de Datos de la Fundación Real Madrid.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>Identificación del responsable del tratamiento:\u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">Identidad: FUNDACIÓN REAL MADRID\u003C/p>\u003Cp style=\"text-align: justify;\">CIF: G-81829493\u003C/p>\u003Cp style=\"text-align: justify;\">Domicilio social: Avda. Concha Espina nº 1, 28036 de Madrid (España)\u003C/p>\u003Cp style=\"text-align: justify;\">Teléfono: 91.453.29.00\u003C/p>\u003Cp style=\"text-align: justify;\">Correo electrónico: \u003Ca href=\"mailto:correo.fundacion@corp.realmadrid.com\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"color: rgb(63, 78, 206);\">correo.fundacion@corp.realmadrid.com\u003C/a>\u003C/p>\u003Cp style=\"text-align: justify;\">Delegado de Protección de Datos: Persevera, S.L.U. (\u003Ca href=\"mailto:mdp.dpo@perseveragrupo.com\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"color: rgb(63, 78, 206);\">mdp.dpo@perseveragrupo.com\u003C/a>).\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>Finalidad del tratamiento:\u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">La finalidad del tratamiento de los datos recabados es gestionar su acceso a los diferentes cursos, talleres, contenidos formativos y otros contenidos sobre la Fundación Real Madrid y de entidades relacionadas con esta, y que son accesibles y ofrecidos a través de esta plataforma OTT “Sport Values Academy Fundación Real Madrid”.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">Se incluye el envío de comunicaciones propias sobre el servicio accedido y/o contratado por el/la Usuario/a así como sobre los contenidos de la propia plataforma OTT que puedan ser de su interés; y encuestas de satisfacción y opinión, con el fin de mejorar el servicio ofertado por la Fundación Real Madrid en beneficio de los Usuarios/as. En todo momento podrá oponerse a este tratamiento a través de \u003Ca href=\"mailto:cumplimiento.fundacion@corp.realmadrid.com\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"color: rgb(63, 78, 206);\">cumplimiento.fundacion@corp.realmadrid.com\u003C/a> o a través del Delegado de Protección de Datos.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">Por otra parte, queda informado que puede existir la posibilidad de que hayan cursos, congresos, seminarios, talleres, etc.. en los cuales participe y puedan ser grabados, reproducidos en la plataforma OTT, distribuidos entre los Usuarios/as como material formativo y/o utilizados por la Fundación Real Madrid para la generación de otros materiales audiovisuales y su posterior reproducción en su página web, redes sociales, medios escritos, etc.. todo ello con la finalidad de promocionar y dar a conocer la actividad de la Fundación Real Madrid. En aquellas actividades que vayan a ser grabadas, usted puede gestionar desde su equipo, el encendido o apagado de su cámara y/o micrófono, dando de manera voluntaria si deja encendida su cámara y/o micrófono, consentimiento a la Fundación Real Madrid para el tratamiento de su imagen y/o voz.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>Legitimación para el tratamiento de sus datos:\u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">La base legal para el tratamiento de sus datos es el consentimiento inequívoco del Usuario, que voluntariamente desea acceder y se registra en la plataforma OTT de la Fundación Real Madrid para el acceso a los contenidos ofrecidos a través de la misma.\u003C/p>\u003Cp style=\"text-align: justify;\">Los datos tratados por la Fundación Real Madrid y facilitados por el Usuario para el acceso a los diferentes contenidos ofrecidos a través del acceso a esta plataforma OTT pueden ser: nombre de usuario, contraseña, nombre y apellidos, número de identificación fiscal, dirección de correo electrónico, sexo, edad y país. Asimismo, cualquier información facilitada por el Usuario a través de valoraciones, encuestas, preferencias, etc.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">Respecto a los contenidos de pago, se informa al Usuario que esta plataforma OTT no recoge ningún dato del Usuario relativo a tarjetas de pago, cuentas bancarias, etc. siendo delegados en las propias pasarelas del banco Santander, Paypal, Stripe, Google y Apple, donde el Usuario puede acceder a completar los datos de pago. Durante el proceso de pago, puede llevarle de la plataforma OTT a otra plataforma de la Fundación Real Madrid (Yunbit) para formalizar y finalizar el proceso de pago, pero el pago final con la información bancaria siempre se realizará a través de alguna pasarela de pago comentada anteriormente. La Fundación Real Madrid es ajena a la política de privacidad y/o protección de datos de las distintas pasarelas de pago, debiendo el Usuario acceder a las mismas para su lectura y aceptación.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">Los datos sólo podrán utilizarse para los fines establecidos en la finalidad del tratamiento, de conformidad con los principios de transparencia y limitación de la finalidad.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>Conservación de datos:\u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">Los datos personales proporcionados se conservarán durante el tiempo necesario para el cumplimiento de la finalidad para la que se recaben, o en su caso, el tiempo legal establecido para cada una de las obligaciones legales derivadas del tratamiento y/o mientras dure su consentimiento.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>Comunicación de datos:\u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">Los datos sólo se comunicarán en los casos en que sea legalmente necesario y/o, cuando por necesidades del servicio, para el correcto desarrollo de la actividad, pueda existir la colaboración de algunos terceros proveedores de servicios que tengan acceso a sus datos personales y que tratan los referidos datos en nombre y por cuenta de la Fundación Real Madrid como consecuencia de su prestación de servicios.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>Derechos:\u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">Cualquier Usuario tiene derecho a obtener confirmación sobre el tratamiento de sus datos realizado por la Fundación Real Madrid. Asimismo, en los términos establecidos en la normativa de protección de datos, podrá ejercer sus derechos de acceso, rectificación, oposición, limitación, supresión, portabilidad y a no ser objeto de decisiones automatizadas dirigiéndose a través del correo electrónico: \u003Ca href=\"mailto:cumplimiento.fundacion@corp.realmadrid.com.\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"color: rgb(63, 78, 206);\">cumplimiento.fundacion@corp.realmadrid.com.\u003C/a> También a través de nuestro Delegado de Protección de Datos (Persevera, S.L.U. a través del correo electrónico (\u003Ca href=\"mailto:mdp.dpo@perseveragrupo.com\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"color: rgb(63, 78, 206);\">mdp.dpo@perseveragrupo.com\u003C/a>).\u003C/p>\u003Cp style=\"text-align: justify;\">Asimismo, le informamos del derecho a presentar una reclamación ante la Autoridad de Control, Agencia Española de Protección de Datos.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>Origen\u003C/strong>:\u003C/p>\u003Cp style=\"text-align: justify;\">Los datos personales que tratamos en la Fundación Real Madrid proceden del propio interesado que accede y se registra en la plataforma OTT.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>Modificaciones de la política de protección de datos:\u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">La política de protección de datos aquí recogida podrá ser modificada, total o parcialmente, de acuerdo con la normativa vigente, publicándose los cambios a través de cualquier tipo de comunicación dirigida a los Usuarios.\u003C/p>\u003Cp style=\"text-align: justify;\">La Fundación Real Madrid le invita a consultar periódicamente esta política de protección de datos.\u003C/p>\u003Cp style=\"text-align: justify;\">Para eliminar su cuenta de Fundación Real Madrid SVA TV debe acceder a la configuración de usuario y pulsar sobre la opción \"Eliminar cuenta\". Se eliminarán todos los datos del usuario. Se conservarán las métricas de visionado que el usuario tuviera en la OTT.\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cbr>\u003C/p>","privacy-policy",{"id":25,"label":26,"link":10,"html":27,"type":17,"friendly_url":28,"identifier":12},72,"Política de cookies","\u003Ch1 style=\"text-align: center;\">\u003Cstrong>Política de cookies\u003C/strong>\u003C/h1>\u003Cp>\u003Cbr>\u003C/p>\u003Cp style=\"text-align: justify;\">Con el fin de ofrecer el mejor servicio y con el objeto de facilitar su uso, la Fundación Real Madrid, a través de la plataforma OTT, utiliza cookies necesarias, no recabando otra información de los Usuarios.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>1. ¿Qué son las Cookies?\u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">Una cookie es un archivo que se descarga en su equipo (ordenador o dispositivo móvil) con la finalidad de almacenar datos que podrán ser actualizados y recuperados por la entidad responsable de su instalación.\u003C/p>\u003Cp style=\"text-align: justify;\">La información recabada a través de las cookies puede incluir la fecha y hora de visitas al Sitio Web, las páginas visionadas, el tiempo que ha estado en nuestro Sitio Web y los sitios visitados justo antes y después del mismo.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>Cookies propias\u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">Son aquellas cookies que son enviadas a su ordenador y gestionadas exclusivamente por nosotros para el mejor funcionamiento de la plataforma OTT. La información que recabamos se emplea para mejorar la calidad de nuestro servicio y su experiencia como usuario. Estas cookies permanecen en su navegador más tiempo, permitiéndonos reconocerle como visitante recurrente y adaptar el contenido para ofrecerle contenidos que se ajusten a sus preferencias.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>Cookies de terceros\u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">Si interactúa con el contenido de la plataforma OTT también pueden establecerse cookies de terceros. Las cookies de terceros, son aquellas establecidas por un dominio diferente de nuestra plataforma OTT y no son gestionadas por nosotros ni se destinan a finalidades nuestras. No podemos acceder a los datos almacenados en las cookies de otros sitios web cuando navegue en los citados sitios web, por lo que le recomendamos que revise las políticas de cookies y privacidad de cada sitio web. En general, si navega por Internet puede aceptar o rechazar las cookies de terceros desde las opciones de configuración de su navegador.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>2. Cookies que se usan en el Sitio Web y su finalidad\u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">Nuestro Sitio Web utiliza las cookies que se describen a continuación:\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>Cookies estrictamente necesarias\u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">Estas cookies son necesarias para que el sitio web funcione y no se pueden desactivar en nuestros sistemas. Usualmente están configuradas para responder a acciones hechas por usted para recibir servicios, tales como ajustar sus preferencias de privacidad, iniciar sesión en el sitio, o llenar formularios. Usted puede configurar su navegador para bloquear o alertar la presencia de estas cookies, pero algunas partes del sitio web no funcionarán. Este tipo de cookies conservan información por un período de hasta 90 días.\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>3. Contacto\u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">Si tiene alguna pregunta, comentario o sugerencia sobre la Política de Cookies, escriba a: \u003Ca href=\"mailto:cumplimiento.fundacion@corp.realmadrid.com\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"color: rgb(63, 78, 206);\">cumplimiento.fundacion@corp.realmadrid.com\u003C/a>\u003C/p>\u003Cp style=\"text-align: justify;\">&nbsp;\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cstrong>4. Cambios en la Política de Cookies\u003C/strong>\u003C/p>\u003Cp style=\"text-align: justify;\">Es posible que actualicemos la Política de Cookies de nuestro Sitio Web, por ello le recomendamos revisar esta política cada vez que acceda a nuestra plataforma OTT, con el objetivo de estar adecuadamente informado sobre cómo y para qué usamos las cookies. La Política de Cookies se actualizó por última vez a fecha 14 de noviembre de 2023.\u003C/p>\u003Cp style=\"text-align: justify;\">\u003Cbr>\u003C/p>","cookies-policy",{"has_search":30,"has_login_link":30,"has_register_link":30},true,{"block_payment_categories":32,"block_payment_contents":32,"can_use_session_codes":32,"can_use_payments":30},false,{"datalake_url":34,"secondview_time_seconds":35},"https://tracking.interactvty.com/tracking/events/",20,{"has_chat_assistant":32,"platform_vars":37},{},{"background_color":12},{"token_swarmcloud":10},["Reactive",41],{"$snuxt-i18n-meta":42},{},["Set"],["ShallowReactive",45],{"home-es":12},"/",["Reactive",48],{"user":49,"session":58,"apiCache":60,"c
