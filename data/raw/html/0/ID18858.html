.landing-page{
    color:#ffffff;
    float:left;
    width:100%;
    height:100vh;
    background-size:cover !important;
    background-position:center !important;
}

.grid-container {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr 2fr 1fr;
    gap: 0px 0px;
}

.landing-page-top,
.landing-page-middle,
.landing-page-bottom{
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.landing-page-top,
.landing-page-bottom{
    position:relative;
    background:rgba(73,84,76,.6);
}

.landing-page-top:after,
.landing-page-bottom:after{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.4);
}

.landing-page-top img{
    position:relative;
    z-index:1;
    width:180px;
}

.landing-page-middle{

    font-size:14px;

.landing-page-middle h1{
    color: white;
    font-size:64px;
   text-transform:uppercase; 
   clear: both;
}

.landing-page-bottom-block{
    width:25%;
}

.landing-page-bottom img{
    position:relative;
    z-index:1;
    width:128px;
