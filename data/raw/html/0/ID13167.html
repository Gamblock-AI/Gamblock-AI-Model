 class=&quot;c11 c25&quot; id=&quot;h.gjdgxs&quot;&gt;&lt;span class=&quot;c4&quot;&gt;Last Updated: 15 July 2019&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c5 c11&quot;&gt;&lt;span class=&quot;c4&quot;&gt;NEWSROOM AI PRIVACY NOTICE&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c17 c11&quot;&gt;&lt;span class=&quot;c4&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;Newsroom AI Ltd is the controller of the personal data about you which is collected from your use of Newsroom AI. A controller is the person who determines the purpose and manner in which your personal data is processed.&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c5&quot;&gt;&lt;span class=&quot;c3&quot;&gt;This privacy notice explains what information we hold and collect about you, how we&amp;rsquo;ll use that information, who we&amp;rsquo;ll share it with, the circumstances in which we&amp;rsquo;ll share it and what steps we&amp;rsquo;ll take to make sure it stays private and secure.&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c5 c20&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c5&quot;&gt;&lt;span class=&quot;c3&quot;&gt;It continues to apply even after you stop using Newsroom AI. &lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c5 c11 c20&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Who we are&lt;br&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c5 c11&quot;&gt;&lt;span class=&quot;c14&quot;&gt;We are Newsroom AI Ltd, a company registered in England and Wales with company number &lt;/span&gt;&lt;span class=&quot;c14 c23&quot;&gt;08709478 and&lt;/span&gt;&lt;span class=&quot;c14&quot;&gt;&amp;nbsp;with a registered office at &lt;/span&gt;&lt;span class=&quot;c14 c23&quot;&gt;C/O Wework, 123 Buckingham Palace Road, London, England, SW1W 9SH&lt;/span&gt;&lt;span class=&quot;c14&quot;&gt;. &amp;nbsp;You can write to us at &lt;/span&gt;&lt;span class=&quot;c14 c23&quot;&gt;123 Buckingham Palace Road, London, England, SW1W 9SH&lt;/span&gt;&lt;span class=&quot;c14&quot;&gt;&amp;nbsp;or by email to support@nws.ai. &amp;nbsp;For more information please visit our website at &lt;/span&gt;&lt;span class=&quot;c14 c18&quot;&gt;&lt;a class=&quot;c6&quot; href=&quot;https://www.google.com/url?q=http://www.nws.ai&amp;amp;sa=D&amp;amp;source=editors&amp;amp;ust=1625131579989000&amp;amp;usg=AOvVaw2CiZveuBkNxWq7hrb1BaPJ&quot;&gt;www.nws.ai&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;c3&quot;&gt;.&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c12&quot;&gt;What data we hold&lt;br&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;We may collect, use, store and transfer different kinds of personal data about you which we have grouped together as follows:&lt;/span&gt;&lt;/p&gt;&lt;ul class=&quot;c9 lst-kix_list_19-0 start&quot;&gt;&lt;li class=&quot;c8 li-bullet-0&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Identity Data&lt;/span&gt;&lt;span class=&quot;c3&quot;&gt;&amp;nbsp;includes first name, last name, username or similar identifier.&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c8 li-bullet-0&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Contact Data&lt;/span&gt;&lt;span class=&quot;c3&quot;&gt;&amp;nbsp;includes billing address, delivery address, email address and telephone numbers.&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c8 li-bullet-0&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Financial Data&lt;/span&gt;&lt;span class=&quot;c3&quot;&gt;&amp;nbsp;includes bank account and payment card details.&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c8 li-bullet-0&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Transaction Data&lt;/span&gt;&lt;span class=&quot;c3&quot;&gt;&amp;nbsp;includes details about payments to and from you and other details of products and services you have purchased from us.&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c8 li-bullet-0&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Technical Data&lt;/span&gt;&lt;span class=&quot;c3&quot;&gt;&amp;nbsp;includes internet protocol (IP) address, your login data, browser type and version, time zone setting and location, browser plug-in types and versions, operating system and platform, and other technology on the devices you use to access this website.&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c8 li-bullet-0&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Profile Data &lt;/span&gt;&lt;span class=&quot;c3&quot;&gt;includes your username and password, purchases or orders made by you, your interests, preferences, feedback and survey responses.&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c8 li-bullet-0&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Usage Data&lt;/span&gt;&lt;span class=&quot;c3&quot;&gt;&amp;nbsp;includes information about how you use our website, products and services. &lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c8 li-bullet-0&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Marketing and Communications Data &lt;/span&gt;&lt;span class=&quot;c3&quot;&gt;includes your preferences in receiving marketing from us and our third parties.&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;We also collect, use and share aggregated data such as statistical or demographic data for any purpose. Aggregated data could be derived from your personal data but is not considered personal data in law as this data will not directly or indirectly reveal your identity. For example, we may aggregate your usage data to calculate the percentage of users accessing a specific website feature. However, if we combine or connect aggregated data with your personal data so that it can directly or indirectly identify you, we treat the combined data as personal data which will be used in accordance with this privacy policy.&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Cookies and other tracking technology&lt;br&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c14&quot;&gt;You can set your browser to refuse all or some browser cookies, or to alert you when websites set or access cookies. If you disable or refuse cookies, please note that some parts of our service may become inaccessible or not function properly. For more information about the cookies and other tracking technology we use, please see our &lt;/span&gt;&lt;span class=&quot;c13&quot;&gt;&lt;a class=&quot;c6&quot; href=&quot;https://cdn.thenewsroom.io/docs/cookies.pdf&quot; target=&quot;_blank&quot;&gt;cookie policy&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;c3&quot;&gt;.&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c12&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c12&quot;&gt;If you fail to provide personal data&lt;br&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;If you fail to provide data when requested, we may not be able to perform our services (or may perform them, but less effectively).&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Where we obtain your data from&lt;br&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;We obtain your personal data from the following source:&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;ul class=&quot;c9 lst-kix_list_18-0 start&quot;&gt;&lt;li class=&quot;c7 c21 li-bullet-0&quot;&gt;&lt;span class=&quot;c3&quot;&gt;Personal data you provide directly to us by completing our account form online,&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c7 c21 li-bullet-0&quot;&gt;&lt;span class=&quot;c3&quot;&gt;Personal data you provide directly to us by setting your preferences online,&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c7 c21 li-bullet-0&quot;&gt;&lt;span class=&quot;c3&quot;&gt;Personal data we collect about you by using cookies and other forms of tracking technology &amp;nbsp;Please see our &lt;/span&gt;&lt;span class=&quot;c13&quot;&gt;&lt;a class=&quot;c6&quot; href=&quot;https://cdn.thenewsroom.io/docs/cookies.pdf&quot; target=&quot;_blank&quot;&gt;cookie policy&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;c3&quot;&gt;&amp;nbsp;for more information on this.&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c12&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c12&quot;&gt;How your personal data will be used by us&lt;br&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;We will store, access and use your personal data:&lt;/span&gt;&lt;/p&gt;&lt;ol class=&quot;c9 lst-kix_list_10-0 start&quot; start=&quot;1&quot;&gt;&lt;li class=&quot;c7 c10 li-bullet-0&quot;&gt;&lt;span class=&quot;c3&quot;&gt;for the purpose of administering your account &lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c7 c10 li-bullet-0&quot;&gt;&lt;span class=&quot;c3&quot;&gt;for the purpose of providing the Newsroom AI services to you;&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c7 c10 li-bullet-0&quot;&gt;&lt;span class=&quot;c3&quot;&gt;for marketing purposes, as set out in Marketing below,&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c7 c10 li-bullet-0&quot;&gt;&lt;span class=&quot;c3&quot;&gt;to carry out data analytics so that we can better understand your circumstances and preferences, and so that we can improve our products and services,&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c7 c10 li-bullet-0&quot;&gt;&lt;span class=&quot;c3&quot;&gt;to retain a history of your account for future reference by you and/or us in case of any legal claim, as set out in Retention and Deletion below.&lt;/span&gt;&lt;/li&gt;&lt;/ol&gt;&lt;p class=&quot;c19&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;We will only use your personal information for the purposes for which we collected it, unless we reasonably consider that we need to use it for another reason and that reason is compatible with the original purpose. If we need to use your personal information for an unrelated purpose, we will notify you at the time and we will explain the legal basis which allows us to do so. &lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1 c26&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c0&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Legal grounds for our use of your personal data&lt;br&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c0&quot;&gt;&lt;span class=&quot;c3&quot;&gt;Our use of your personal data (as described above) is necessary for:&lt;/span&gt;&lt;/p&gt;&lt;ol class=&quot;c9 lst-kix_list_12-0 start&quot; start=&quot;1&quot;&gt;&lt;li class=&quot;c7 c10 li-bullet-0&quot;&gt;&lt;span class=&quot;c3&quot;&gt;is necessary for the performance of a contract to which you are a party,&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c7 c10 li-bullet-0&quot;&gt;&lt;span class=&quot;c3&quot;&gt;our legitimate interests which include:&lt;/span&gt;&lt;/li&gt;&lt;/ol&gt;&lt;ol class=&quot;c9 lst-kix_list_14-1 start&quot; start=&quot;1&quot;&gt;&lt;li class=&quot;c7 c22 li-bullet-1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;providing the Newsroom AI services to you;&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c7 c22 li-bullet-2&quot;&gt;&lt;span class=&quot;c3&quot;&gt;marketing as set out in Marketing below. You have the right to opt out of receiving such communications at any time;&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c7 c22 li-bullet-1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;the carrying out of data analytics so that we can better understand your circumstances and preferences, and so that we can improve our products and services,&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c7 c22 li-bullet-1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;retaining a historical record of your account in case of any future legal claim.&lt;/span&gt;&lt;/li&gt;&lt;/ol&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;Our use of your personal data is subject to a framework of safeguards that help make sure your rights are protected. This includes ensuring you have the ability to exercise your rights in relation to your personal data and complain if you are dissatisfied (please see &amp;lsquo;Your rights&amp;rsquo; below). &lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Retention and deletion&lt;br&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;By law we have to keep basic information about our customers (including contact, identity, financial and transaction data) for 6 years after they cease being customers for tax purposes. We will delete other information about you within 12 months of your closing your account with Newsroom AI.&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;In some circumstances you can ask us to delete your data: see Your Rights below for further information.&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;In some circumstances we will anonymise your personal data (so that it can no longer be associated with you) for research or statistical purposes, in which case we may use this information indefinitely without further notice to you. &lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c14&quot;&gt;We will generally delete accounts in batches periodically (for example, quarterly, six monthly, yearly) so, depending on when the batch is run, your personal data may be deleted earlier or later than set out above.&lt;br&gt;&lt;br&gt;&lt;/span&gt;&lt;span class=&quot;c24&quot;&gt;Brand Experiences&lt;br&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;Brand experiences are brand stories and related formats, served via an ad server or as a landing page, for advertising purposes.&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;This ad server could be our own (https://svr.nws.ai) or from a third-party.&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;Brand experiences track certain metrics such as impressions and clicks for reporting and billing purposes. These metrics are tracked anonymously (no personally identifiable information is stored on our side). We log the user-agent and anonymized IP of the requests for 90 days.&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;Brand experiences may contain requests to the following domains:&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;stories.nws.ai&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;stories-getpublic.nws.ai&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;assets.nws.ai&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;assets-getpublic.nws.ai&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;assets-getpublic-cf1.nws.ai&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;assets-cf1.nws.ai&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;transform.nws.ai&lt;/span&gt;&lt;/p&gt;&lt;span class=&quot;c3&quot;&gt;transform-cf1.nws.ai&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;cdn.thenewsroom.io&lt;/span&gt;&lt;/p&gt;&lt;span class=&quot;c3&quot;&gt;cdn-cf1.nws.ai&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;svr.nws.ai&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;echo.nws.press&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;cdnapi.nws.ai&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;nws.studio&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;tags.nws.ai&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;heatmap.nws.ai&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;breeze.nws.ai&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;frost.nws.ai&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;tide.nws.ai&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;ember.nws.ai&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;arc.nws.ai&lt;/span&gt;&lt;/p&gt;&lt;br&gt;&lt;br&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Marketing&lt;br&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;We may use your information to provide you with information about our products and services, and also products and services from our partners and other relevant third parties whose services we believe you might be interested in.&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;We may need your consent to communicate by certain channels and we will always make sure we get this where we need to. &lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Marketing Opt Out&lt;br&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;You have the right to opt out of receiving marketing communications from us at any time (see &amp;lsquo;Your rights&amp;rsquo; below).&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Who we share your personal data with&lt;br&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;We may provide your personal data to third parties so that they provide services to us in connection with the Newsroom AI service. These third parties are obliged to keep your details secure and use them only to fulfil instructions provided by us. &amp;nbsp;Examples of the type of third parties we are likely to use are: cloud infrastructure and software-as-a-service providers (for example, Amazon Web Services), email service providers (for example, Mailchimp), auditors.&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Keeping your information safe&lt;br&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c16&quot;&gt;&lt;span class=&quot;c3&quot;&gt;We use a range of measures to keep your information safe and secure. &amp;nbsp;We require our staff and any third parties who carry out any work for us to comply with/appropriate compliance standards including obligations to protect information and applying appropriate measures for the use and transfer of information.&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c12&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c12&quot;&gt;What we expect from you&lt;br&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;We rely on you to make sure that the information you give us is accurate and up to date, and you must tell us if anything changes (such as your address) as soon as possible. &amp;nbsp;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Sale or purchase of the business&lt;br&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;We may provide your personal data to third parties to whom we may choose to sell, transfer or merge parts of our business or our assets. Alternatively, we may seek to acquire other businesses or merge with them. If a change happens to our business, then the new owners may use your personal data in the same way as set out in this privacy policy. &lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c12&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Your rights&lt;br&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c5&quot;&gt;&lt;span class=&quot;c3&quot;&gt;You have a number of rights in relation to the information that we hold about you including:&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c5 c20&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;ul class=&quot;c9 lst-kix_list_16-0 start&quot;&gt;&lt;li class=&quot;c2 li-bullet-0&quot;&gt;&lt;span class=&quot;c3&quot;&gt;the right to access information we hold about you and to obtain information about how we process it.&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c2 li-bullet-0&quot;&gt;&lt;span class=&quot;c3&quot;&gt;the right to withdraw your consent to us processing your information. &amp;nbsp;However, may continue to process your information if we have another lawful reason for doing so.&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c2 li-bullet-0&quot;&gt;&lt;span class=&quot;c3&quot;&gt;the right to receive certain information you&amp;rsquo;ve provided to us in an electronic format and/or request that we send it to a third party.&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c2 li-bullet-0&quot;&gt;&lt;span class=&quot;c3&quot;&gt;the right to request that we rectify your information if it is inaccurate or incomplete.&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c2 li-bullet-0&quot;&gt;&lt;span class=&quot;c3&quot;&gt;the right to ask us to delete your information. We may continue to keep your information if we are entitled or required to.&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c2 li-bullet-0&quot;&gt;&lt;span class=&quot;c3&quot;&gt;the right to object to, and to request that we restrict, our processing of your information in some circumstances&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;c2 li-bullet-0&quot;&gt;&lt;span class=&quot;c3&quot;&gt;the right not to receive marketing communications. &amp;nbsp;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c12&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c14&quot;&gt;If you wish to exercise any of the above rights please contact us at &lt;/span&gt;&lt;span class=&quot;c14 c23&quot;&gt;123 Buckingham Palace Road, London, England, SW1W 9SH&lt;/span&gt;&lt;span class=&quot;c3&quot;&gt;&amp;nbsp;or email support@nws.ai.&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c12&quot;&gt;Complaints&lt;br&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;If you are unhappy about how we are handling your personal data please contact us (see &amp;lsquo;Who we are&amp;rsquo; above for our contact details). You may also file a complaint with the Information Commissioner&amp;rsquo;s Office, which regulates our processing of personal data. You can contact the ICO as follows:&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;Phone: 0303 123 1113&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c3&quot;&gt;Post: Information Commissioner&amp;rsquo;s Office, Wycliffe House, Water Lane, Wilmslow SK9 5AF.&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c7&quot;&gt;&lt;span class=&quot;c14&quot;&gt;Going to their website at &lt;/span&gt;&lt;span class=&quot;c18 c14&quot;&gt;&lt;a class=&quot;c6&quot; href=&quot;https://www.google.com/url?q=http://www.ico.org.uk&amp;amp;sa=D&amp;amp;source=editors&amp;amp;ust=1625131580000000&amp;amp;usg=AOvVaw2ceAgrXhdNPA29ssnANWkm&quot;&gt;www.ico.org.uk&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;c3&quot;&gt;.&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c3&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;c1&quot;&gt;&lt;span class=&quot;c12&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;div&gt;&lt;p class=&quot;c11 c17&quot;&gt;&lt;span class=&quot;c15&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/body&gt;&lt;/html&gt;"></iframe></div></div></div></div></div></div></div></div><div class="Modal keep-sidebar"><div class="Modal-inner"><form><div class="Modal-body"><div class="Modal-block"></
