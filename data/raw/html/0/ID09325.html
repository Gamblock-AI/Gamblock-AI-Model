href="/penilaian-mandiri/jenis-hak-dan-subjek-data.html" class="font-nunito text-caption font-bold text-secondary">Cek Sekarang<!-- --> <!-- --><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 256 256" class="inline"><rect width="256" height="256" fill="none"></rect><polyline points="96 48 176 128 96 208" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="24"></polyline></svg></a></div><div class="flex flex-col justify-between text-neutral text-center"><div><div class="flex justify-center mb-5"><img src="/img/icons/2.png" alt=""></div><h3 class="font-nunito text-subtitle-xs md:text-subtitle font-bold mb-1">Pemrosesan Data dan Kewajiban Terkait</h3><p class="font-inter text-body-2-xs md:text-body-2 mb-4">Apakah DPO telah memenuhi kewajiban pada kegiatan pemrosesan untuk melindungi data subyek?</p></div><a href="/penilaian-mandiri/pemrosesan-data-dan-kewajiban-terkait.html" class="font-nunito text-caption font-bold text-secondary">Cek Sekarang<!-- --> <!-- --><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 256 256" class="inline"><rect width="256" height="256" fill="none"></rect><polyline points="96 48 176 128 96 208" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="24"></polyline></svg></a></div><div class="flex flex-col justify-between text-neutral text-center"><div><div class="flex justify-center mb-5"><img src="/img/icons/3.png" alt=""></div><h3 class="font-nunito text-subtitle-xs md:text-subtitle font-bold mb-1">Transfer Data</h3><p class="font-inter text-body-2-xs md:text-body-2 mb-4">Pahami ketentuan transfer data terkait dengan kegiatan, tujuan, serta cakupan wilayah transfer data.</p></div><span class="font-nunito text-caption font-bold text-neutral-100">Akan Hadir</span></div><div class="flex flex-col justify-between text-neutral text-center"><div><div class="flex justify-center mb-5"><img src="/img/icons/4.png" alt=""></div><h3 class="font-nunito text-subtitle-xs md:text-subtitle font-bold mb-1">Penyelesaian Sengketa dan Sanksi Pidana</h3><p class="font-inter text-body-2-xs md:text-body-2 mb-4">Pelajari alternatif penyelesaian sengketa dan sanksi pidana pelindungan data pribadi</p></div><span class="font-nunito text-caption font-bold text-neutral-100">Akan Hadir</span></div></div></div></div><div class="md:py-20 py-10" id="uu-pdp"><div class="max-w-6xl mx-auto px-5"><h2 class="uuPdp__MainTitle-sc-7arit8-0 dOqKlp">Peraturan Pelindungan Data Pribadi</h2><div class="uuPdp__RegulationWrapper-sc-7arit8-1 ekJenj"><div class="uuPdp__RegulationItem-sc-7arit8-2 ceHlng"><div class="uuPdp__WrapperReleaseDate-sc-7arit8-3 kUemBj"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256" class="inline"><rect width="256" height="256" fill="none"></rect><path d="M184,32H72A16,16,0,0,0,56,48V224a8.1,8.1,0,0,0,4.1,7,7.6,7.6,0,0,0,3.9,1,7.9,7.9,0,0,0,4.2-1.2L128,193.4l59.7,37.4a8.3,8.3,0,0,0,8.2.2,8.1,8.1,0,0,0,4.1-7V48A16,16,0,0,0,184,32Z"></path></svg><span class="uuPdp__InfoDate-sc-7arit8-4 dGkiOX">17 Oktober 2022</span></div><div class="uuPdp__WrapperMainContent-sc-7arit8-5 ieLARX"><a href="/data-peraturan/pelindungan-data-pribadi-tahun-2022.html"><h3 class="uuPdp__TitleRegulation-sc-7arit8-6 gGnggQ">UU No. 27/2022 tentang Pelindungan Data Pribadi</h3><p class="uuPdp__DescRegulation-sc-7arit8-7 hDgtyf">Data Pribadi adalah data tentang orang perseorangan yang teridentifikasi atau dapat diidentifikasi secara tersendiri atau dikombinasi dengan informasi lainnya baik secara langsung maupun tidak langsung melalui sistem elektronik atau nonelektronik...</p></a></div><div class="uuPdp__WrapperAdditionalDate-sc-7arit8-8 eKyiqv my-2 md:my-1"><div class="mr-3"><span class="font-medium text-neutral-300">Ditetapkan:<!-- --> <!-- --></span><span class="font-semibold text-neutral-500">19 Oktober 2022</span></div><div><span class="font-medium text-neutral-300">Ditetapkan:<!-- --> <!-- --></span><span class="font-semibold text-neutral-500">19 Oktober 2022</span></div></div><div class="uuPdp__WrapperStatus-sc-7arit8-9 igEneq"><span class="uuPdp__StatusContent-sc-7arit8-10 cKGJQz">Belum Dicabut / Diubah</span></div></div><div class="uuPdp__RegulationItem-sc-7arit8-2 ceHlng"><div class="uuPdp__WrapperMainContent-sc-7arit8-5 ieLARX"><a href="/data-peraturan/rancangan-peraturan-pelaksana.html"><h3 class="uuPdp__TitleRegulation-sc-7arit8-6 gGnggQ">Rancangan peraturan pelaksana</h3><p class="uuPdp__DescRegulation-sc-7arit8-7 hDgtyf">Rancangan Peraturan Pelaksana akan segera hadir.</p></a></div><div class="uuPdp__WrapperAdditionalDate-sc-7arit8-8 eKyiqv my-1"></div></div><div class="uuPdp__RegulationItem-sc-7arit8-2 ceHlng"><div class="uuPdp__WrapperMainContent-sc-7arit8-5 ieLARX"><a href="/data-peraturan/naskah-akademik-ruu-pelindungan-data-pribadi.html"><h3 class="uuPdp__TitleRegulation-sc-7arit8-6 gGnggQ">Naskah Akademik UU Pelindungan Data Pribadi</h3><p class="uuPdp__DescRegulation-sc-7arit8-7 hDgtyf">Dalam alinea ke-4 Pembukaan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, menyebutkan Pemerintah Negara Indonesia mempunyai kewajiban konstitusional melindungi segenap bangsa Indonesia dan seluruh tumpah darah Indonesia dan untuk memajukan kesejahteraan umum...</p></a></div></div></div></div></div><div class="bg-neutral-50 md:py-20 py-10" id="analysis"><div class="max-w-6xl mx-auto px-5"><h2 class="legalAnalysis__MainTitle-sc-yz0tbn-1 cfOgQT text-neutral-500">Legal Analysis</h2><div class="legalAnalysis__RegulationWrapper-sc-yz0tbn-2 dskFMj"><div class="legalAnalysis__RegulationItem-sc-yz0tbn-3 idYwbs"><a href="/legal-analysis/bagian-i-panduan-singkat-untuk-memahami-data-pribadi-jenis-dan-hak-subjek-data.html"><div class="legalAnalysis__WrapperReleaseDate-sc-yz0tbn-4 cMXtsL"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256" class="inline"><rect width="256" height="256" fill="none"></rect><path d="M184,32H72A16,16,0,0,0,56,48V224a8.1,8.1,0,0,0,4.1,7,7.6,7.6,0,0,0,3.9,1,7.9,7.9,0,0,0,4.2-1.2L128,193.4l59.7,37.4a8.3,8.3,0,0,0,8.2.2,8.1,8.1,0,0,0,4.1-7V48A16,16,0,0,0,184,32Z"></path></svg><span class="legalAnalysis__InfoDate-sc-yz0tbn-5 bmxqNd">28 September 2022</span></div><div class="legalAnalysis__WrapperMainContent-sc-yz0tbn-6 kFybVv"><h3 class="legalAnalysis__TitleRegulation-sc-yz0tbn-7 ffmuku">Bagian I - Panduan Singkat untuk Memahami Data Pribadi: Jenis dan Hak Subjek Data</h3><p class="legalAnalysis__DescLimit-sc-yz0tbn-12 fdxVJg font-inter text-body-3-xs md:text-body-3 font-medium text-neutral-500">Dewan Perwakilan Rakyat Indonesia (“DPR”) akhirnya meloloskan RUU tentang Perlindungan Data Pribadi (“RUU PDP”), yang akan menjadi payung hukum perlindungan Data Pribadi (“Data”) di Indonesia...</p></div></a></div><div class="legalAnalysis__RegulationItem-sc-yz0tbn-3 idYwbs"><a href="/legal-analysis/bagian-ii---panduan-singkat-untuk-memahami-data-pribadi--pemrosesan-data-dan-kewajiban-terkait.html"><div class="legalAnalysis__WrapperReleaseDate-sc-yz0tbn-4 cMXtsL"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256" class="inline"><rect width="256" height="256" fill="none"></rect><path d="M184,32H72A16,16,0,0,0,56,48V224a8.1,8.1,0,0,0,4.1,7,7.6,7.6,0,0,0,3.9,1,7.9,7.9,0,0,0,4.2-1.2L128,193.4l59.7,37.4a8.3,8.3,0,0,0,8.2.2,8.1,8.1,0,0,0,4.1-7V48A16,16,0,0,0,184,32Z"></path></svg><span class="legalAnalysis__InfoDate-sc-yz0tbn-5 bmxqNd">5 Oktober 2022</span></div><div class="legalAnalysis__WrapperMainContent-sc-yz0tbn-6 kFybVv"><h3 class="legalAnalysis__TitleRegulation-sc-yz0tbn-7 ffmuku">Bagian II - Panduan Singkat untuk Memahami Data Pribadi: Pemrosesan Data dan Kewajiban Terkait</h3><p class="legalAnalysis__DescLimit-sc-yz0tbn-12 fdxVJg font-inter text-body-3-xs md:text-body-3 font-medium text-neutral-500">Melanjutkan bagian pertama dari seri empat bagian Indonesian Law Digest(“ILD”) yang membahas tentang pelindungan data pribadi (“Data”) yang mencakup klasifikasi Data dan hak subyek Data (“Subyek”), bagian kedua ini akan memberikan analisis mengenai berbagai hal yang berkaitan dengan pemrosesan Data (“Pemrosesan”), termasuk para pihak yang terlibat, termasuk pengendali Data (“Pengendali”), prosesor Data (“Prosesor”), Subyek dan  pejabat atau petugas data pribadi (Data Protection Officers – “DPO”).</p></div></a></div><div class="legalAnalysis__RegulationItem-sc-yz0tbn-3 idYwbs"><a href="/legal-analysis/bagian-iii---panduan-singkat-dalam-memahami-data-pribadi--klasifikasi-dan-praktik-transfer-data-terbaik.html"><div class="legalAnalysis__WrapperReleaseDate-sc-yz0tbn-4 cMXtsL"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256" class="inline"><rect width="256" height="256" fill="none"></rect><path d="M184,32H72A16,16,0,0,0,56,48V224a8.1,8.1,0,0,0,4.1,7,7.6,7.6,0,0,0,3.9,1,7.9,7.9,0,0,0,4.2-1.2L128,193.4l59.7,37.4a8.3,8.3,0,0,0,8.2.2,8.1,8.1,0,0,0,4.1-7V48A16,16,0,0,0,184,32Z"></path></svg><span class="legalAnalysis__InfoDate-sc-yz0tbn-5 bmxqNd">12 Oktober 2022</span></div><div class="legalAnalysis__WrapperMainContent-sc-yz0tbn-6 kFybVv"><h3 class="legalAnalysis__TitleRegulation-sc-yz0tbn-7 ffmuku">Bagian III - Panduan Singkat Dalam Memahami Data Pribadi: Klasifikasi dan Praktik Transfer Data Terbaik</h3><p class="legalAnalysis__DescLimit-sc-yz0tbn-12 fdxVJg font-inter text-body-3-xs md:text-body-3 font-medium text-neutral-500">Pembahasan dalam edisi Indonesian Law Digest (“ILD”) kali ini melanjutkan bagian pertama dan kedua dari rangkaian pembahasan kami tentang pelindungan data pribadi (“Data”) yang terbagi menjadi empat bagian. </p></div></a></div><div class="legalAnalysis__RegulationItem-sc-yz0tbn-3 idYwbs"><a href="/legal-analysis/bagian-iv---pedoman-singkat-dalam-memahami-data-pribadi--penyelesaian-sengketa-dan-sanksi-pidana.html"><div class="legalAnalysis__WrapperReleaseDate-sc-yz0tbn-4 cMXtsL"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256" class="inline"><rect width="256" height="256" fill="none"></rect><path d="M184,32H72A16,16,0,0,0,56,48V224a8.1,8.1,0,0,0,4.1,7,7.6,7.6,0,0,0,3.9,1,7.9,7.9,0,0,0,4.2-1.2L128,193.4l59.7,37.4a8.3,8.3,0,0,0,8.2.2,8.1,8.1,0,0,0,4.1-7V48A16,16,0,0,0,184,32Z"></path></svg><span class="legalAnalysis__InfoDate-sc-yz0tbn-5 bmxqNd">19 Oktober 2022</span></div><div class="legalAnalysis__WrapperMainContent-sc-yz0tbn-6 kFybVv"><h3 class="legalAnalysis__TitleRegulation-sc-yz0tbn-7 ffmuku">Bagian IV - Pedoman Singkat dalam Memahami Data Pribadi: Penyelesaian Sengketa dan Sanksi Pidana</h3><p class="legalAnalysis__DescLimit-sc-yz0tbn-12 fdxVJg font-inter text-body-3-xs md:text-body-3 font-medium text-neutral-500">Pemerintah Indonesia akhirnya menerbitkan Undang-Undang No. 27 tahun 2022 tentang Pelindungan Data Pribadi (“UU PDP”) tanggal 17 Oktober 2022, dengan isi yang sama dengan yang awalnya ditetapkan dalam  Rancangan Undang-Undang Pelindungan Data Pribadi (“RUU PDP”), yang diterbitkan melalui situs web resmi Dewan Perwakilan Rakyat pada tanggal 20 September 2022. Salah satu isu penting yang diatur dalam UU PDP adalah penyalahgunaan data pribadi (“Data”) subyek Data (“Subyek”), yang dapat menyebabkan dijatuhinya sanksi pidana dalam bentuk kurungan penjara atau denda.</p></div></a></div></div></div></div><div id="perspektif" class="overflow-hidden"><div class="max-w-6xl mx-auto md:py-20 py-10 px-5"><h2 class="opiniSection__MainTitle-sc-i8ui3c-1 dmannw text-neutral-500">Perspektif</h2><div class="relative"><div class="carousel_carousel__RtPJj"><div class="carousel_item__Kf8pY grid md:grid-cols-3 gap-8 grid-cols-1 carousel_active__qALet"><div class="flex flex-col"><a href="https://www.hukumonline.com/berita/a/pelanggaran-data-pribadi-dalam-tindakan-doxing-lt62da09ab09312/?utm_source=datapribadi_id&amp;utm_medium=perspektif&amp;utm_campaign=pdp"><div><h3 class="font-nunito text-title-xs md:text-title font-bold text-primary mb-2">Pelanggaran Data Pribadi dalam Tindakan Doxing</h3><p class="font-inter text-body-2-xs md:text-body-2 text-neutral-300">Melihat perkembangan kasus yang terus bertambah dan merugikan korban, maka seharusnya tindakan doxing diatur dalam RUU Perlindungan Data Pribadi Indonesia yang sedang dalam pembahasan di DPR.</p></div></a><div class="flex  mt-3"><div class="mr-3  rounded-full object-cover overflow-hidden" style="position: relative; width: 32px; max-height: 32px;"><span style="box-sizing: border-box; display: block; overflow: hidden; width: initial; height: initial; background: none; opacity: 1; border: 0px; margin: 0px; padding: 0px; position: absolute; inset: 0px;"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" decoding="async" data-nimg="fill" style="position: absolute; inset: 0px; box-sizing: border-box; padding: 0px; border: none; margin: auto; display: block; width: 0px; height: 0px; min-width: 100%; max-width: 100%; min-height: 100%; max-height: 100%; object-fit: cover;"><noscript></noscript></span></div><div class="flex flex-col font-inter"><span class="text-caption-xs md:text-caption font-semibold text-primary-500  ">Sinta Dewi</span><span class="text-caption-xs md:text-caption font-medium text-neutral-300  ">Dosen Hukum Teknologi, Informasi dan Komunikasi</span></div></div></div><div class="flex flex-col"><a href="https://www.hukumonline.com/berita/a/perlindungan-data-pribadi--siapa-berhak-mengawasi-lt63366e9ace219/?utm_source=datapribadi_id&amp;utm_medium=perspektif&amp;utm_campaign=pdp"><div><h3 class="font-nunito text-title-xs md:text-title font-bold text-primary mb-2">Perlindungan Data Pribadi, Siapa Berhak Mengawasi?</h3><p class="font-inter text-body-2-xs md:text-body-2 text-neutral-300">Agar tercipta kepastian hukum dari UU PDP tersebut maka akan lebih baik ditentukan kurun waktu maksimal berapa lama setelah diundangkannya RUU PDP untuk peraturan turunan tersebut harus diterbitkan.</p></div></a><div class="flex  mt-3"><div class="mr-3  rounded-full object-cover overflow-hidden" style="position: relative; width: 32px; max-height: 32px;"><span style="box-sizing: border-box; display: block; overflow: hidden; width: initial; height: initial; background: none; opacity: 1; border: 0px; margin: 0px; padding: 0px; position: absolute; inset: 0px;"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" decoding="async" data-nimg="fill" style="position: absolute; inset: 0px; box-sizing: border-box; padding: 0px; border: none; margin: auto; display: block; width: 0px; height: 0px; min-width: 100%; max-width: 100%; min-height: 100%; max-height: 100%; object-fit: cover;"><noscript></noscript></span></div><div class="flex flex-col font-inter"><span class="text-caption-xs md:text-caption font-semibold text-primary-500  ">Wulan Fitriana</span><span class="text-caption-xs md:text-caption font-medium text-neutral-300  ">Advokat di Daerah Istimewa Yogyakarta</span></div></div></div><div class="flex flex-col"><a href="https://www.hukumonline.com/berita/a/uu-pelindungan-data-pribadi--apa-artinya-bagi-dunia-usaha-lt6329dc26670cd/?utm_source=datapribadi_id&amp;utm_medium=perspektif&amp;utm_campaign=pdp"><div><h3 class="font-nunito text-title-xs md:text-title font-bold text-primary mb-2">UU Pelindungan Data Pribadi, Apa Artinya Bagi Dunia Usaha?</h3><p class="font-inter text-body-2-xs md:text-body-2 text-neutral-300">Terdapat beberapa aturan penting yang perlu diantisipasi oleh pelaku usaha terkait dengan UU PDP.</p></div></a><div class="flex  mt-3"><div class="mr-3  rounded-full object-cover overflow-hidden" style="position: relative; width: 32px; max-height: 32px;"><span style="box-sizing: border-box; display: block; overflow: hidden; width: initial; height: initial; background: none; opacity: 1; border: 0px; margin: 0px; padding: 0px; position: absolute; inset: 0px;"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" decoding="async" data-nimg="fill" style="position: absolute; inset: 0px; box-sizing: border-box; padding: 0px; border: none; margin: auto; display: block; width: 0px; height: 0px; min-width: 100%; max-width: 100%; min-height: 100%; max-height: 100%; object-fit: cover;"><noscript></noscript></span></div><div class="flex flex-col font-inter"><span class="text-caption-xs md:text-caption font-semibold text-primary-500  ">Danny Kobrata</span><span class="text-caption-xs md:text-caption font-medium text-neutral-300  ">Pendiri dan Pengurus</span></div></div></div></div><div class="carousel_item__Kf8pY grid md:grid-cols-3 gap-8 grid-cols-1 "><div class="flex flex-col"><a href="https://www.hukumonline.com/berita/a/pelindungan-privasi-pasca-pembatalan-roe-v-wade-lt62e88a00f140a/?utm_source=datapribadi_id&amp;utm_medium=perspektif&amp;utm_campaign=pdp"><div><h3 class="font-nunito text-title-xs md:text-title font-bold text-primary mb-2">Pelindungan Privasi Pasca Pembatalan Roe v Wade</h3><p class="font-inter text-body-2-xs md:text-body-2 text-neutral-300">Publik Amerika Serikat dikejutkan dengan beredarnya putusan Mahkamah Agung Amerika Serikat/Supreme Court of the United States (SCOTUS) untuk perkara Dobbs v. Jackson pada 24 Juni 2022. </p></div></a><div class="flex  mt-3"><div class="mr-3  rounded-full object-cover overflow-hidden" style="position: relative; width: 32px; max-height: 32px;"><span style="box-sizing: border-box; display: block; overflow: hidden; width: initial; height: initial; background: none; opacity: 1; border: 0px; margin: 0px; padding: 0px; position: absolute; inset: 0px;"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" decoding="async" data-nimg="fill" style="position: absolute; inset: 0px; box-sizing: border-box; padding: 0px; border: none; margin: auto; display: block; width: 0px; height: 0px; min-width: 1
